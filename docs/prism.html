<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Prism</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    .back {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      z-index: 20;
      transition: color 0.2s;
    }
    .back:hover { color: var(--accent); }

    .title-badge {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 20;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0.6;
    }

    /* --- Panel --- */
    .panel {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(18, 18, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      transition: opacity 0.4s, transform 0.4s;
      max-width: 90vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    .panel.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      min-width: 80px;
    }

    .ctrl-label {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .ctrl-value {
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      min-width: 2em;
      text-align: right;
      display: inline-block;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 90px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 8px var(--accent);
    }

    /* Algorithm buttons */
    .algo-grid {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      max-width: 220px;
    }

    .algo-btn {
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .algo-btn:hover { border-color: var(--accent); color: var(--text); }
    .algo-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(124, 111, 224, 0.1); }

    /* Action buttons */
    .action-btn {
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.mic-active { border-color: var(--green); color: var(--green); }

    /* Hint */
    .hint {
      position: fixed;
      bottom: 7.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      z-index: 10;
      opacity: 0;
      transition: opacity 1s;
      pointer-events: none;
    }
    .hint.show { opacity: 0.5; }

    /* Palette indicator */
    .palette-dots {
      display: flex;
      gap: 3px;
      margin-top: 2px;
    }
    .palette-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    @media (max-width: 700px) {
      .panel { gap: 0.8rem; padding: 0.8rem 1rem; }
      input[type="range"] { width: 70px; }
      .algo-grid { max-width: 160px; }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<a class="back" href="index.html">&larr; lattice</a>
<div class="title-badge">prism</div>

<div class="hint" id="hint">move mouse to warp &middot; H to toggle panel &middot; space to pause</div>

<div class="panel" id="panel">
  <div class="ctrl-group">
    <span class="ctrl-label">algorithm</span>
    <div class="algo-grid" id="algoGrid"></div>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">symmetry <span class="ctrl-value" id="symVal">6</span></span>
    <input type="range" id="symmetry" min="2" max="16" value="6" step="1">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">speed <span class="ctrl-value" id="speedVal">0.5</span></span>
    <input type="range" id="speed" min="0" max="1" value="0.5" step="0.01">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">zoom <span class="ctrl-value" id="zoomVal">1.0</span></span>
    <input type="range" id="zoom" min="0.2" max="3" value="1" step="0.01">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">warp <span class="ctrl-value" id="warpVal">0.3</span></span>
    <input type="range" id="warp" min="0" max="1" value="0.3" step="0.01">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">palette</span>
    <div class="palette-dots" id="palDots"></div>
    <input type="range" id="palette" min="0" max="7" value="0" step="1">
  </div>

  <div class="ctrl-group" style="gap: 0.4rem;">
    <button class="action-btn" id="micBtn" title="Toggle microphone">mic</button>
    <button class="action-btn" id="exportBtn" title="Export PNG">export</button>
  </div>
</div>

<script>
// =========================================================
// PRISM — Kaleidoscopic Algorithm Explorer
// =========================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- State ---
let W, H, cx, cy;
let mouse = { x: 0.5, y: 0.5 };
let time = 0;
let paused = false;
let panelVisible = true;
let micActive = false;
let micLevel = 0;
let analyser = null;
let micData = null;

// --- Algorithms ---
const ALGOS = [
  { id: 'julia',    name: 'Julia' },
  { id: 'flow',     name: 'Flow' },
  { id: 'rd',       name: 'React-Diff' },
  { id: 'noise',    name: 'Noise' },
  { id: 'spiral',   name: 'Spiral' },
  { id: 'wave',     name: 'Wave' },
];
let activeAlgo = 'julia';

// --- Palettes ---
const PALETTES = [
  // 0: Amethyst
  ['#0a0a0f', '#1a0a3e', '#3d1e8e', '#7c6fe0', '#b8a9ff', '#e8e0ff'],
  // 1: Emerald
  ['#0a0a0f', '#0a1f0a', '#0e4a1e', '#1e8e3d', '#4ade80', '#a8ffc8'],
  // 2: Ember
  ['#0a0a0f', '#2a0a0a', '#6e1a0a', '#c44a0a', '#fbbf24', '#fff4d4'],
  // 3: Frost
  ['#0a0a0f', '#0a0a2a', '#1a2a5e', '#3a6abf', '#7ab4ff', '#d0e8ff'],
  // 4: Blood Moon
  ['#0a0a0f', '#1a0505', '#4a0a0a', '#8e1a1a', '#ef4444', '#ffa0a0'],
  // 5: Aurora
  ['#0a0a0f', '#0a1a2e', '#1a4a3e', '#2e8a6e', '#4ade80', '#a8e0ff'],
  // 6: Void
  ['#0a0a0f', '#10101a', '#1a1a2a', '#2a2a3e', '#4a4a6e', '#8080a0'],
  // 7: Neon
  ['#0a0a0f', '#1a0a3e', '#7c6fe0', '#ff3e9d', '#4ade80', '#fbbf24'],
];
let activePalette = 0;

// --- Seeded PRNG ---
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// --- Resize ---
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// --- Palette interpolation ---
function lerpColor(a, b, t) {
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const r = Math.round(pa[0] + (pb[0]-pa[0]) * t);
  const g = Math.round(pa[1] + (pb[1]-pa[1]) * t);
  const bl = Math.round(pa[2] + (pb[2]-pa[2]) * t);
  return `rgb(${r},${g},${bl})`;
}

function samplePalette(t, pal) {
  t = Math.max(0, Math.min(1, t));
  const n = pal.length - 1;
  const i = Math.floor(t * n);
  const f = t * n - i;
  return lerpColor(pal[Math.min(i, n)], pal[Math.min(i+1, n)], f);
}

// --- Noise functions ---
// Simplex-like 2D noise via permutation table
const P = new Uint8Array(512);
(function initPerm() {
  const rng = mulberry32(42);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
})();

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + (b - a) * t; }

function grad2d(hash, x, y) {
  const h = hash & 3;
  return (h & 1 ? -x : x) + (h & 2 ? -y : y);
}

function noise2d(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = P[P[xi] + yi], ab = P[P[xi] + yi + 1];
  const ba = P[P[xi + 1] + yi], bb = P[P[xi + 1] + yi + 1];
  return lerp(
    lerp(grad2d(aa, xf, yf), grad2d(ba, xf - 1, yf), u),
    lerp(grad2d(ab, xf, yf - 1), grad2d(bb, xf - 1, yf - 1), u),
    v
  );
}

function fbm(x, y, octaves) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * noise2d(x * freq, y * freq);
    amp *= 0.5;
    freq *= 2.1;
  }
  return val;
}

// =========================================================
// Algorithm field functions: return value 0..1 for point (x,y)
// =========================================================

function algoJulia(x, y, t, mx, my) {
  // Julia set with animated c parameter
  const cr = -0.7 + mx * 0.4 + Math.sin(t * 0.3) * 0.1;
  const ci = 0.27 + my * 0.3 + Math.cos(t * 0.25) * 0.1;
  let zr = x, zi = y;
  let iter = 0;
  const maxIter = 40;
  while (zr * zr + zi * zi < 4 && iter < maxIter) {
    const tmp = zr * zr - zi * zi + cr;
    zi = 2 * zr * zi + ci;
    zr = tmp;
    iter++;
  }
  if (iter === maxIter) return 0;
  // Smooth coloring
  const smooth = iter - Math.log2(Math.log2(zr * zr + zi * zi));
  return smooth / maxIter;
}

function algoFlow(x, y, t, mx, my) {
  // Domain-warped flow field
  const warpX = fbm(x + t * 0.15, y, 4);
  const warpY = fbm(x, y + t * 0.15, 4);
  const wx = x + warpX * 1.5 + mx * 0.5;
  const wy = y + warpY * 1.5 + my * 0.5;
  const v = fbm(wx, wy, 5);
  return v * 0.5 + 0.5;
}

function algoRD(x, y, t, mx, my) {
  // Reaction-diffusion approximation via noise layers
  const s = 3.0;
  const a = noise2d(x * s + t * 0.1, y * s);
  const b = noise2d(x * s * 2.3 + 1.7, y * s * 2.3 + t * 0.08);
  const dist = Math.sqrt((x - mx) * (x - mx) + (y - my) * (y - my));
  const influence = Math.exp(-dist * 2);
  const pattern = Math.sin(a * 6 + t * 0.5) * Math.cos(b * 4 - t * 0.3);
  const v = pattern * (1 + influence * 0.5);
  return v * 0.5 + 0.5;
}

function algoNoise(x, y, t, mx, my) {
  // Fractal noise with domain warping
  const dx = fbm(x + t * 0.05, y + t * 0.08, 3) + mx * 0.3;
  const dy = fbm(x - t * 0.07, y + t * 0.04, 3) + my * 0.3;
  const v = fbm(x + dx * 2, y + dy * 2, 6);
  // Ridge noise variant
  const ridge = 1 - Math.abs(v);
  return ridge;
}

function algoSpiral(x, y, t, mx, my) {
  // Hypotrochoid / spirograph
  const r = Math.sqrt(x * x + y * y);
  const a = Math.atan2(y, x);
  const spiral = Math.sin(r * 8 - t * 1.5 + a * 3) * 0.5 +
                 Math.sin(r * 5 + t * 0.8 - a * 5) * 0.3 +
                 Math.sin(a * 7 + Math.sin(r * 3 + t)) * 0.2;
  const md = Math.sqrt(mx * mx + my * my);
  const pulse = Math.sin(r * 4 - md * 10 + t) * 0.15;
  return (spiral + pulse) * 0.5 + 0.5;
}

function algoWave(x, y, t, mx, my) {
  // Interference pattern from multiple wave sources
  let v = 0;
  const sources = [
    { sx: mx * 2, sy: my * 2, f: 8, p: t * 1.2 },
    { sx: -1.5, sy: 0.5, f: 6, p: -t * 0.9 },
    { sx: 1, sy: -1, f: 10, p: t * 0.7 },
    { sx: Math.sin(t * 0.4) * 1.5, sy: Math.cos(t * 0.3) * 1.5, f: 7, p: t * 1.1 },
  ];
  for (const s of sources) {
    const d = Math.sqrt((x - s.sx) * (x - s.sx) + (y - s.sy) * (y - s.sy));
    v += Math.sin(d * s.f + s.p) / sources.length;
  }
  return v * 0.5 + 0.5;
}

const ALGO_FN = {
  julia: algoJulia,
  flow: algoFlow,
  rd: algoRD,
  noise: algoNoise,
  spiral: algoSpiral,
  wave: algoWave,
};

// =========================================================
// Rendering
// =========================================================

// Offscreen buffer for the source wedge
const srcCanvas = document.createElement('canvas');
const srcCtx = srcCanvas.getContext('2d');

function renderFrame(dt) {
  const sym = parseInt(document.getElementById('symmetry').value);
  const spd = parseFloat(document.getElementById('speed').value);
  const zm = parseFloat(document.getElementById('zoom').value);
  const wrp = parseFloat(document.getElementById('warp').value);
  const pal = PALETTES[activePalette];

  time += dt * spd * 0.001;

  // Mouse in normalized -1..1
  const mx = (mouse.x - 0.5) * 2 * wrp;
  const my = (mouse.y - 0.5) * 2 * wrp;

  // Audio modulation
  let audioMod = 0;
  if (micActive && analyser && micData) {
    analyser.getByteFrequencyData(micData);
    let sum = 0;
    for (let i = 0; i < micData.length; i++) sum += micData[i];
    micLevel = sum / (micData.length * 255);
    audioMod = micLevel;
  }

  const fn = ALGO_FN[activeAlgo];
  const radius = Math.min(W, H) * 0.5;

  // Render source wedge into offscreen buffer
  // We compute a single "slice" of the scene, then reflect it for kaleidoscope
  const wedgeAngle = (Math.PI * 2) / sym;
  const res = Math.min(400, Math.floor(radius)); // pixel resolution along radius
  const angSteps = Math.max(20, Math.floor(res * wedgeAngle / Math.PI));

  srcCanvas.width = res;
  srcCanvas.height = angSteps;
  const imgData = srcCtx.createImageData(res, angSteps);
  const data = imgData.data;

  const scale = 3.0 / zm / (1 + audioMod * 0.5);
  const rotation = time * 0.1;

  for (let ay = 0; ay < angSteps; ay++) {
    const angle = (ay / angSteps) * wedgeAngle + rotation;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    for (let rx = 0; rx < res; rx++) {
      const r = rx / res;
      // Map to scene coordinates
      const sx = r * cosA * scale;
      const sy = r * sinA * scale;

      let v = fn(sx, sy, time + audioMod * 2, mx, my);
      v = Math.max(0, Math.min(1, v));

      // Audio brightness boost
      v = v * (1 + audioMod * 0.4);
      v = Math.min(1, v);

      const color = samplePalette(v, pal);
      // Parse rgb
      const match = color.match(/\d+/g);
      const idx = (ay * res + rx) * 4;
      data[idx] = parseInt(match[0]);
      data[idx+1] = parseInt(match[1]);
      data[idx+2] = parseInt(match[2]);
      data[idx+3] = 255;
    }
  }
  srcCtx.putImageData(imgData, 0, 0);

  // --- Draw kaleidoscope ---
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);

  for (let i = 0; i < sym; i++) {
    const angle = (i / sym) * Math.PI * 2;
    const flip = i % 2 === 1;

    ctx.save();
    ctx.rotate(angle);
    if (flip) ctx.scale(1, -1);

    // Clip to wedge
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius * 1.5, 0);
    ctx.arc(0, 0, radius * 1.5, 0, wedgeAngle);
    ctx.closePath();
    ctx.clip();

    // Draw source wedge stretched to fill the sector
    ctx.save();
    // Map: srcCanvas covers [0, wedgeAngle] x [0, radius]
    // We draw it as a series of radial lines for accurate mapping
    // Use drawImage for performance — stretch the rectangular buffer into the wedge
    // Approximate: rotate so the wedge aligns, then stretch
    for (let ay = 0; ay < angSteps; ay++) {
      const a0 = (ay / angSteps) * wedgeAngle;
      const a1 = ((ay + 1) / angSteps) * wedgeAngle;
      const midA = (a0 + a1) / 2;

      ctx.save();
      ctx.rotate(midA);

      // Draw a thin strip from the source
      ctx.drawImage(srcCanvas,
        0, ay, res, 1,    // source rect
        0, -2, radius, 4  // dest rect (thin strip along radius)
      );
      ctx.restore();
    }
    ctx.restore();
    ctx.restore();
  }

  ctx.restore();

  // Vignette
  const vg = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius * 1.1);
  vg.addColorStop(0, 'rgba(10,10,15,0)');
  vg.addColorStop(1, 'rgba(10,10,15,0.85)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // Center glow
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30 + audioMod * 20);
  cg.addColorStop(0, pal[3] + '30');
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.fillRect(cx - 60, cy - 60, 120, 120);
}

// =========================================================
// Animation loop
// =========================================================

let lastTime = 0;
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  if (!paused) renderFrame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// =========================================================
// Controls
// =========================================================

// Build algo buttons
const algoGrid = document.getElementById('algoGrid');
ALGOS.forEach(a => {
  const btn = document.createElement('button');
  btn.className = 'algo-btn' + (a.id === activeAlgo ? ' active' : '');
  btn.textContent = a.name;
  btn.dataset.id = a.id;
  btn.addEventListener('click', () => {
    activeAlgo = a.id;
    algoGrid.querySelectorAll('.algo-btn').forEach(b => b.classList.toggle('active', b.dataset.id === a.id));
  });
  algoGrid.appendChild(btn);
});

// Slider updates
function bindSlider(id, valId, fmt) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  el.addEventListener('input', () => { valEl.textContent = fmt ? fmt(el.value) : el.value; });
}
bindSlider('symmetry', 'symVal');
bindSlider('speed', 'speedVal', v => parseFloat(v).toFixed(2));
bindSlider('zoom', 'zoomVal', v => parseFloat(v).toFixed(1));
bindSlider('warp', 'warpVal', v => parseFloat(v).toFixed(2));

// Palette slider + dots
const palSlider = document.getElementById('palette');
const palDots = document.getElementById('palDots');
function updatePalDots() {
  palDots.innerHTML = '';
  PALETTES[activePalette].slice(1).forEach(c => {
    const d = document.createElement('div');
    d.className = 'palette-dot';
    d.style.background = c;
    palDots.appendChild(d);
  });
}
updatePalDots();
palSlider.addEventListener('input', () => {
  activePalette = parseInt(palSlider.value);
  updatePalDots();
});

// Mouse
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX / W;
  mouse.y = e.clientY / H;
});
window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX / W;
  mouse.y = e.touches[0].clientY / H;
}, { passive: false });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    paused = !paused;
  }
  if (e.key === 'h' || e.key === 'H') {
    panelVisible = !panelVisible;
    document.getElementById('panel').classList.toggle('hidden', !panelVisible);
  }
  // Number keys switch algorithm
  const num = parseInt(e.key);
  if (num >= 1 && num <= ALGOS.length) {
    activeAlgo = ALGOS[num - 1].id;
    algoGrid.querySelectorAll('.algo-btn').forEach(b => b.classList.toggle('active', b.dataset.id === activeAlgo));
  }
  // Arrow keys adjust symmetry
  if (e.key === 'ArrowUp') {
    const s = document.getElementById('symmetry');
    s.value = Math.min(16, parseInt(s.value) + 1);
    s.dispatchEvent(new Event('input'));
  }
  if (e.key === 'ArrowDown') {
    const s = document.getElementById('symmetry');
    s.value = Math.max(2, parseInt(s.value) - 1);
    s.dispatchEvent(new Event('input'));
  }
});

// Mic button
document.getElementById('micBtn').addEventListener('click', async () => {
  if (micActive) {
    micActive = false;
    document.getElementById('micBtn').classList.remove('mic-active');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    micData = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    document.getElementById('micBtn').classList.add('mic-active');
  } catch (err) {
    console.warn('Mic access denied:', err);
  }
});

// Export
document.getElementById('exportBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `lattice-prism-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// Show hint briefly
const hint = document.getElementById('hint');
hint.classList.add('show');
setTimeout(() => hint.classList.remove('show'), 5000);
</script>
</body>
