<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Codex</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #ef4444;
      --cyan: #22d3ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--green); }

    /* ── Back button ── */
    .back {
      position: fixed;
      top: 1.2rem;
      left: 1.5rem;
      z-index: 200;
      color: var(--text-dim);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back:hover { color: var(--text); }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 5rem 1.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0.08;
    }

    .hero-content { position: relative; z-index: 1; }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent-glow);
      margin-bottom: 0.5rem;
    }

    .hero .subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Species nav ── */
    .species-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      justify-content: center;
      flex-wrap: wrap;
    }

    .species-nav::-webkit-scrollbar { height: 0; }

    .species-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.7rem;
      border-radius: 12px;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      text-decoration: none;
    }

    .species-chip:hover, .species-chip.active {
      border-color: var(--accent);
      color: var(--text);
    }

    .species-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ── Container ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Species entry ── */
    .species-entry {
      padding: 3rem 0;
      border-top: 1px solid var(--border);
      scroll-margin-top: 3.5rem;
    }

    .species-entry:first-child { border-top: none; }

    .species-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .species-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .species-name {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .species-tagline {
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    /* ── Two-column layout ── */
    .species-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .species-body { grid-template-columns: 1fr; }
    }

    /* ── Demo canvas ── */
    .demo-wrap {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
    }

    .demo-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .demo-label {
      position: absolute;
      bottom: 0.4rem;
      right: 0.5rem;
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .demo-step {
      position: absolute;
      top: 0.4rem;
      left: 0.5rem;
      font-size: 0.55rem;
      color: var(--green);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Info panel ── */
    .species-info h3 {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      margin-top: 1.2rem;
    }

    .species-info h3:first-child { margin-top: 0; }

    .species-info p {
      font-size: 0.78rem;
      line-height: 1.65;
      color: var(--text);
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      text-align: center;
    }

    .stat-card .val {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--green);
    }

    .stat-card .label {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.15rem;
    }

    /* ── Genome params ── */
    .param-list {
      list-style: none;
      margin-top: 0.3rem;
    }

    .param-list li {
      font-size: 0.72rem;
      padding: 0.25rem 0;
      border-bottom: 1px solid rgba(30, 30, 46, 0.5);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .param-list .key { color: var(--text-dim); }
    .param-list .val { color: var(--cyan); font-variant-numeric: tabular-nums; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.7rem;
    }

    /* ── Vignette ── */
    .vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 50;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(10, 10, 15, 0.5) 100%);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>

<div class="vignette"></div>
<a href="index.html" class="back">&larr; gallery</a>

<div class="hero">
  <canvas id="hero-canvas"></canvas>
  <div class="hero-content">
    <h1>Codex</h1>
    <p class="subtitle">A field guide to every species in the Lattice ecosystem. Eleven algorithms, each a different form of artificial life.</p>
  </div>
</div>

<nav class="species-nav" id="species-nav"></nav>

<div class="container" id="entries"></div>

<footer>
  <a href="index.html">Gallery</a> &bull;
  <a href="live.html">Live</a> &bull;

</footer>

<script>
// ──────────────────────────────────────────────────────
//  Lattice — Codex: Species Field Guide
// ──────────────────────────────────────────────────────

const SPECIES = [
  {

    params: ['rule (0–255)', 'width', 'seed pattern'],
    howItWorks: 'Each cell looks at itself and its two neighbors (3 cells = 8 possible states). The rule number, written in binary, maps each of these 8 states to 0 or 1. Rule 30 produces chaos. Rule 110 is Turing-complete. Rule 90 builds Sierpinski triangles.'

    params: ['octaves', 'lacunarity', 'persistence', 'scale'],

const TYPE_COLORS = {

  'julia':               ['#0a0a0f', '#1a0a2d', '#3b1d6b', '#6b3edb', '#9d7af5', '#c8abff', '#e8d8ff', '#ffffff'],
  'strange-attractor':   ['#0a0a0f', '#2d1a0a', '#6b3a0d', '#a85c16', '#db7b22', '#f5a04a', '#ffc888', '#fff0d4'],
  'spirograph':          ['#0a0a0f', '#2d0a1a', '#6b0d3b', '#a8166b', '#db22a8', '#f54ad4', '#ff88f0', '#ffd4f8'],
  'fractal-noise':       ['#0a0a0f', '#1a2d0a', '#3b6b0d', '#6ba816', '#a8db22', '#d4f54a', '#eeff88', '#f8ffd4'],
  'flow-field':          ['#0a0a0f', '#0a1a2d', '#0d3b6b', '#1668a8', '#2298db', '#4ac4f5', '#88e4ff', '#d4f4ff']

// ── Fetch archive stats ──
let archiveStats = {};
async function loadStats() {
  try {
    // Try Supabase first
    const res = await fetch('https://hephaestus-lattice.supabase.co/rest/v1/archive?select=id,genome,score,metrics&order=score.desc', {
      headers: {
        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlcGhhZXN0dXMtbGF0dGljZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzQyMjQ3NzI2LCJleHAiOjIwNTc4MjM3MjZ9.placeholder',
        'Accept-Profile': 'lattice'
      }
    });
    if (res.ok) {
      const data = await res.json();
      computeStats(data);
      return;
    }
  } catch (_) {}

  // Fallback to gallery.json
  try {
    const res = await fetch('gallery.json');
    const data = await res.json();
    const all = [...(data.archive || []), ...(data.hallOfFame || [])];
    computeStats(all);
  } catch (_) {}
}

function computeStats(pieces) {
  for (const sp of SPECIES) {
    const matching = pieces.filter(p => p.genome?.type === sp.id);
    const scores = matching.map(p => p.score || 0);
    archiveStats[sp.id] = {
      count: matching.length,
      best: scores.length ? Math.max(...scores) : 0,
      avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0,
      hofCount: matching.filter(p => (p.score || 0) >= 0.7).length
    };
  }
  renderStats();
}

function renderStats() {
  for (const sp of SPECIES) {
    const s = archiveStats[sp.id];
    if (!s) continue;
    const el = document.getElementById(`stats-${sp.id}`);
    if (!el) continue;
    el.innerHTML = `
      <div class="stat-card"><div class="val">${s.count}</div><div class="label">Specimens</div></div>
      <div class="stat-card"><div class="val">${s.best ? (s.best * 100).toFixed(1) + '%' : '—'}</div><div class="label">Best Score</div></div>
      <div class="stat-card"><div class="val">${s.avg ? (s.avg * 100).toFixed(1) + '%' : '—'}</div><div class="label">Avg Score</div></div>
      <div class="stat-card"><div class="val">${s.hofCount}</div><div class="label">Hall of Fame</div></div>
    `;
  }
}

// ── Build species nav ──
const nav = document.getElementById('species-nav');
for (const sp of SPECIES) {
  const chip = document.createElement('a');
  chip.className = 'species-chip';
  chip.href = `#${sp.id}`;
  chip.innerHTML = `<span class="dot" style="background:${sp.color}"></span>${sp.name}`;
  nav.appendChild(chip);
}

// Highlight active chip on scroll
const observer = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) {
      document.querySelectorAll('.species-chip').forEach(c => c.classList.remove('active'));
      const chip = nav.querySelector(`[href="#${e.target.id}"]`);
      if (chip) chip.classList.add('active');
    }
  }
}, { rootMargin: '-40% 0px -55% 0px' });

const demos = {};

// Utility
function getCtx(id) {
  const c = document.getElementById(`demo-${id}`);
  return c ? c.getContext('2d') : null;
}
function setStep(id, n) {
  const el = document.getElementById(`step-${id}`);
  if (el) el.textContent = `step ${n}`;
}

// ── 1D Automaton ──
(function() {
  const ctx = getCtx('1d');
  if (!ctx) return;
  const S = 280, cell = 4;
  const cols = Math.floor(S / cell);
  const rule = 30; // famous chaotic rule
  const ruleBits = Array.from({length: 8}, (_, i) => (rule >> i) & 1);
  let row = new Uint8Array(cols);
  row[Math.floor(cols / 2)] = 1;
  let y = 0, step = 0;
  const colors = TYPE_COLORS['1d'];

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, S, S);

  function tick() {
    for (let x = 0; x < cols; x++) {
      if (row[x]) {
        const ci = Math.min(colors.length - 1, 3 + Math.floor(Math.random() * 4));
        ctx.fillStyle = colors[ci];
        ctx.fillRect(x * cell, y * cell, cell - 1, cell - 1);
      }
    }
    const next = new Uint8Array(cols);
    for (let x = 0; x < cols; x++) {
      const l = row[(x - 1 + cols) % cols];
      const c = row[x];
      const r = row[(x + 1) % cols];
      const idx = (l << 2) | (c << 1) | r;
      next[x] = ruleBits[idx];
    }
    row = next;
    y++;
    step++;
    setStep('1d', step);
    if (y * cell >= S) {
      y = 0;
      row = new Uint8Array(cols);
      row[Math.floor(cols / 2)] = 1;
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, S, S);
    }
  }
  demos['1d'] = setInterval(tick, 60);
})();

// ── 2D Life-like ──
(function() {
  const ctx = getCtx('2d');
  if (!ctx) return;
  const S = 280, cell = 4;
  const N = Math.floor(S / cell);
  let grid = Array.from({length: N}, () => Array.from({length: N}, () => Math.random() < 0.3 ? 1 : 0));
  const B = [3], SV = [2, 3]; // Classic Game of Life
  const colors = TYPE_COLORS['2d'];
  let step = 0;

  function tick() {
    const img = ctx.createImageData(S, S);
    const next = Array.from({length: N}, () => new Array(N).fill(0));
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        let nb = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          nb += grid[(y + dy + N) % N][(x + dx + N) % N];
        }
        const alive = grid[y][x];
        next[y][x] = alive ? (SV.includes(nb) ? 1 : 0) : (B.includes(nb) ? 1 : 0);
        if (next[y][x] || alive) {
          const ci = next[y][x] ? (alive ? 4 : 6) : 2;
          const hex = colors[ci];
          const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
          for (let py = y * cell; py < (y + 1) * cell && py < S; py++) {
            for (let px = x * cell; px < (x + 1) * cell && px < S; px++) {
              const i = (py * S + px) * 4;
              img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
            }
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    grid = next;
    step++;
    setStep('2d', step);
    // Reset if dead
    if (step % 300 === 0) {
      grid = Array.from({length: N}, () => Array.from({length: N}, () => Math.random() < 0.3 ? 1 : 0));
    }
  }
  demos['2d'] = setInterval(tick, 100);
})();

// ── L-System ──
(function() {
  const ctx = getCtx('lsystem');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['lsystem'];
  // Fractal plant
  const axiom = 'X';
  const rules = { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' };
  const angle = 25 * Math.PI / 180;
  let iteration = 0, maxIter = 6;
  let drawIdx = 0, str = '', drawing = false;

  function generate(n) {
    let s = axiom;
    for (let i = 0; i < n; i++) {
      let next = '';
      for (const ch of s) next += rules[ch] || ch;
      s = next;
    }
    return s;
  }

  function startDraw() {
    iteration = (iteration % maxIter) + 1;
    str = generate(iteration);
    drawIdx = 0;
    drawing = true;
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, S, S);
    setStep('lsystem', iteration);
  }

  startDraw();

  function tick() {
    if (!drawing) return;
    const batch = Math.min(50, str.length - drawIdx);
    // We need to replay from start to get correct turtle state
    // But for performance, maintain turtle state
    if (drawIdx === 0) {
      demos._lTurtle = { x: S * 0.5, y: S * 0.95, a: -Math.PI / 2, stack: [] };
      const len = Math.max(1, 160 / Math.pow(2, iteration));
      demos._lLen = len;
    }
    const t = demos._lTurtle;
    const len = demos._lLen;

    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.85;

    for (let i = 0; i < batch && drawIdx < str.length; i++, drawIdx++) {
      const ch = str[drawIdx];
      if (ch === 'F') {
        const nx = t.x + Math.cos(t.a) * len;
        const ny = t.y + Math.sin(t.a) * len;
        const ci = Math.min(colors.length - 1, 2 + Math.floor((t.stack.length / 6) * 5));
        ctx.strokeStyle = colors[ci];
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();
        t.x = nx;
        t.y = ny;
      } else if (ch === '+') {
        t.a += angle;
      } else if (ch === '-') {
        t.a -= angle;
      } else if (ch === '[') {
        t.stack.push({ x: t.x, y: t.y, a: t.a });
      } else if (ch === ']' && t.stack.length) {
        const s = t.stack.pop();
        t.x = s.x; t.y = s.y; t.a = s.a;
      }
    }
    ctx.globalAlpha = 1;

    if (drawIdx >= str.length) {
      drawing = false;
      setTimeout(startDraw, 2000);
    }
  }
  demos['lsystem'] = setInterval(tick, 30);
})();

// ── Reaction-Diffusion ──
(function() {
  const ctx = getCtx('reaction-diffusion');
  if (!ctx) return;
  const S = 280, N = 70;
  const cell = S / N;
  const dA = 1.0, dB = 0.5, f = 0.055, k = 0.062;
  let A = Array.from({length: N}, () => new Float32Array(N).fill(1));
  let B = Array.from({length: N}, () => new Float32Array(N).fill(0));
  // Seed center
  for (let y = N/2 - 5; y < N/2 + 5; y++)
    for (let x = N/2 - 5; x < N/2 + 5; x++)
      B[y][x] = 1;
  const colors = TYPE_COLORS['reaction-diffusion'];
  let step = 0;

  function tick() {
    const nA = A.map(r => new Float32Array(r));
    const nB = B.map(r => new Float32Array(r));
    for (let y = 1; y < N - 1; y++) {
      for (let x = 1; x < N - 1; x++) {
        const a = A[y][x], b = B[y][x];
        const lapA = A[y-1][x] + A[y+1][x] + A[y][x-1] + A[y][x+1] - 4 * a;
        const lapB = B[y-1][x] + B[y+1][x] + B[y][x-1] + B[y][x+1] - 4 * b;
        const abb = a * b * b;
        nA[y][x] = a + (dA * lapA - abb + f * (1 - a));
        nB[y][x] = b + (dB * lapB + abb - (k + f) * b);
        nA[y][x] = Math.max(0, Math.min(1, nA[y][x]));
        nB[y][x] = Math.max(0, Math.min(1, nB[y][x]));
      }
    }
    A = nA; B = nB;

    // Render every 4 steps
    if (step % 4 === 0) {
      const img = ctx.createImageData(S, S);
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const v = Math.max(0, Math.min(1, A[y][x] - B[y][x]));
          const ci = Math.floor((1 - v) * (colors.length - 1));
          const hex = colors[ci];
          const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), bl = parseInt(hex.slice(5, 7), 16);
          for (let py = Math.floor(y * cell); py < Math.floor((y + 1) * cell) && py < S; py++) {
            for (let px = Math.floor(x * cell); px < Math.floor((x + 1) * cell) && px < S; px++) {
              const i = (py * S + px) * 4;
              img.data[i] = r; img.data[i+1] = g; img.data[i+2] = bl; img.data[i+3] = 255;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    step++;
    setStep('reaction-diffusion', step);
  }
  demos['reaction-diffusion'] = setInterval(tick, 16);
})();

// ── WFC (simplified visual) ──
(function() {
  const ctx = getCtx('wfc');
  if (!ctx) return;
  const S = 280, N = 20;
  const cell = S / N;
  const TILES = 7;
  const colors = TYPE_COLORS['wfc'];
  let grid, step;

  function reset() {
    grid = Array.from({length: N}, () => Array.from({length: N}, () => -1));
    step = 0;
  }
  reset();

  function tick() {
    // Find uncollapsed cell with most collapsed neighbors (mimics min entropy)
    let best = null, bestScore = -1;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (grid[y][x] >= 0) continue;
        let score = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const ny = y + dy, nx = x + dx;
          if (ny >= 0 && ny < N && nx >= 0 && nx < N && grid[ny][nx] >= 0) score++;
        }
        score += Math.random() * 0.5; // jitter
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
    }
    if (!best) { setTimeout(reset, 1500); return; }

    // Collapse — pick tile influenced by neighbors
    const neighbors = [];
    for (const [dy, dx] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const ny = best.y + dy, nx = best.x + dx;
      if (ny >= 0 && ny < N && nx >= 0 && nx < N && grid[ny][nx] >= 0)
        neighbors.push(grid[ny][nx]);
    }
    let tile;
    if (neighbors.length > 0 && Math.random() < 0.7) {
      // Prefer adjacent tile values (constraint-like)
      tile = neighbors[Math.floor(Math.random() * neighbors.length)];
      if (Math.random() < 0.3) tile = (tile + (Math.random() < 0.5 ? 1 : -1) + TILES) % TILES;
    } else {
      tile = Math.floor(Math.random() * TILES);
    }
    grid[best.y][best.x] = tile;

    // Draw this cell
    const ci = Math.floor((tile / (TILES - 1)) * (colors.length - 1));
    ctx.fillStyle = colors[ci];
    ctx.fillRect(best.x * cell, best.y * cell, cell - 1, cell - 1);

    // Flash effect
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(best.x * cell, best.y * cell, cell - 1, cell - 1);

    step++;
    setStep('wfc', step);
  }
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, S, S);
  demos['wfc'] = setInterval(tick, 40);
})();

// ── Voronoi ──
(function() {
  const ctx = getCtx('voronoi');
  if (!ctx) return;
  const S = 280, NP = 24;
  const colors = TYPE_COLORS['voronoi'];
  let points = Array.from({length: NP}, () => ({
    x: Math.random() * S, y: Math.random() * S,
    vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6
  }));
  let step = 0;

  function tick() {
    // Move points
    for (const p of points) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > S) p.vx *= -1;
      if (p.y < 0 || p.y > S) p.vy *= -1;
      p.x = Math.max(0, Math.min(S, p.x));
      p.y = Math.max(0, Math.min(S, p.y));
    }

    // Render (low-res for perf)
    const R = 4;
    const img = ctx.createImageData(S, S);
    for (let py = 0; py < S; py += R) {
      for (let px = 0; px < S; px += R) {
        let minD = Infinity, minI = 0, secD = Infinity;
        for (let i = 0; i < NP; i++) {
          const d = Math.abs(px - points[i].x) + Math.abs(py - points[i].y);
          if (d < minD) { secD = minD; minD = d; minI = i; }
          else if (d < secD) secD = d;
        }
        const edge = secD - minD;
        const ci = edge < 3 ? 7 : Math.floor((minI / NP) * (colors.length - 2)) + 1;
        const hex = colors[ci];
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        for (let dy = 0; dy < R && py + dy < S; dy++) {
          for (let dx = 0; dx < R && px + dx < S; dx++) {
            const i = ((py + dy) * S + px + dx) * 4;
            img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    step++;
    setStep('voronoi', step);
  }
  demos['voronoi'] = setInterval(tick, 60);
})();

// ── Julia Set ──
(function() {
  const ctx = getCtx('julia');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['julia'];
  let cR = -0.7, cI = 0.27015, t = 0;

  function render() {
    const img = ctx.createImageData(S, S);
    // Slowly orbit c
    cR = -0.7 + 0.15 * Math.sin(t * 0.3);
    cI = 0.27015 + 0.05 * Math.cos(t * 0.2);
    const maxIter = 60;

    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        let zr = (px - S / 2) / (S / 4);
        let zi = (py - S / 2) / (S / 4);
        let iter = 0;
        while (zr * zr + zi * zi < 4 && iter < maxIter) {
          const tmp = zr * zr - zi * zi + cR;
          zi = 2 * zr * zi + cI;
          zr = tmp;
          iter++;
        }
        const ci = iter >= maxIter ? 0 : Math.floor((iter / maxIter) * (colors.length - 1));
        const hex = colors[ci];
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        const i = (py * S + px) * 4;
        img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    t += 0.05;
    setStep('julia', `c = ${cR.toFixed(3)} + ${cI.toFixed(3)}i`);
    demos['julia'] = requestAnimationFrame(render);
  }
  render();
})();

// ── Strange Attractor ──
(function() {
  const ctx = getCtx('strange-attractor');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['strange-attractor'];
  const a = -1.4, b = 1.6, c = 1.0, d = 0.7; // Clifford attractor
  let x = 0.1, y = 0.1;
  let step = 0;

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, S, S);

  function tick() {
    for (let i = 0; i < 500; i++) {
      const nx = Math.sin(a * y) + c * Math.cos(a * x);
      const ny = Math.sin(b * x) + d * Math.cos(b * y);
      x = nx; y = ny;
      const px = Math.floor((x + 3) / 6 * S);
      const py = Math.floor((y + 3) / 6 * S);
      if (px >= 0 && px < S && py >= 0 && py < S) {
        const ci = 2 + Math.floor(Math.abs(Math.sin(step * 0.001 + i * 0.01)) * 5);
        ctx.fillStyle = colors[ci];
        ctx.globalAlpha = 0.15;
        ctx.fillRect(px, py, 1, 1);
      }
    }
    ctx.globalAlpha = 1;
    step++;
    setStep('strange-attractor', step * 500);

    if (step > 400) {
      step = 0;
      x = 0.1; y = 0.1;
      ctx.fillStyle = 'rgba(10,10,15,0.03)';
      ctx.fillRect(0, 0, S, S);
    }
  }
  demos['strange-attractor'] = setInterval(tick, 30);
})();

// ── Spirograph ──
(function() {
  const ctx = getCtx('spirograph');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['spirograph'];
  const cx = S / 2, cy = S / 2;
  let R = 100, r = 37, d = 50, t = 0, step = 0;

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, S, S);

  function tick() {
    ctx.lineWidth = 0.8;
    const batch = 80;
    for (let i = 0; i < batch; i++) {
      const x1 = cx + (R - r) * Math.cos(t) + d * Math.cos((R - r) * t / r);
      const y1 = cy + (R - r) * Math.sin(t) - d * Math.sin((R - r) * t / r);
      t += 0.02;
      const x2 = cx + (R - r) * Math.cos(t) + d * Math.cos((R - r) * t / r);
      const y2 = cy + (R - r) * Math.sin(t) - d * Math.sin((R - r) * t / r);

      const ci = 2 + Math.floor((t * 0.3) % (colors.length - 2));
      ctx.strokeStyle = colors[ci];
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    step++;
    setStep('spirograph', step);

    if (t > Math.PI * 2 * r / gcd(R, r) + 0.5) {
      // New pattern
      R = 80 + Math.random() * 40;
      r = 15 + Math.random() * 50;
      d = 20 + Math.random() * 60;
      t = 0;
      ctx.fillStyle = 'rgba(10,10,15,0.95)';
      ctx.fillRect(0, 0, S, S);
    }
  }

  function gcd(a, b) { a = Math.round(a); b = Math.round(b); while (b) { [a, b] = [b, a % b]; } return a; }

  demos['spirograph'] = setInterval(tick, 30);
})();

// ── Fractal Noise ──
(function() {
  const ctx = getCtx('fractal-noise');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['fractal-noise'];
  let t = 0;

  // Simple value noise
  const GRID = 16;
  const perm = Array.from({length: 256}, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }

  function hash(x, y) { return perm[(perm[x & 255] + y) & 255] / 255; }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  function noise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    return lerp(
      lerp(hash(ix, iy), hash(ix + 1, iy), fx),
      lerp(hash(ix, iy + 1), hash(ix + 1, iy + 1), fx),
      fy
    );
  }

  function fbm(x, y, octaves) {
    let val = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
      val += noise(x * freq, y * freq) * amp;
      max += amp;
      amp *= 0.5;
      freq *= 2;
    }
    return val / max;
  }

  function render() {
    const img = ctx.createImageData(S, S);
    const R = 2; // pixel step for perf
    for (let py = 0; py < S; py += R) {
      for (let px = 0; px < S; px += R) {
        const v = fbm(px / 40 + t, py / 40 + t * 0.5, 6);
        const ci = Math.floor(v * (colors.length - 1));
        const hex = colors[Math.max(0, Math.min(colors.length - 1, ci))];
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        for (let dy = 0; dy < R && py + dy < S; dy++) {
          for (let dx = 0; dx < R && px + dx < S; dx++) {
            const i = ((py + dy) * S + px + dx) * 4;
            img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    t += 0.015;
    setStep('fractal-noise', `${(t * 40).toFixed(0)}px drift`);
    demos['fractal-noise'] = requestAnimationFrame(render);
  }
  render();
})();

// ── Flow Field ──
(function() {
  const ctx = getCtx('flow-field');
  if (!ctx) return;
  const S = 280;
  const colors = TYPE_COLORS['flow-field'];
  const particles = Array.from({length: 200}, () => ({
    x: Math.random() * S, y: Math.random() * S,
    px: 0, py: 0, age: 0
  }));
  let t = 0, step = 0;

  // Reuse noise from fractal-noise
  const perm = Array.from({length: 256}, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  function hash(x, y) { return perm[(perm[x & 255] + y) & 255] / 255; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    return lerp(lerp(hash(ix, iy), hash(ix+1, iy), fx), lerp(hash(ix, iy+1), hash(ix+1, iy+1), fx), fy);
  }

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, S, S);

  function tick() {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.02)';
    ctx.fillRect(0, 0, S, S);

    for (const p of particles) {
      p.px = p.x; p.py = p.y;
      const angle = noise(p.x / 50, p.y / 50 + t) * Math.PI * 4;
      p.x += Math.cos(angle) * 1.5;
      p.y += Math.sin(angle) * 1.5;
      p.age++;

      if (p.x < 0 || p.x > S || p.y < 0 || p.y > S || p.age > 200) {
        p.x = Math.random() * S;
        p.y = Math.random() * S;
        p.px = p.x; p.py = p.y;
        p.age = 0;
        continue;
      }

      const ci = 2 + Math.floor((p.age / 200) * (colors.length - 3));
      ctx.strokeStyle = colors[ci];
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    t += 0.002;
    step++;
    setStep('flow-field', step);
  }
  demos['flow-field'] = setInterval(tick, 30);
})();

// ── Load stats ──
loadStats();
</script>
