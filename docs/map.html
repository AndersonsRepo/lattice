<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Map</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent-glow);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .back-link {
      display: inline-block;
      margin-top: 0.75rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* Search */
    .search-bar {
      position: relative;
      max-width: 480px;
      margin: 1.5rem auto;
    }

    .search-bar input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .search-bar input::placeholder {
      color: var(--text-dim);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-hint {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.15rem 0.4rem;
      pointer-events: none;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0 1.5rem;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tab:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .filter-tab .count {
      opacity: 0.6;
      margin-left: 0.25rem;
    }

    .page-count {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    /* Category sections */
    .category {
      margin-bottom: 2rem;
    }

    .category-header {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .category-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
    }

    .page-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .page-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .page-card.hidden { display: none; }

    .card-title {
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-icon {
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .card-desc {
      font-size: 0.65rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .card-tags {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      margin-top: 0.15rem;
    }

    .card-tag {
      font-size: 0.55rem;
      color: var(--accent);
      background: rgba(124, 111, 224, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      letter-spacing: 0.04em;
    }

    .category.hidden { display: none; }

    .no-results {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      display: none;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      margin-top: 1rem;
      color: var(--text-dim);
      font-size: 0.7rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

        btn.dataset.cat = cat.id;
        btn.innerHTML = `${cat.label} <span class="count">${count}</span>`;
        btn.onclick = () => setFilter(cat.id);
        filterBar.appendChild(btn);
      });
    }

    function setFilter(cat) {
      activeFilter = cat;
      filterBar.querySelectorAll('.filter-tab').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      render();
    }

    // Build page cards
    function render() {
      const query = searchInput.value.toLowerCase().trim();
      contentEl.innerHTML = '';

      let totalVisible = 0;

      CATEGORIES.forEach(cat => {
        const pages = PAGES.filter(p => {
          if (activeFilter !== 'all' && p.cat !== cat.id) return false;
          if (p.cat !== cat.id) return false;
          if (!query) return true;
          return p.name.toLowerCase().includes(query) ||
                 p.desc.toLowerCase().includes(query) ||
                 p.tags.some(t => t.includes(query));
        });

        if (pages.length === 0) return;

        const section = document.createElement('div');
        section.className = 'category';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span class="category-dot" style="background:${cat.color}"></span>${cat.label}`;
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'card-grid';

        pages.forEach(p => {
          const card = document.createElement('a');
          card.className = 'page-card';
          card.href = p.href;

          card.innerHTML = `
            <div class="card-title"><span class="card-icon">${p.icon}</span>${p.name}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-tags">${p.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        contentEl.appendChild(section);
        totalVisible += pages.length;
      });

      pageCountEl.textContent = `${totalVisible} page${totalVisible !== 1 ? 's' : ''}`;
      noResults.style.display = totalVisible === 0 ? 'block' : 'none';
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        searchInput.value = '';
        searchInput.blur();
        render();
      }
    });

    searchInput.addEventListener('input', render);

    buildFilters();
    render();
  </script>
</body>
</html>
