<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Versus</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
      --left: #7c6fe0;
      --right: #4ade80;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      font-size: 0.65rem;
      color: var(--text-dim);
      text-decoration: none;
      z-index: 100;
      letter-spacing: 0.05em;
    }
    .back-link:hover { color: var(--accent); }

    .title-bar {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .title-bar h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent-glow);
    }
    .title-bar .sub {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      letter-spacing: 0.08em;
    }

    /* --- Selection strip --- */
    .selector-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      flex-wrap: wrap;
    }
    .selector-strip select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-family: inherit;
      font-size: 0.7rem;
      min-width: 200px;
      cursor: pointer;
      outline: none;
    }
    .selector-strip select:focus { border-color: var(--accent); }
    .sel-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
    }
    .sel-left .sel-label { color: var(--left); }
    .sel-right .sel-label { color: var(--right); }
    .sel-left select { border-color: #7c6fe040; }
    .sel-right select { border-color: #4ade8040; }

    .vs-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .btn-random {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-random:hover { border-color: var(--accent); color: var(--accent); }

    /* --- Arena --- */
    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    @media (max-width: 800px) {
      .arena { grid-template-columns: 1fr; }
    }

    .fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.5rem;
    }

    .fighter-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .fighter-type {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.2rem 0.6rem;
      border-radius: 10px;
      border: 1px solid;
    }
    .fighter-score {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .fighter-id {
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .fighter-left .fighter-type { color: var(--left); border-color: #7c6fe040; }
    .fighter-left .fighter-score { color: var(--left); }
    .fighter-right .fighter-type { color: var(--right); border-color: #4ade8040; }
    .fighter-right .fighter-score { color: var(--right); }

    /* --- Art canvas --- */
    .art-canvas {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 53 / 31;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }

    /* --- Radar chart --- */
    .radar-section {
      text-align: center;
      padding: 1.5rem 1rem;
      max-width: 700px;
      margin: 0 auto;
    }
    .radar-section h2 {
      font-size: 0.7rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }
    #radar-canvas {
      max-width: 500px;
      width: 100%;
      aspect-ratio: 1;
    }

    /* --- Metric bars --- */
    .metrics-section {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }
    .metric-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }
    .metric-label {
      width: 130px;
      text-align: right;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .metric-bars {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }
    .metric-bar-left, .metric-bar-right {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .metric-bar-left { background: var(--left); }
    .metric-bar-right { background: var(--right); }
    .metric-winner { box-shadow: 0 0 8px currentColor; }
    .metric-bar-left.metric-winner { box-shadow: 0 0 8px var(--left); }
    .metric-bar-right.metric-winner { box-shadow: 0 0 8px var(--right); }

    .metric-val {
      font-size: 0.6rem;
      width: 35px;
      flex-shrink: 0;
    }
    .metric-val-left { text-align: right; color: var(--left); }
    .metric-val-right { text-align: left; color: var(--right); }

    /* --- Genome comparison --- */
    .genome-section {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }
    .genome-section h2 {
      font-size: 0.7rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      text-align: center;
    }
    .genome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .genome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
    }
    .genome-card dt {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-top: 0.4rem;
    }
    .genome-card dt:first-child { margin-top: 0; }
    .genome-card dd {
      font-size: 0.7rem;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    .genome-card-left { border-color: #7c6fe020; }
    .genome-card-right { border-color: #4ade8020; }

    /* --- Verdict --- */
    .verdict {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }
    .verdict .winner-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .verdict .tally {
      font-size: 0.65rem;
      margin-top: 0.3rem;
    }

    /* --- Footer --- */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.6rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      max-width: 700px;
      margin: 0 auto;
    }
    footer a { color: var(--text-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* --- Empty state --- */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .empty-state .big {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">&larr; Gallery</a>

  <div class="title-bar">
    <h1>Versus</h1>
    <p class="sub">side-by-side comparison of two evolved pieces</p>
  </div>

  <div class="selector-strip">
    <div class="sel-left">
      <span class="sel-label">Left</span>
      <select id="sel-left"></select>
    </div>
    <span class="vs-badge">vs</span>
    <div class="sel-right">
      <span class="sel-label">Right</span>
      <select id="sel-right"></select>
    </div>
    <button class="btn-random" id="btn-random" title="Pick two random pieces">Shuffle</button>
  </div>

  <div id="content">
    <div class="empty-state" id="empty-state">
      <div class="big">&#9876;</div>
      Select two pieces to compare &mdash; or hit Shuffle
    </div>
  </div>

  <footer>
    <a href="index.html">&larr; Gallery</a>
    &nbsp;&bull;&nbsp;
    <a href="about.html">About</a>
    &nbsp;&bull;&nbsp;
    <a href="atlas.html">Atlas</a>
    &nbsp;&bull;&nbsp;
    <a href="pulse.html">Pulse</a>
  </footer>

  <script>
    // --- TYPE_COLORS (same as index.html) ---
    const TYPE_COLORS = {
      '1d':                  { bg: '#0a0a0f', colors: ['#0a0a0f', '#1a1a3e', '#3b2d8b', '#6b4edb', '#9d7af5', '#c8abff', '#e8d8ff', '#ffffff'] },
      '2d':                  { bg: '#0a0a0f', colors: ['#0a0a0f', '#0d2818', '#166b3a', '#22a95c', '#4ade80', '#7af5a8', '#b8ffd4', '#e8fff0'] },
      'lsystem':             { bg: '#0a0a0f', colors: ['#0a0a0f', '#2d1a0a', '#6b3a0d', '#a85c16', '#db8b22', '#f5b84a', '#ffe088', '#fff4cc'] },
      'reaction-diffusion':  { bg: '#0a0a0f', colors: ['#0a0a0f', '#1a0a2d', '#3b0d6b', '#6b16a8', '#a822db', '#d44af5', '#f088ff', '#ffccff'] },
      'voronoi':             { bg: '#0a0a0f', colors: ['#0a0a0f', '#0a1a2d', '#0d3b6b', '#166ba8', '#22a8db', '#4ad4f5', '#88eeff', '#ccf8ff'] },
      'wfc':                 { bg: '#0a0a0f', colors: ['#0a0a0f', '#2d0a0a', '#6b0d1a', '#a8163b', '#db226b', '#f54a9d', '#ff88c8', '#ffccee'] },
      'spirograph':          { bg: '#0a0a0f', colors: ['#0a0a0f', '#1a2d0a', '#3b6b0d', '#6ba816', '#a8db22', '#d4f54a', '#eeff88', '#ffffcc'] },
      'attractor':           { bg: '#0a0a0f', colors: ['#0a0a0f', '#2d1a1a', '#6b2d2d', '#a84a3b', '#db6b4a', '#f59d6b', '#ffc8a0', '#ffe8d8'] },
      'julia':               { bg: '#0a0a0f', colors: ['#0a0a0f', '#0a2d2d', '#0d6b5b', '#16a88a', '#22dbb5', '#4af5d4', '#88ffe8', '#ccfff4'] },
      'noise':               { bg: '#0a0a0f', colors: ['#0a0a0f', '#1a1a0a', '#3b3b0d', '#6b6b16', '#a8a822', '#d4d44a', '#eeff88', '#ffffcc'] },
      'flowfield':           { bg: '#0a0a0f', colors: ['#0a0a0f', '#0a1a1a', '#0d3b3b', '#166b6b', '#22a8a8', '#4ad4d4', '#88eeff', '#ccffff'] },
    };

    function charIntensity(ch) {
      if (ch === ' ') return 0;
      const light = '\u00B7.:~\u2801';
      const med1  = '\u2591\u2022\u2248\u2803\u25B3\u25BD\u2726';
      const med2  = '\u2592\u25CB\u223F\u2807\u25C7\u2727\u2766';
      const med3  = '\u2593\u25CF\u224B\u280F\u25C8\u2605\u273F';
      const heavy = '\u2588\u25C6\u2307\u281F\u2B21\u2736\u2740\u2741';
      const max   = '\u2573\u25D0\u25D1\u25D2\u25D3\u2301\u283F\u28FF\u2B22\u2739\u273A';
      if (light.includes(ch)) return 1;
      if (med1.includes(ch))  return 2;
      if (med2.includes(ch))  return 3;
      if (med3.includes(ch))  return 4;
      if (heavy.includes(ch)) return 5;
      if (max.includes(ch))   return 6;
      return 3;
    }

    // --- METRIC DEFINITIONS ---
    const METRIC_KEYS = ['complexity', 'symmetry', 'density', 'novelty', 'edgeActivity', 'structuralInterest', 'fractalDimension', 'informationDensity'];
    const METRIC_LABELS = {
      complexity: 'Complexity',
      symmetry: 'Symmetry',
      density: 'Density',
      novelty: 'Novelty',
      edgeActivity: 'Edge Activity',
      structuralInterest: 'Structure',
      fractalDimension: 'Fractal Dim',
      informationDensity: 'Info Density',
    };
    // Normalization ranges (some metrics go 0-1, fractalDimension 0-2, complexity 0-3)
    const METRIC_MAX = {
      complexity: 3, symmetry: 1, density: 1, novelty: 1,
      edgeActivity: 1, structuralInterest: 1, fractalDimension: 2, informationDensity: 1,
    };

    let archive = [];
    let leftPiece = null, rightPiece = null;

    // --- LOAD DATA ---
    async function loadData() {
      try {
        const resp = await fetch('gallery.json');
        const data = await resp.json();
        archive = (data.archive || []).sort((a, b) => b.score - a.score);
        populateSelectors();
        // Auto-pick two from URL or random
        const params = new URLSearchParams(location.search);
        const lid = params.get('left');
        const rid = params.get('right');
        if (lid && rid) {
          document.getElementById('sel-left').value = lid;
          document.getElementById('sel-right').value = rid;
          updateComparison();
        }
      } catch (e) {
        console.error('Failed to load gallery.json', e);
      }
    }

    function populateSelectors() {
      const selL = document.getElementById('sel-left');
      const selR = document.getElementById('sel-right');
      const optHtml = '<option value="">— pick —</option>' +
        archive.map(p => `<option value="${p.id}">${p.genome.type} — ${(p.score * 100).toFixed(1)}% — ${p.id}</option>`).join('');
      selL.innerHTML = optHtml;
      selR.innerHTML = optHtml;
      selL.addEventListener('change', updateComparison);
      selR.addEventListener('change', updateComparison);
    }

    document.getElementById('btn-random').addEventListener('click', () => {
      if (archive.length < 2) return;
      const i = Math.floor(Math.random() * archive.length);
      let j = Math.floor(Math.random() * (archive.length - 1));
      if (j >= i) j++;
      document.getElementById('sel-left').value = archive[i].id;
      document.getElementById('sel-right').value = archive[j].id;
      updateComparison();
    });

    function updateComparison() {
      const lid = document.getElementById('sel-left').value;
      const rid = document.getElementById('sel-right').value;
      leftPiece = archive.find(p => p.id === lid) || null;
      rightPiece = archive.find(p => p.id === rid) || null;

      const content = document.getElementById('content');
      if (!leftPiece || !rightPiece) {
        content.innerHTML = '<div class="empty-state" id="empty-state"><div class="big">&#9876;</div>Select two pieces to compare &mdash; or hit Shuffle</div>';
        return;
      }

      // Update URL
      const url = new URL(location);
      url.searchParams.set('left', leftPiece.id);
      url.searchParams.set('right', rightPiece.id);
      history.replaceState(null, '', url);

      content.innerHTML = buildArena();
      renderArtCanvases();
      drawRadar();
      animateMetricBars();
    }

    // --- BUILD HTML ---
    function buildArena() {
      const l = leftPiece, r = rightPiece;
      const lNorm = normalizeMetrics(l.metrics);
      const rNorm = normalizeMetrics(r.metrics);
      let lWins = 0, rWins = 0;
      METRIC_KEYS.forEach(k => {
        if (lNorm[k] > rNorm[k]) lWins++;
        else if (rNorm[k] > lNorm[k]) rWins++;
      });

      const winnerColor = lWins > rWins ? 'var(--left)' : rWins > lWins ? 'var(--right)' : 'var(--text-dim)';
      const winnerName = lWins > rWins ? l.id : rWins > lWins ? r.id : 'Tie';
      const winnerLabel = lWins === rWins ? 'Even match' : `${winnerName} wins`;

      return `
        <div class="arena">
          <div class="fighter fighter-left">
            <div class="fighter-header">
              <span class="fighter-type">${l.genome.type}</span>
              <span class="fighter-score">${(l.score * 100).toFixed(1)}%</span>
            </div>
            <div class="fighter-id">${l.id} &mdash; gen ${l.generation}</div>
            <canvas class="art-canvas" id="canvas-left" width="530" height="310"></canvas>
          </div>
          <div class="fighter fighter-right">
            <div class="fighter-header">
              <span class="fighter-type">${r.genome.type}</span>
              <span class="fighter-score">${(r.score * 100).toFixed(1)}%</span>
            </div>
            <div class="fighter-id">${r.id} &mdash; gen ${r.generation}</div>
            <canvas class="art-canvas" id="canvas-right" width="530" height="310"></canvas>
          </div>
        </div>

        <div class="verdict">
          <div class="winner-name" style="color: ${winnerColor}">${winnerLabel}</div>
          <div class="tally">${lWins} &mdash; ${8 - lWins - rWins} ties &mdash; ${rWins} metrics</div>
        </div>

        <div class="radar-section">
          <h2>Fitness Radar</h2>
          <canvas id="radar-canvas" width="500" height="500"></canvas>
        </div>

        <div class="metrics-section">
          ${METRIC_KEYS.map(k => {
            const lv = lNorm[k], rv = rNorm[k];
            const lWin = lv > rv, rWin = rv > lv;
            return `<div class="metric-row">
              <span class="metric-val metric-val-left">${formatMetric(l.metrics[k], k)}</span>
              <span class="metric-label">${METRIC_LABELS[k]}</span>
              <div class="metric-bars">
                <div class="metric-bar-left ${lWin ? 'metric-winner' : ''}" data-width="${lv * 100}" style="width: 0%; opacity: ${lWin ? 1 : 0.5};"></div>
                <div class="metric-bar-right ${rWin ? 'metric-winner' : ''}" data-width="${rv * 100}" style="width: 0%; opacity: ${rWin ? 1 : 0.5};"></div>
              </div>
              <span class="metric-val metric-val-right">${formatMetric(r.metrics[k], k)}</span>
            </div>`;
          }).join('')}
        </div>

        <div class="genome-section">
          <h2>Genome Details</h2>
          <div class="genome-grid">
            <dl class="genome-card genome-card-left">
              <dt>Type</dt><dd>${l.genome.type}</dd>
              <dt>Mutations</dt><dd>${l.genome.mutations || 0}</dd>
              <dt>Lineage Depth</dt><dd>${(l.genome.lineage || []).length}</dd>
              <dt>Palette</dt><dd>${(l.genome.palette || []).join(' ')}</dd>
              <dt>Grid</dt><dd>${l.genome.width} &times; ${l.genome.height}</dd>
              <dt>Epoch</dt><dd>${l.epoch}</dd>
            </dl>
            <dl class="genome-card genome-card-right">
              <dt>Type</dt><dd>${r.genome.type}</dd>
              <dt>Mutations</dt><dd>${r.genome.mutations || 0}</dd>
              <dt>Lineage Depth</dt><dd>${(r.genome.lineage || []).length}</dd>
              <dt>Palette</dt><dd>${(r.genome.palette || []).join(' ')}</dd>
              <dt>Grid</dt><dd>${r.genome.width} &times; ${r.genome.height}</dd>
              <dt>Epoch</dt><dd>${r.epoch}</dd>
            </dl>
          </div>
        </div>
      `;
    }

    function normalizeMetrics(m) {
      const out = {};
      METRIC_KEYS.forEach(k => {
        out[k] = Math.min(1, (m[k] || 0) / METRIC_MAX[k]);
      });
      return out;
    }

    function formatMetric(v, k) {
      if (k === 'fractalDimension') return (v || 0).toFixed(2);
      if (k === 'complexity') return (v || 0).toFixed(2);
      return ((v || 0) * 100).toFixed(0) + '%';
    }

    // --- RENDER ART TO CANVAS ---
    function renderArtCanvases() {
      renderPieceToCanvas(leftPiece, 'canvas-left');
      renderPieceToCanvas(rightPiece, 'canvas-right');
    }

    function renderPieceToCanvas(piece, canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const lines = piece.rendered.split('\n');
      const rows = lines.length;
      const cols = Math.max(...lines.map(l => [...l].length));
      const cellW = canvas.width / cols;
      const cellH = canvas.height / rows;
      const theme = TYPE_COLORS[piece.genome.type] || TYPE_COLORS['2d'];

      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const fontSize = Math.min(cellW * 1.1, cellH * 0.95);
      ctx.font = `${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rows; r++) {
        const chars = [...lines[r]];
        for (let c = 0; c < chars.length; c++) {
          const ch = chars[c];
          const intensity = charIntensity(ch);
          if (intensity === 0) continue;
          ctx.fillStyle = theme.colors[Math.min(intensity, theme.colors.length - 1)];
          ctx.fillText(ch, c * cellW + cellW / 2, r * cellH + cellH / 2);
        }
      }
    }

    // --- RADAR CHART ---
    function drawRadar() {
      const canvas = document.getElementById('radar-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2;
      const radius = Math.min(cx, cy) * 0.72;
      const n = METRIC_KEYS.length;
      const angleStep = (Math.PI * 2) / n;
      const startAngle = -Math.PI / 2;

      ctx.clearRect(0, 0, w, h);

      // Grid rings
      for (let ring = 1; ring <= 4; ring++) {
        const r = radius * ring / 4;
        ctx.beginPath();
        for (let i = 0; i <= n; i++) {
          const a = startAngle + i * angleStep;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = '#1e1e2e';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Axis lines + labels
      ctx.font = '11px monospace';
      ctx.fillStyle = '#6e6e82';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const a = startAngle + i * angleStep;
        const x1 = cx + Math.cos(a) * radius;
        const y1 = cy + Math.sin(a) * radius;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x1, y1);
        ctx.strokeStyle = '#1e1e2e';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Label
        const lx = cx + Math.cos(a) * (radius + 28);
        const ly = cy + Math.sin(a) * (radius + 28);
        ctx.fillText(METRIC_LABELS[METRIC_KEYS[i]], lx, ly);
      }

      // Draw shapes
      const lNorm = normalizeMetrics(leftPiece.metrics);
      const rNorm = normalizeMetrics(rightPiece.metrics);
      drawRadarShape(ctx, cx, cy, radius, lNorm, 'rgba(124, 111, 224, 0.25)', 'rgba(124, 111, 224, 0.85)', startAngle, angleStep);
      drawRadarShape(ctx, cx, cy, radius, rNorm, 'rgba(74, 222, 128, 0.2)', 'rgba(74, 222, 128, 0.85)', startAngle, angleStep);

      // Dots
      for (let i = 0; i < n; i++) {
        const a = startAngle + i * angleStep;
        const k = METRIC_KEYS[i];
        [{ norm: lNorm, color: '#7c6fe0' }, { norm: rNorm, color: '#4ade80' }].forEach(({ norm, color }) => {
          const r = radius * norm[k];
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
      }
    }

    function drawRadarShape(ctx, cx, cy, radius, norm, fill, stroke, startAngle, angleStep) {
      const n = METRIC_KEYS.length;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const idx = i % n;
        const a = startAngle + idx * angleStep;
        const r = radius * norm[METRIC_KEYS[idx]];
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // --- ANIMATE METRIC BARS ---
    function animateMetricBars() {
      requestAnimationFrame(() => {
        document.querySelectorAll('.metric-bar-left, .metric-bar-right').forEach(bar => {
          const w = bar.dataset.width;
          bar.style.width = w + '%';
        });
      });
    }

    // --- KEYBOARD SHORTCUTS ---
    document.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') {
        document.getElementById('btn-random').click();
      }
    });

    // --- INIT ---
    loadData();
  </script>
</body>
</html>
