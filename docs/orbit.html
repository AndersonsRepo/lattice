<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Orbit</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
    }

    /* --- HUD overlay --- */
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.25rem;
    }

    .hud-title {
      pointer-events: auto;
    }

    .hud-title h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .hud-title .back-link {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .hud-title .back-link:hover { color: var(--accent); }

    .hud-stats {
      text-align: right;
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      line-height: 1.8;
    }
    .hud-stats .val { color: var(--green); }

    /* --- Control panel --- */
    .panel {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      background: rgba(18, 18, 26, 0.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1rem;
      pointer-events: auto;
      z-index: 20;
      max-height: 80vh;
      overflow-y: auto;
      transition: opacity 0.3s, transform 0.3s;
    }

    .panel.collapsed {
      opacity: 0;
      transform: translateY(-50%) translateX(240px);
      pointer-events: none;
    }

    .panel::-webkit-scrollbar { width: 3px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .panel-section {
      margin-bottom: 0.85rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .section-label {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    /* Sliders */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .slider-label {
      font-size: 0.55rem;
      color: var(--text-dim);
      width: 50px;
      flex-shrink: 0;
    }

    .slider-val {
      font-size: 0.55rem;
      color: var(--accent);
      width: 38px;
      text-align: right;
      flex-shrink: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* Toggle buttons */
    .toggle-row {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .toggle-btn {
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.5rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
    .toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 0.3rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(124, 111, 224, 0.08); }

    /* Mic indicator */
    .mic-indicator {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      margin-right: 0.3rem;
      transition: background 0.2s;
    }
    .mic-indicator.active {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* Panel toggle */
    .panel-toggle {
      position: absolute;
      right: 1.25rem;
      bottom: 1.25rem;
      pointer-events: auto;
      z-index: 20;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(18, 18, 26, 0.85);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .panel-toggle:hover { border-color: var(--accent); color: var(--text); }

    .mouse-hint {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud">
  <div class="hud-top">
    <div class="hud-title">
      <a href="index.html" class="back-link">&larr; lattice</a>
      <h1>Orbit</h1>
    </div>
    <div class="hud-stats">
      <div>iterations <span class="val" id="statIter">0</span></div>
      <div>fps <span class="val" id="statFps">0</span></div>
      <div>peak density <span class="val" id="statPeak">0</span></div>
    </div>
  </div>
</div>

<!-- Control panel -->
<div class="panel" id="panel">

  <!-- Attractor type -->
  <div class="panel-section">
    <div class="section-label">Attractor</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-type="clifford">clifford</button>
      <button class="toggle-btn" data-type="dejong">de jong</button>
      <button class="toggle-btn" data-type="bedhead">bedhead</button>
      <button class="toggle-btn" data-type="fractal-dream">fractal dream</button>
    </div>
  </div>

  <!-- Parameters -->
  <div class="panel-section">
    <div class="section-label">Parameters</div>
    <div class="slider-row">
      <span class="slider-label">a</span>
      <input type="range" id="paramA" min="-3" max="3" step="0.01" value="-1.7">
      <span class="slider-val" id="paramAVal">-1.70</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">b</span>
      <input type="range" id="paramB" min="-3" max="3" step="0.01" value="1.8">
      <span class="slider-val" id="paramBVal">1.80</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">c</span>
      <input type="range" id="paramC" min="-3" max="3" step="0.01" value="-1.9">
      <span class="slider-val" id="paramCVal">-1.90</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">d</span>
      <input type="range" id="paramD" min="-3" max="3" step="0.01" value="-0.4">
      <span class="slider-val" id="paramDVal">-0.40</span>
    </div>
  </div>

  <!-- Rendering -->
  <div class="panel-section">
    <div class="section-label">Rendering</div>
    <div class="slider-row">
      <span class="slider-label">speed</span>
      <input type="range" id="iterSpeed" min="1000" max="200000" step="1000" value="50000">
      <span class="slider-val" id="iterSpeedVal">50k</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">bloom</span>
      <input type="range" id="bloom" min="0" max="1" step="0.05" value="0.3">
      <span class="slider-val" id="bloomVal">0.30</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">exposure</span>
      <input type="range" id="exposure" min="0.2" max="3" step="0.05" value="1.0">
      <span class="slider-val" id="exposureVal">1.00</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">zoom</span>
      <input type="range" id="zoom" min="0.3" max="5" step="0.05" value="1">
      <span class="slider-val" id="zoomVal">1.00</span>
    </div>
  </div>

  <!-- Palette -->
  <div class="panel-section">
    <div class="section-label">Palette</div>
    <div class="toggle-row">
      <button class="toggle-btn active" data-palette="nebula">nebula</button>
      <button class="toggle-btn" data-palette="ember">ember</button>
      <button class="toggle-btn" data-palette="ocean">ocean</button>
      <button class="toggle-btn" data-palette="lattice">lattice</button>
      <button class="toggle-btn" data-palette="monochrome">mono</button>
      <button class="toggle-btn" data-palette="infrared">infrared</button>
    </div>
  </div>

  <!-- Mouse interaction -->
  <div class="panel-section">
    <div class="section-label">Mouse</div>
    <div class="toggle-row" style="margin-bottom: 0.4rem;">
      <button class="toggle-btn active" data-mouse="warp">warp params</button>
      <button class="toggle-btn" data-mouse="pan">pan</button>
      <button class="toggle-btn" data-mouse="none">none</button>
    </div>
    <div class="slider-row">
      <span class="slider-label">warp</span>
      <input type="range" id="warpStrength" min="0" max="1" step="0.01" value="0.3">
      <span class="slider-val" id="warpStrengthVal">0.30</span>
    </div>
  </div>

  <!-- Audio -->
  <div class="panel-section">
    <div class="section-label"><span class="mic-indicator" id="micDot"></span>Audio Reactivity</div>
    <div class="toggle-row" style="margin-bottom: 0.4rem;">
      <button class="toggle-btn" id="micToggle">enable mic</button>
    </div>
    <div class="slider-row">
      <span class="slider-label">sens</span>
      <input type="range" id="audioSens" min="0.5" max="5" step="0.1" value="2">
      <span class="slider-val" id="audioSensVal">2.0</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="panel-section">
    <div class="section-label">Actions</div>
    <div class="action-row" style="margin-bottom: 0.3rem;">
      <button class="action-btn" id="btnRandomize">randomize</button>
      <button class="action-btn" id="btnClear">clear</button>
    </div>
    <div class="action-row" style="margin-bottom: 0.3rem;">
      <button class="action-btn" id="btnPause">pause</button>
      <button class="action-btn" id="btnAnimate">animate</button>
    </div>
    <div class="action-row">
      <button class="action-btn" id="btnExport">export png</button>
    </div>
  </div>
</div>

<button class="panel-toggle" id="panelToggle">controls</button>

<div class="mouse-hint" id="mouseHint">drag to warp parameters &middot; scroll to zoom &middot; space to pause &middot; h to toggle panel</div>

<script>
// ============================================================
//  Orbit — interactive strange attractor explorer
// ============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, dpr;
let density = null;     // Float32Array — accumulated hit counts
let totalIter = 0;
let paused = false;
let animating = false;  // slow parameter drift
let animPhase = 0;

// Audio
let audioCtx = null, analyser = null, audioData = null;
let micActive = false, audioBass = 0, audioTreble = 0;

// Mouse
let mouseX = -1, mouseY = -1;
let mouseDown = false;
let panOffX = 0, panOffY = 0;
let panStartX = 0, panStartY = 0;
let panBaseX = 0, panBaseY = 0;

// FPS
let lastFpsTime = performance.now(), frameCount = 0, displayFps = 0;

// ===== Parameters =====
const P = {
  type: 'clifford',
  a: -1.7, b: 1.8, c: -1.9, d: -0.4,
  iterSpeed: 50000,
  bloom: 0.3,
  exposure: 1.0,
  zoom: 1.0,
  palette: 'nebula',
  mouseMode: 'warp',
  warpStrength: 0.3,
  audioSens: 2.0
};

// Known beautiful presets per type
const PRESETS = {
  clifford: [
    { a: -1.7, b: 1.8, c: -1.9, d: -0.4 },
    { a: -1.4, b: 1.6, c: 1.0, d: 0.7 },
    { a: 1.5, b: -1.8, c: 1.6, d: 0.9 },
    { a: -1.8, b: -2.0, c: -0.5, d: -0.9 },
    { a: 1.1, b: -1.3, c: -1.8, d: -1.9 }
  ],
  dejong: [
    { a: -2.0, b: -2.0, c: -1.2, d: 2.0 },
    { a: 1.4, b: -2.3, c: 2.4, d: -2.1 },
    { a: -2.7, b: -0.09, c: -0.86, d: -2.2 },
    { a: -0.827, b: -1.637, c: 1.659, d: -0.943 }
  ],
  bedhead: [
    { a: -0.81, b: -0.92, c: 0, d: 0 },
    { a: 0.06, b: 0.98, c: 0, d: 0 },
    { a: -0.67, b: 0.83, c: 0, d: 0 },
    { a: -0.64, b: 0.76, c: 0, d: 0 }
  ],
  'fractal-dream': [
    { a: -1.9, b: -1.9, c: -1.9, d: 0.8 },
    { a: -2.3, b: 0.03, c: -0.8, d: 2.0 },
    { a: -1.2, b: -1.1, c: 1.5, d: 1.3 },
    { a: -0.966, b: 2.879, c: 0.765, d: 0.744 }
  ]
};

// ===== Color palettes =====
// Each palette: array of [r,g,b] stops, mapped by log density
const PALETTE_DEFS = {
  nebula: [[5,5,20],[30,10,80],[124,111,224],[180,140,255],[255,220,255]],
  ember: [[10,2,2],[120,20,5],[220,80,10],[255,180,40],[255,255,200]],
  ocean: [[2,5,15],[10,40,100],[20,120,180],[80,220,230],[200,255,255]],
  lattice: [[5,5,15],[40,30,120],[124,111,224],[100,200,140],[74,222,128]],
  monochrome: [[5,5,8],[40,40,48],[100,100,110],[180,180,195],[240,240,250]],
  infrared: [[5,0,10],[60,0,40],[160,0,60],[255,60,30],[255,220,100]]
};

function samplePalette(t, name) {
  const stops = PALETTE_DEFS[name] || PALETTE_DEFS.nebula;
  t = Math.max(0, Math.min(1, t));
  const idx = t * (stops.length - 1);
  const i0 = Math.floor(idx);
  const i1 = Math.min(i0 + 1, stops.length - 1);
  const f = idx - i0;
  return [
    stops[i0][0] + (stops[i1][0] - stops[i0][0]) * f,
    stops[i0][1] + (stops[i1][1] - stops[i0][1]) * f,
    stops[i0][2] + (stops[i1][2] - stops[i0][2]) * f
  ];
}

// ===== Attractor iteration =====
function iterate(x, y, a, b, c, d, type) {
  switch (type) {
    case 'clifford':
      return [
        Math.sin(a * y) + c * Math.cos(a * x),
        Math.sin(b * x) + d * Math.cos(b * y)
      ];
    case 'dejong':
      return [
        Math.sin(a * y) - Math.cos(b * x),
        Math.sin(c * x) - Math.cos(d * y)
      ];
    case 'bedhead':
      return [
        Math.sin(x * y / b) * y + Math.cos(a * x - y),
        x + Math.sin(y) / b
      ];
    case 'fractal-dream':
      return [
        Math.sin(b * y) + c * Math.sin(b * x),
        Math.sin(a * x) + d * Math.sin(a * y)
      ];
  }
  return [0, 0];
}

// ===== Density buffer =====
function clearDensity() {
  const size = W * dpr * H * dpr;
  if (!density || density.length !== size) {
    density = new Float32Array(size);
  } else {
    density.fill(0);
  }
  totalIter = 0;
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  clearDensity();
}

// ===== Core iteration + accumulation =====
function accumulatePoints(count) {
  const pw = W * dpr, ph = H * dpr;
  const cx = pw / 2 + panOffX * dpr;
  const cy = ph / 2 + panOffY * dpr;
  const scale = Math.min(pw, ph) * 0.18 * P.zoom;

  // Audio modulation
  let aMod = 0, bMod = 0;
  if (micActive && audioData) {
    analyser.getByteFrequencyData(audioData);
    let bassSum = 0, trebleSum = 0;
    for (let i = 0; i < 8; i++) bassSum += audioData[i];
    for (let i = 20; i < 40; i++) trebleSum += audioData[i];
    audioBass = bassSum / (8 * 255);
    audioTreble = trebleSum / (20 * 255);
    const s = P.audioSens;
    aMod = (audioBass - 0.3) * s * 0.15;
    bMod = (audioTreble - 0.3) * s * 0.1;
  }

  // Mouse warp
  let aWarp = 0, bWarp = 0, cWarp = 0, dWarp = 0;
  if (P.mouseMode === 'warp' && mouseX >= 0) {
    const nx = (mouseX / W - 0.5) * 2;
    const ny = (mouseY / H - 0.5) * 2;
    const s = P.warpStrength;
    aWarp = nx * s;
    bWarp = ny * s;
    cWarp = -ny * s * 0.5;
    dWarp = nx * s * 0.5;
  }

  // Animate drift
  let aDrift = 0, bDrift = 0;
  if (animating) {
    animPhase += 0.0003;
    aDrift = Math.sin(animPhase * 2.1) * 0.08;
    bDrift = Math.cos(animPhase * 1.7) * 0.06;
  }

  const a = P.a + aWarp + aMod + aDrift;
  const b = P.b + bWarp + bMod + bDrift;
  const c = P.c + cWarp;
  const d = P.d + dWarp;

  // Run iterations — use 4 independent trajectories for better coverage
  const trajectories = 4;
  const perTrajectory = Math.floor(count / trajectories);

  for (let t = 0; t < trajectories; t++) {
    let x = (Math.random() - 0.5) * 0.1;
    let y = (Math.random() - 0.5) * 0.1;
    // Skip transient
    for (let i = 0; i < 20; i++) {
      [x, y] = iterate(x, y, a, b, c, d, P.type);
    }
    for (let i = 0; i < perTrajectory; i++) {
      [x, y] = iterate(x, y, a, b, c, d, P.type);
      // Reject divergent points
      if (Math.abs(x) > 20 || Math.abs(y) > 20) {
        x = (Math.random() - 0.5) * 0.1;
        y = (Math.random() - 0.5) * 0.1;
        continue;
      }
      const px = (x * scale + cx) | 0;
      const py = (y * scale + cy) | 0;
      if (px >= 0 && px < pw && py >= 0 && py < ph) {
        density[py * pw + px]++;
      }
    }
  }
  totalIter += count;
}

// ===== Render density to canvas =====
function renderDensity() {
  const pw = W * dpr, ph = H * dpr;
  const img = ctx.createImageData(pw, ph);
  const data = img.data;

  // Find max density for normalization
  let maxD = 1;
  for (let i = 0; i < density.length; i++) {
    if (density[i] > maxD) maxD = density[i];
  }

  const logMax = Math.log(maxD + 1);
  const exposure = P.exposure;
  const bloomR = P.bloom > 0.01 ? 1 : 0;

  document.getElementById('statPeak').textContent = maxD.toFixed(0);

  for (let i = 0; i < density.length; i++) {
    const v = density[i];
    if (v === 0) {
      data[i * 4] = 10;
      data[i * 4 + 1] = 10;
      data[i * 4 + 2] = 15;
      data[i * 4 + 3] = 255;
      continue;
    }

    // Log-scale normalization with exposure
    let t = Math.log(v + 1) / logMax;
    t = Math.pow(t, 1 / (exposure * 1.5));
    t = Math.min(1, t);

    const [r, g, b] = samplePalette(t, P.palette);
    data[i * 4] = r | 0;
    data[i * 4 + 1] = g | 0;
    data[i * 4 + 2] = b | 0;
    data[i * 4 + 3] = 255;
  }

  ctx.putImageData(img, 0, 0);

  // Bloom pass (cheap: draw canvas over itself with additive blend + blur)
  if (bloomR) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = P.bloom * 0.35;
    ctx.filter = `blur(${4 * dpr}px)`;
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();

    // Second softer pass
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = P.bloom * 0.15;
    ctx.filter = `blur(${12 * dpr}px)`;
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();
  }
}

// ===== Animation loop =====
function frame() {
  if (!paused) {
    accumulatePoints(P.iterSpeed);
    renderDensity();
  }

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    displayFps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
    frameCount = 0;
    lastFpsTime = now;
    document.getElementById('statFps').textContent = displayFps;
    document.getElementById('statIter').textContent =
      totalIter >= 1e6 ? (totalIter / 1e6).toFixed(1) + 'M' :
      totalIter >= 1e3 ? (totalIter / 1e3).toFixed(0) + 'k' : totalIter;
  }

  requestAnimationFrame(frame);
}

// ===== Audio =====
async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    audioData = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    document.getElementById('micDot').classList.add('active');
    document.getElementById('micToggle').textContent = 'disable mic';
    document.getElementById('micToggle').classList.add('active');
  } catch (e) {
    console.warn('Mic access denied:', e);
  }
}

function stopMic() {
  micActive = false;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  document.getElementById('micDot').classList.remove('active');
  document.getElementById('micToggle').textContent = 'enable mic';
  document.getElementById('micToggle').classList.remove('active');
}

// ===== UI Bindings =====
function bindSlider(id, prop, fmt) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + 'Val');
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    P[prop] = v;
    valEl.textContent = fmt ? fmt(v) : v;
    // Parameter changes need re-render
    if (['a', 'b', 'c', 'd', 'zoom', 'exposure', 'bloom'].includes(prop)) {
      clearDensity();
    }
  });
  valEl.textContent = fmt ? fmt(P[prop]) : P[prop];
}

function syncSlidersToParams() {
  ['paramA', 'paramB', 'paramC', 'paramD'].forEach((id, i) => {
    const key = ['a', 'b', 'c', 'd'][i];
    const el = document.getElementById(id);
    el.value = P[key];
    document.getElementById(id + 'Val').textContent = P[key].toFixed(2);
  });
}

function bindToggleGroup(selector, key) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(selector).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const val = btn.dataset[Object.keys(btn.dataset)[0]];
      P[key] = val;

      if (key === 'type') {
        // Load a random preset for the new type
        const presets = PRESETS[val];
        if (presets) {
          const preset = presets[Math.floor(Math.random() * presets.length)];
          P.a = preset.a; P.b = preset.b;
          P.c = preset.c; P.d = preset.d;
          syncSlidersToParams();
        }
        clearDensity();
      }
      if (key === 'palette') renderDensity();
    });
  });
}

function randomize() {
  const presets = PRESETS[P.type];
  if (presets) {
    // 50% chance: known preset, 50% chance: random
    if (Math.random() < 0.5) {
      const preset = presets[Math.floor(Math.random() * presets.length)];
      P.a = preset.a; P.b = preset.b;
      P.c = preset.c; P.d = preset.d;
    } else {
      P.a = (Math.random() * 6 - 3);
      P.b = (Math.random() * 6 - 3);
      P.c = (Math.random() * 6 - 3);
      P.d = (Math.random() * 6 - 3);
      P.a = Math.round(P.a * 100) / 100;
      P.b = Math.round(P.b * 100) / 100;
      P.c = Math.round(P.c * 100) / 100;
      P.d = Math.round(P.d * 100) / 100;
    }
  }
  syncSlidersToParams();
  clearDensity();
}

function init() {
  resize();
  window.addEventListener('resize', () => { resize(); });

  // Sliders
  bindSlider('paramA', 'a', v => v.toFixed(2));
  bindSlider('paramB', 'b', v => v.toFixed(2));
  bindSlider('paramC', 'c', v => v.toFixed(2));
  bindSlider('paramD', 'd', v => v.toFixed(2));
  bindSlider('iterSpeed', 'iterSpeed', v => v >= 1000 ? (v/1000).toFixed(0) + 'k' : v);
  bindSlider('bloom', 'bloom', v => v.toFixed(2));
  bindSlider('exposure', 'exposure', v => v.toFixed(2));
  bindSlider('zoom', 'zoom', v => v.toFixed(2));
  bindSlider('warpStrength', 'warpStrength', v => v.toFixed(2));
  bindSlider('audioSens', 'audioSens', v => v.toFixed(1));

  // Toggle groups
  bindToggleGroup('[data-type]', 'type');
  bindToggleGroup('[data-palette]', 'palette');
  bindToggleGroup('[data-mouse]', 'mouseMode');

  // Mouse interaction
  canvas.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (mouseDown && P.mouseMode === 'pan') {
      panOffX = panBaseX + (e.clientX - panStartX);
      panOffY = panBaseY + (e.clientY - panStartY);
      clearDensity();
    }
    // Warp mode: continuous re-render
    if (P.mouseMode === 'warp') clearDensity();
  });
  canvas.addEventListener('mousedown', e => {
    mouseDown = true;
    panStartX = e.clientX; panStartY = e.clientY;
    panBaseX = panOffX; panBaseY = panOffY;
  });
  canvas.addEventListener('mouseup', () => { mouseDown = false; });
  canvas.addEventListener('mouseleave', () => {
    mouseX = -1; mouseY = -1; mouseDown = false;
    if (P.mouseMode === 'warp') clearDensity();
  });

  // Touch support
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    if (P.mouseMode === 'warp') clearDensity();
  }, { passive: false });
  canvas.addEventListener('touchend', () => {
    mouseX = -1; mouseY = -1;
    if (P.mouseMode === 'warp') clearDensity();
  });

  // Scroll to zoom
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    P.zoom = Math.max(0.3, Math.min(5, P.zoom * (1 - e.deltaY * 0.001)));
    document.getElementById('zoom').value = P.zoom;
    document.getElementById('zoomVal').textContent = P.zoom.toFixed(2);
    clearDensity();
  }, { passive: false });

  // Mic
  document.getElementById('micToggle').addEventListener('click', () => {
    if (micActive) stopMic(); else startMic();
  });

  // Actions
  document.getElementById('btnRandomize').addEventListener('click', randomize);
  document.getElementById('btnClear').addEventListener('click', () => { clearDensity(); });
  document.getElementById('btnPause').addEventListener('click', function() {
    paused = !paused;
    this.textContent = paused ? 'resume' : 'pause';
  });
  document.getElementById('btnAnimate').addEventListener('click', function() {
    animating = !animating;
    this.textContent = animating ? 'stop drift' : 'animate';
    this.classList.toggle('active', animating);
    if (animating) clearDensity();
  });
  document.getElementById('btnExport').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `orbit-${P.type}-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Panel toggle
  document.getElementById('panelToggle').addEventListener('click', () => {
    document.getElementById('panel').classList.toggle('collapsed');
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.target !== document.body) return;
    if (e.code === 'Space') {
      e.preventDefault();
      paused = !paused;
      document.getElementById('btnPause').textContent = paused ? 'resume' : 'pause';
    }
    if (e.key === 'h') document.getElementById('panel').classList.toggle('collapsed');
    if (e.key === 'r') randomize();
  });

  // Start
  frame();
}

init();
</script>
</body>
</html>
