<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Flux</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas#gl {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.25rem;
    }

    .hud-title h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      pointer-events: auto;
    }

    .back-link {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.05em;
      pointer-events: auto;
    }
    .back-link:hover { color: var(--accent); }

    .hud-stats {
      text-align: right;
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      line-height: 1.8;
    }
    .hud-stats .val { color: var(--green); }

    .panel {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 20;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      min-width: 480px;
      max-width: 90vw;
      transition: opacity 0.3s, transform 0.3s;
    }

    .panel.collapsed {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1.5rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .slider-row label {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      width: 75px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      background: var(--border);
      height: 3px;
      border-radius: 2px;
      outline: none;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .slider-row .val {
      font-size: 0.55rem;
      color: var(--green);
      width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .btn-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.6rem;
      grid-column: 1 / -1;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .palette-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .palette-btn:hover { transform: scale(1.2); }
    .palette-btn.active { border-color: #fff; transform: scale(1.2); }

    .palette-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      margin-top: 0.5rem;
      grid-column: 1 / -1;
      justify-content: center;
    }

    .palette-label {
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-right: 0.3rem;
    }

    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(10,10,15,0.6) 100%);
    }

    .start-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.6s;
    }
    .start-screen.hidden { opacity: 0; pointer-events: none; }

    .start-screen h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      margin-bottom: 1rem;
    }

    .start-screen p {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      max-width: 400px;
      text-align: center;
      line-height: 1.8;
    }

    .start-screen .cta {
      margin-top: 2rem;
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .mic-indicator {
      position: absolute;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.55rem;
      color: var(--green);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 15;
    }
    .mic-indicator.active { opacity: 1; }
    .mic-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @media (max-width: 600px) {
      .panel { min-width: unset; width: 95vw; padding: 0.75rem; }
      .panel-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="start-screen" id="start">
    <h1>Flux</h1>
    <p>GPU-powered fluid dynamics.<br>
    Move your mouse to inject dye and velocity.<br>
    Click to create vortices. Right-click to repel.<br>
    Enable your microphone to let sound drive the turbulence.</p>
    <div class="cta">Click to enter</div>
  </div>

  <canvas id="gl"></canvas>
  <div class="vignette"></div>

  <div class="mic-indicator" id="mic-indicator">
    <span class="mic-dot"></span> MIC ACTIVE
  </div>

  <div class="hud">
    <div class="hud-top">
      <div class="hud-title">
        <h1>Flux</h1>
        <a href="index.html" class="back-link">&larr; Gallery</a>
      </div>
      <div class="hud-stats" id="stats">
        FPS <span class="val" id="fps">0</span><br>
        SIM <span class="val" id="sim-res">512</span>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-grid">
      <div class="slider-row">
        <label>Viscosity</label>
        <input type="range" id="viscosity" min="0" max="100" value="15">
        <span class="val" id="viscosity-val">0.15</span>
      </div>
      <div class="slider-row">
        <label>Diffusion</label>
        <input type="range" id="diffusion" min="0" max="100" value="10">
        <span class="val" id="diffusion-val">0.10</span>
      </div>
      <div class="slider-row">
        <label>Pressure</label>
        <input type="range" id="pressure" min="5" max="60" value="20">
        <span class="val" id="pressure-val">20</span>
      </div>
      <div class="slider-row">
        <label>Curl</label>
        <input type="range" id="curl" min="0" max="50" value="20">
        <span class="val" id="curl-val">20</span>
      </div>
      <div class="slider-row">
        <label>Splat Radius</label>
        <input type="range" id="splat-radius" min="1" max="50" value="15">
        <span class="val" id="splat-radius-val">15</span>
      </div>
      <div class="slider-row">
        <label>Dye Fade</label>
        <input type="range" id="dissipation" min="90" max="100" value="98">
        <span class="val" id="dissipation-val">0.98</span>
      </div>
    </div>
    <div class="palette-row">
      <span class="palette-label">Palette</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-mic">&#127908; Mic</button>
      <button class="btn" id="btn-bloom">Bloom</button>
      <button class="btn" id="btn-clear">Clear</button>
      <button class="btn" id="btn-burst">Burst</button>
      <button class="btn" id="btn-save">&#128247; PNG</button>
    </div>
  </div>

<script>
'use strict';

/* ─── PALETTES ─── */
const PALETTES = [
  { name: 'Nebula',   colors: [[0.49,0.44,0.88],[0.29,0.85,0.50],[1.0,0.75,0.14],[0.94,0.27,0.27]] },
  { name: 'Ember',    colors: [[1.0,0.42,0.21],[1.0,0.72,0.08],[0.94,0.27,0.27],[0.58,0.15,0.05]] },
  { name: 'Ocean',    colors: [[0.13,0.83,0.93],[0.29,0.85,0.50],[0.07,0.59,0.41],[0.49,0.44,0.88]] },
  { name: 'Plasma',   colors: [[0.91,0.47,0.96],[0.49,0.44,0.88],[0.29,0.47,0.96],[0.13,0.83,0.93]] },
  { name: 'Verdant',  colors: [[0.29,0.85,0.50],[0.13,0.65,0.26],[0.84,0.97,0.14],[0.07,0.39,0.21]] },
  { name: 'Mono',     colors: [[0.78,0.78,0.83],[0.43,0.43,0.51],[0.25,0.25,0.32],[1.0,1.0,1.0]] },
];

let currentPalette = 0, colorIndex = 0;
function nextColor() {
  const p = PALETTES[currentPalette].colors;
  const c = p[colorIndex % p.length];
  colorIndex++;
  return { r: c[0], g: c[1], b: c[2] };
}

/* ─── WEBGL SETUP ─── */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { alpha: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<p style="color:#c8c8d4;text-align:center;margin-top:40vh">WebGL not supported</p>'; throw new Error('no webgl'); }

const ext = gl.getExtension('OES_texture_half_float');
const linearExt = gl.getExtension('OES_texture_half_float_linear');
const halfFloat = ext ? ext.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;

function canRenderToHalfFloat() {
  if (!ext) return false;
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 4, 0, gl.RGBA, halfFloat, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.deleteTexture(tex); gl.deleteFramebuffer(fb);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return ok;
}

const useHalf = canRenderToHalfFloat();
const texType = useHalf ? halfFloat : gl.UNSIGNED_BYTE;
const texFilter = (useHalf && linearExt) ? gl.LINEAR : gl.NEAREST;

let SIM_W = 512, SIM_H = 512, DYE_W = 1024, DYE_H = 1024;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  const a = canvas.width / canvas.height;
  SIM_W = a > 1 ? 512 : Math.round(512 * a);
  SIM_H = a > 1 ? Math.round(512 / a) : 512;
  DYE_W = a > 1 ? 1024 : Math.round(1024 * a);
  DYE_H = a > 1 ? Math.round(1024 / a) : 1024;
  document.getElementById('sim-res').textContent = SIM_W + '\u00d7' + SIM_H;
}
resize();

/* ─── SHADER HELPERS ─── */
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  return p;
}
function getUniforms(prog, names) {
  const u = {};
  for (const n of names) u[n] = gl.getUniformLocation(prog, n);
  return u;
}

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

/* ─── SHADERS ─── */
const baseVS = `
attribute vec2 aPosition;
varying vec2 vUv, vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const splatFS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
void main() {
  vec2 p = vUv - point;
  p.x *= aspectRatio;
  vec3 splat = exp(-dot(p, p) / radius) * color;
  gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + splat, 1.0);
}`;

const advectionFS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uVelocity, uSource;
uniform vec2 texelSize;
uniform float dt, dissipation;
void main() {
  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
  gl_FragColor = dissipation * texture2D(uSource, coord);
}`;

const divergenceFS = `
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
void main() {
  float L = texture2D(uVelocity, vL).x;
  float R = texture2D(uVelocity, vR).x;
  float T = texture2D(uVelocity, vT).y;
  float B = texture2D(uVelocity, vB).y;
  gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`;

const pressureFS = `
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure, uDivergence;
void main() {
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  float div = texture2D(uDivergence, vUv).x;
  gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`;

const gradientSubFS = `
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uPressure, uVelocity;
void main() {
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  vec2 vel = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B) * 0.5;
  gl_FragColor = vec4(vel, 0.0, 1.0);
}`;

const curlFS = `
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity;
void main() {
  float L = texture2D(uVelocity, vL).y;
  float R = texture2D(uVelocity, vR).y;
  float T = texture2D(uVelocity, vT).x;
  float B = texture2D(uVelocity, vB).x;
  gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`;

const vorticityFS = `
precision highp float;
varying vec2 vUv, vL, vR, vT, vB;
uniform sampler2D uVelocity, uCurl;
uniform float curl, dt;
void main() {
  float L = texture2D(uCurl, vL).x;
  float R = texture2D(uCurl, vR).x;
  float T = texture2D(uCurl, vT).x;
  float B = texture2D(uCurl, vB).x;
  float C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  gl_FragColor = vec4(texture2D(uVelocity, vUv).xy + force * dt, 0.0, 1.0);
}`;

const displayFS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTexture;
uniform float bloom;
void main() {
  vec3 c = texture2D(uTexture, vUv).rgb;
  if (bloom > 0.5) {
    float lum = dot(c, vec3(0.299, 0.587, 0.114));
    c += c * smoothstep(0.4, 1.0, lum) * 0.6;
  }
  gl_FragColor = vec4(c, 1.0);
}`;

const clearFS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTexture;
uniform float value;
void main() {
  gl_FragColor = value * texture2D(uTexture, vUv);
}`;

/* ─── PROGRAMS ─── */
const splatProg = createProgram(baseVS, splatFS);
const splatU = getUniforms(splatProg, ['texelSize','uTarget','aspectRatio','color','point','radius']);
const advProg = createProgram(baseVS, advectionFS);
const advU = getUniforms(advProg, ['texelSize','uVelocity','uSource','dt','dissipation']);
const divProg = createProgram(baseVS, divergenceFS);
const divU = getUniforms(divProg, ['texelSize','uVelocity']);
const presProg = createProgram(baseVS, pressureFS);
const presU = getUniforms(presProg, ['texelSize','uPressure','uDivergence']);
const gradProg = createProgram(baseVS, gradientSubFS);
const gradU = getUniforms(gradProg, ['texelSize','uPressure','uVelocity']);
const curlProg = createProgram(baseVS, curlFS);
const curlU = getUniforms(curlProg, ['texelSize','uVelocity']);
const vortProg = createProgram(baseVS, vorticityFS);
const vortU = getUniforms(vortProg, ['texelSize','uVelocity','uCurl','curl','dt']);
const dispProg = createProgram(baseVS, displayFS);
const dispU = getUniforms(dispProg, ['texelSize','uTexture','bloom']);
const clearProg = createProgram(baseVS, clearFS);
const clearU = getUniforms(clearProg, ['texelSize','uTexture','value']);

/* ─── FRAMEBUFFERS ─── */
function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, texFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, texFilter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { texture: tex, fbo: fb, width: w, height: h };
}
function createDoubleFBO(w, h) {
  return { width: w, height: h, read: createFBO(w, h), write: createFBO(w, h),
    swap() { const t = this.read; this.read = this.write; this.write = t; }
  };
}

let velocity, pressure, divergenceFBO, curlFBO, dye;
function initFBOs() {
  velocity = createDoubleFBO(SIM_W, SIM_H);
  pressure = createDoubleFBO(SIM_W, SIM_H);
  divergenceFBO = createFBO(SIM_W, SIM_H);
  curlFBO = createFBO(SIM_W, SIM_H);
  dye = createDoubleFBO(DYE_W, DYE_H);
}
initFBOs();

/* ─── DRAW HELPERS ─── */
function drawQuad(target) {
  if (target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.width, target.height);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function bindTex(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

/* ─── CONFIG ─── */
const config = {
  viscosity: 0.15,
  diffusion: 0.10,
  pressureIterations: 20,
  curlStrength: 20,
  splatRadius: 0.003,
  dyeDissipation: 0.98,
  velocityDissipation: 0.98,
  bloom: false,
};

/* ─── SPLAT ─── */
function splat(x, y, dx, dy, color) {
  gl.useProgram(splatProg);
  gl.uniform2f(splatU.texelSize, 1/SIM_W, 1/SIM_H);
  gl.uniform1f(splatU.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatU.point, x, y);
  gl.uniform1f(splatU.radius, config.splatRadius);
  gl.uniform3f(splatU.color, dx, dy, 0);
  bindTex(0, velocity.read.texture); gl.uniform1i(splatU.uTarget, 0);
  drawQuad(velocity.write); velocity.swap();

  gl.uniform2f(splatU.texelSize, 1/DYE_W, 1/DYE_H);
  gl.uniform3f(splatU.color, color.r * 0.6, color.g * 0.6, color.b * 0.6);
  bindTex(0, dye.read.texture); gl.uniform1i(splatU.uTarget, 0);
  drawQuad(dye.write); dye.swap();
}

/* ─── SIMULATION STEP ─── */
function step(dt) {
  // Curl
  gl.useProgram(curlProg);
  gl.uniform2f(curlU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, velocity.read.texture); gl.uniform1i(curlU.uVelocity, 0);
  drawQuad(curlFBO);

  // Vorticity confinement
  gl.useProgram(vortProg);
  gl.uniform2f(vortU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, velocity.read.texture); gl.uniform1i(vortU.uVelocity, 0);
  bindTex(1, curlFBO.texture); gl.uniform1i(vortU.uCurl, 1);
  gl.uniform1f(vortU.curl, config.curlStrength);
  gl.uniform1f(vortU.dt, dt);
  drawQuad(velocity.write); velocity.swap();

  // Advect velocity
  gl.useProgram(advProg);
  gl.uniform2f(advU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, velocity.read.texture); gl.uniform1i(advU.uVelocity, 0);
  bindTex(1, velocity.read.texture); gl.uniform1i(advU.uSource, 1);
  gl.uniform1f(advU.dt, dt);
  gl.uniform1f(advU.dissipation, config.velocityDissipation);
  drawQuad(velocity.write); velocity.swap();

  // Advect dye
  gl.uniform2f(advU.texelSize, 1/DYE_W, 1/DYE_H);
  bindTex(0, velocity.read.texture); gl.uniform1i(advU.uVelocity, 0);
  bindTex(1, dye.read.texture); gl.uniform1i(advU.uSource, 1);
  gl.uniform1f(advU.dissipation, config.dyeDissipation);
  drawQuad(dye.write); dye.swap();

  // Divergence
  gl.useProgram(divProg);
  gl.uniform2f(divU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, velocity.read.texture); gl.uniform1i(divU.uVelocity, 0);
  drawQuad(divergenceFBO);

  // Clear pressure
  gl.useProgram(clearProg);
  gl.uniform2f(clearU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, pressure.read.texture); gl.uniform1i(clearU.uTexture, 0);
  gl.uniform1f(clearU.value, config.viscosity);
  drawQuad(pressure.write); pressure.swap();

  // Pressure solve (Jacobi)
  gl.useProgram(presProg);
  gl.uniform2f(presU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(1, divergenceFBO.texture); gl.uniform1i(presU.uDivergence, 1);
  for (let i = 0; i < config.pressureIterations; i++) {
    bindTex(0, pressure.read.texture); gl.uniform1i(presU.uPressure, 0);
    drawQuad(pressure.write); pressure.swap();
  }

  // Gradient subtract
  gl.useProgram(gradProg);
  gl.uniform2f(gradU.texelSize, 1/SIM_W, 1/SIM_H);
  bindTex(0, pressure.read.texture); gl.uniform1i(gradU.uPressure, 0);
  bindTex(1, velocity.read.texture); gl.uniform1i(gradU.uVelocity, 1);
  drawQuad(velocity.write); velocity.swap();
}

function render() {
  gl.useProgram(dispProg);
  gl.uniform2f(dispU.texelSize, 1/DYE_W, 1/DYE_H);
  bindTex(0, dye.read.texture); gl.uniform1i(dispU.uTexture, 0);
  gl.uniform1f(dispU.bloom, config.bloom ? 1 : 0);
  drawQuad(null);
}

/* ─── INPUT ─── */
let pointer = { x: 0, y: 0, dx: 0, dy: 0, down: false, moved: false, rightDown: false };
let lastPtr = { x: 0, y: 0 };

function updatePointer(cx, cy) {
  const px = cx / window.innerWidth;
  const py = 1 - cy / window.innerHeight;
  pointer.dx = (px - lastPtr.x) * 30;
  pointer.dy = (py - lastPtr.y) * 30;
  lastPtr.x = px; lastPtr.y = py;
  pointer.x = px; pointer.y = py;
  pointer.moved = true;
}

canvas.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
canvas.addEventListener('mousedown', e => { if (e.button === 2) pointer.rightDown = true; else pointer.down = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 2) pointer.rightDown = false; else pointer.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', e => { e.preventDefault(); pointer.down = true; updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', () => { pointer.down = false; });

/* ─── AUDIO ─── */
let audioCtx = null, analyser = null, audioData = null, micActive = false;

async function toggleMic() {
  if (micActive) {
    micActive = false;
    document.getElementById('mic-indicator').classList.remove('active');
    document.getElementById('btn-mic').classList.remove('active');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioData = new Uint8Array(analyser.frequencyBinCount);
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    micActive = true;
    document.getElementById('mic-indicator').classList.add('active');
    document.getElementById('btn-mic').classList.add('active');
  } catch (e) { console.warn('Mic denied:', e); }
}

function getAudioEnergy() {
  if (!micActive || !analyser) return { bass: 0, mid: 0, high: 0 };
  analyser.getByteFrequencyData(audioData);
  const n = audioData.length, t = Math.floor(n / 3);
  let bass = 0, mid = 0, high = 0;
  for (let i = 0; i < t; i++) bass += audioData[i];
  for (let i = t; i < t * 2; i++) mid += audioData[i];
  for (let i = t * 2; i < n; i++) high += audioData[i];
  return { bass: bass / (t * 255), mid: mid / (t * 255), high: high / ((n - t * 2) * 255) };
}

/* ─── UI ─── */
const sliders = {
  viscosity:     { valEl: 'viscosity-val',    map: v => v/100,     fmt: v => (v/100).toFixed(2),  key: 'viscosity' },
  diffusion:     { valEl: 'diffusion-val',    map: v => v/100,     fmt: v => (v/100).toFixed(2),  key: 'diffusion' },
  pressure:      { valEl: 'pressure-val',     map: v => Math.round(v), fmt: v => ''+Math.round(v), key: 'pressureIterations' },
  curl:          { valEl: 'curl-val',         map: v => v,         fmt: v => ''+Math.round(v),    key: 'curlStrength' },
  'splat-radius':{ valEl: 'splat-radius-val', map: v => v*0.0002,  fmt: v => ''+Math.round(v),    key: 'splatRadius' },
  dissipation:   { valEl: 'dissipation-val',  map: v => v/100,     fmt: v => (v/100).toFixed(2),  key: 'dyeDissipation' },
};
for (const [id, s] of Object.entries(sliders)) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    config[s.key] = s.map(v);
    document.getElementById(s.valEl).textContent = s.fmt(v);
  });
}

// Palette buttons
const paletteRow = document.querySelector('.palette-row');
PALETTES.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'palette-btn' + (i === 0 ? ' active' : '');
  const avg = p.colors.reduce((a, c) => [a[0]+c[0],a[1]+c[1],a[2]+c[2]], [0,0,0]);
  const n = p.colors.length;
  btn.style.background = `rgb(${Math.round(avg[0]/n*255)},${Math.round(avg[1]/n*255)},${Math.round(avg[2]/n*255)})`;
  btn.title = p.name;
  btn.addEventListener('click', () => {
    currentPalette = i;
    document.querySelectorAll('.palette-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  });
  paletteRow.appendChild(btn);
});

document.getElementById('btn-mic').addEventListener('click', toggleMic);
document.getElementById('btn-bloom').addEventListener('click', () => {
  config.bloom = !config.bloom;
  document.getElementById('btn-bloom').classList.toggle('active', config.bloom);
});
document.getElementById('btn-clear').addEventListener('click', () => {
  gl.useProgram(clearProg);
  gl.uniform2f(clearU.texelSize, 1/DYE_W, 1/DYE_H);
  bindTex(0, dye.read.texture); gl.uniform1i(clearU.uTexture, 0);
  gl.uniform1f(clearU.value, 0);
  drawQuad(dye.write); dye.swap();
});
document.getElementById('btn-burst').addEventListener('click', () => {
  for (let i = 0; i < 12; i++) {
    const a = (i/12) * Math.PI * 2, r = 0.15;
    splat(0.5 + Math.cos(a)*r, 0.5 + Math.sin(a)*r, Math.cos(a)*15, Math.sin(a)*15, nextColor());
  }
});
document.getElementById('btn-save').addEventListener('click', () => {
  render();
  const link = document.createElement('a');
  link.download = 'flux-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

let panelVisible = true;
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); panelVisible = !panelVisible; document.getElementById('panel').classList.toggle('collapsed', !panelVisible); }
  if (e.key === 'm' || e.key === 'M') toggleMic();
  if (e.key === 'b' || e.key === 'B') { config.bloom = !config.bloom; document.getElementById('btn-bloom').classList.toggle('active', config.bloom); }
  if (e.key === 'c' || e.key === 'C') document.getElementById('btn-clear').click();
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-burst').click(); }
  if (e.key === 's' || e.key === 'S') document.getElementById('btn-save').click();
  const num = parseInt(e.key);
  if (num >= 1 && num <= PALETTES.length) {
    currentPalette = num - 1;
    document.querySelectorAll('.palette-btn').forEach((b, i) => b.classList.toggle('active', i === currentPalette));
  }
});

/* ─── START ─── */
let started = false;
document.getElementById('start').addEventListener('click', () => {
  started = true;
  document.getElementById('start').classList.add('hidden');
  setTimeout(() => {
    for (let i = 0; i < 8; i++) {
      const x = 0.3 + Math.random()*0.4, y = 0.3 + Math.random()*0.4;
      const a = Math.random() * Math.PI * 2;
      splat(x, y, Math.cos(a)*12, Math.sin(a)*12, nextColor());
    }
  }, 100);
});

window.addEventListener('resize', () => { resize(); initFBOs(); });

/* ─── MAIN LOOP ─── */
let lastTime = 0, frameCount = 0, fpsTimer = 0;

function loop(time) {
  requestAnimationFrame(loop);
  if (!started) return;

  const dt = Math.min((time - lastTime) / 1000, 0.033);
  lastTime = time;

  frameCount++; fpsTimer += dt;
  if (fpsTimer > 0.5) {
    document.getElementById('fps').textContent = Math.round(frameCount / fpsTimer);
    frameCount = 0; fpsTimer = 0;
  }

  // Audio-driven splats
  const audio = getAudioEnergy();
  if (micActive) {
    if (audio.bass > 0.25) {
      const a = Math.random() * Math.PI * 2, f = audio.bass * 25;
      splat(0.5+(Math.random()-0.5)*0.3, 0.5+(Math.random()-0.5)*0.3, Math.cos(a)*f, Math.sin(a)*f, nextColor());
    }
    if (audio.high > 0.2) {
      const edge = Math.random();
      let x, y;
      if (edge < 0.25) { x = 0; y = Math.random(); }
      else if (edge < 0.5) { x = 1; y = Math.random(); }
      else if (edge < 0.75) { x = Math.random(); y = 0; }
      else { x = Math.random(); y = 1; }
      const a = Math.atan2(0.5-y, 0.5-x);
      splat(x, y, Math.cos(a)*audio.high*15, Math.sin(a)*audio.high*15, nextColor());
    }
  }

  // Mouse
  if (pointer.moved) {
    pointer.moved = false;
    const force = pointer.down ? 2.5 : 1;
    const repel = pointer.rightDown ? -1 : 1;
    splat(pointer.x, pointer.y, pointer.dx*force*repel, pointer.dy*force*repel, nextColor());
  }
  if (pointer.down && Math.random() < 0.3) {
    const a = Math.random() * Math.PI * 2;
    splat(pointer.x, pointer.y, Math.cos(a)*8, Math.sin(a)*8, nextColor());
  }

  step(dt);
  render();
}

requestAnimationFrame(loop);
</script>
