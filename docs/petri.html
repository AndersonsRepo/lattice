<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Petri</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.25rem;
    }

    .hud-title { pointer-events: auto; }
    .hud-title h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
    }
    .hud-title .back-link {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .hud-title .back-link:hover { color: var(--accent); }

    .hud-stats {
      text-align: right;
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      line-height: 1.8;
      pointer-events: auto;
    }
    .hud-stats .val { color: var(--green); }

    /* --- Control panel --- */
    .panel {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      width: 240px;
      background: rgba(18, 18, 26, 0.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1rem;
      pointer-events: auto;
      z-index: 20;
      max-height: 85vh;
      overflow-y: auto;
      transition: opacity 0.3s, transform 0.3s;
    }
    .panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(20px);
    }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-title {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin: 0.75rem 0 0.5rem;
    }
    .section-title:first-child { margin-top: 0; }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }
    .slider-label {
      font-size: 0.6rem;
      color: var(--text-dim);
      min-width: 50px;
    }
    .slider-val {
      font-size: 0.6rem;
      color: var(--green);
      min-width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      margin: 0 0.5rem;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .preset-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      padding: 0.35rem 0.4rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      text-align: center;
    }
    .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
    .preset-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(124,111,224,0.1); }

    .palette-row {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .palette-swatch {
      width: 24px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .palette-swatch:hover { transform: scale(1.15); }
    .palette-swatch.active { border-color: #fff; transform: scale(1.15); }

    .brush-toggle {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .brush-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      padding: 0.35rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      text-align: center;
    }
    .brush-btn:hover { border-color: var(--accent); }
    .brush-btn.active { border-color: var(--green); color: var(--green); background: rgba(74,222,128,0.08); }

    .action-row {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }
    .action-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      padding: 0.4rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      text-align: center;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }

    .kbd {
      display: inline-block;
      font-size: 0.5rem;
      color: var(--text-dim);
      background: rgba(30,30,46,0.6);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.1rem 0.3rem;
      margin-left: 0.3rem;
      vertical-align: middle;
    }

    .help-text {
      font-size: 0.5rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-top: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    .help-text .key { color: var(--accent); }

    /* Spectrum bar */
    #spectrum {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 40px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #spectrum.active { opacity: 1; }

    /* Brush cursor preview */
    #brush-cursor {
      position: absolute;
      border: 1px solid rgba(124,111,224,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      transition: width 0.15s, height 0.15s;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="spectrum"></canvas>
  <div id="brush-cursor"></div>

  <div class="hud">
    <div class="hud-top">
      <div class="hud-title">
        <h1>Petri</h1>
        <a href="index.html" class="back-link">&larr; Lattice</a>
      </div>
      <div class="hud-stats">
        <span id="stat-gen">gen <span class="val">0</span></span><br>
        <span id="stat-fps"><span class="val">60</span> fps</span><br>
        <span id="stat-audio" style="display:none">mic <span class="val">off</span></span>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="section-title">Presets</div>
    <div class="preset-grid" id="presets"></div>

    <div class="section-title">Parameters</div>
    <div class="slider-row">
      <span class="slider-label">Feed</span>
      <input type="range" id="feed" min="0" max="0.1" step="0.0001" value="0.055">
      <span class="slider-val" id="feed-val">0.055</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">Kill</span>
      <input type="range" id="kill" min="0" max="0.1" step="0.0001" value="0.062">
      <span class="slider-val" id="kill-val">0.062</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">D<sub>u</sub></span>
      <input type="range" id="du" min="0.05" max="0.5" step="0.001" value="0.21">
      <span class="slider-val" id="du-val">0.210</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">D<sub>v</sub></span>
      <input type="range" id="dv" min="0.01" max="0.2" step="0.001" value="0.105">
      <span class="slider-val" id="dv-val">0.105</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">Speed</span>
      <input type="range" id="speed" min="1" max="40" step="1" value="10">
      <span class="slider-val" id="speed-val">10</span>
    </div>

    <div class="section-title">Brush</div>
    <div class="brush-toggle" id="brushes">
      <button class="brush-btn active" data-brush="seed">Seed (V)</button>
      <button class="brush-btn" data-brush="clear">Erase (U)</button>
    </div>
    <div class="slider-row">
      <span class="slider-label">Radius</span>
      <input type="range" id="radius" min="2" max="60" step="1" value="15">
      <span class="slider-val" id="radius-val">15</span>
    </div>

    <div class="section-title">Palette</div>
    <div class="palette-row" id="palettes"></div>

    <div class="section-title">Audio <span class="kbd">M</span></div>
    <div class="slider-row">
      <span class="slider-label">Reactive</span>
      <input type="range" id="audio-mix" min="0" max="1" step="0.01" value="0.5">
      <span class="slider-val" id="audio-mix-val">0.50</span>
    </div>

    <div class="action-row">
      <button class="action-btn" id="btn-clear">Clear</button>
      <button class="action-btn" id="btn-randomize">Scatter</button>
      <button class="action-btn" id="btn-export">PNG</button>
    </div>

    <div class="help-text">
      <span class="key">Click+drag</span> paint chemicals<br>
      <span class="key">Scroll</span> brush size<br>
      <span class="key">Space</span> pause &nbsp; <span class="key">H</span> panel<br>
      <span class="key">1-8</span> presets &nbsp; <span class="key">C</span> clear<br>
      <span class="key">R</span> scatter &nbsp; <span class="key">S</span> export<br>
      <span class="key">M</span> microphone &nbsp; <span class="key">B</span> brush
    </div>
  </div>

<script>
// ==========================================
// Petri — Reaction-Diffusion Laboratory
// ==========================================

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<p style="color:#c8c8d4;padding:2rem">WebGL not supported</p>'; throw 'no webgl'; }

// --- Simulation resolution ---
const SIM_W = 512, SIM_H = 512;

// --- State ---
const state = {
  feed: 0.055,
  kill: 0.062,
  du: 0.21,
  dv: 0.105,
  speed: 10,
  brush: 'seed',
  radius: 15,
  palette: 0,
  paused: false,
  panelVisible: true,
  generation: 0,
  mouseDown: false,
  mouseX: 0,
  mouseY: 0,
  audioActive: false,
  audioMix: 0.5,
  audioBass: 0,
  audioMid: 0,
  audioTreble: 0,
};

// --- Presets: curated Gray-Scott parameter regions ---
const PRESETS = [
  { name: 'Mitosis',   f: 0.0367, k: 0.0649 },
  { name: 'Coral',     f: 0.0545, k: 0.062  },
  { name: 'Spirals',   f: 0.014,  k: 0.045  },
  { name: 'Spots',     f: 0.035,  k: 0.065  },
  { name: 'Stripes',   f: 0.06,   k: 0.062  },
  { name: 'Worms',     f: 0.078,  k: 0.061  },
  { name: 'Maze',      f: 0.029,  k: 0.057  },
  { name: 'Bubbles',   f: 0.012,  k: 0.05   },
];

// --- Palettes: each is [bg, low, mid, high, peak] as RGB arrays ---
const PALETTES = [
  { name: 'Void',     colors: [[10,10,15],[30,20,60],[124,111,224],[74,222,128],[255,255,255]] },
  { name: 'Ember',    colors: [[15,5,5],[80,20,10],[220,80,30],[255,180,40],[255,250,220]] },
  { name: 'Ocean',    colors: [[5,10,20],[10,40,80],[20,140,200],[74,222,180],[200,255,255]] },
  { name: 'Neon',     colors: [[10,10,15],[200,40,180],[80,40,220],[40,220,200],[255,255,100]] },
  { name: 'Mono',     colors: [[10,10,15],[40,40,50],[100,100,110],[180,180,190],[240,240,245]] },
  { name: 'Blood',    colors: [[15,5,5],[100,10,20],[180,20,40],[220,60,80],[255,200,200]] },
  { name: 'Frost',    colors: [[5,10,20],[20,60,120],[80,160,220],[180,220,255],[240,250,255]] },
  { name: 'Lattice',  colors: [[10,10,15],[50,40,100],[124,111,224],[74,222,128],[251,191,36]] },
];

// ==========================================
// WebGL Helpers
// ==========================================

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

function createTexture(w, h, data) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return tex;
}

function createFBO(w, h) {
  const tex = createTexture(w, h, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb };
}

// ==========================================
// Shaders
// ==========================================

const VERT = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0, 1);
}`;

// Gray-Scott simulation step
const FRAG_SIM = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_state;
uniform vec2 u_texel;
uniform float u_feed;
uniform float u_kill;
uniform float u_du;
uniform float u_dv;
uniform float u_dt;
uniform int u_brushActive;
uniform vec2 u_brushPos;
uniform float u_brushRadius;
uniform int u_brushType; // 0 = seed V, 1 = erase to U

void main() {
  vec4 s = texture2D(u_state, v_uv);
  float u = s.r;
  float v = s.g;

  // 9-point Laplacian (weighted)
  vec4 sL = texture2D(u_state, v_uv + vec2(-u_texel.x, 0.0));
  vec4 sR = texture2D(u_state, v_uv + vec2( u_texel.x, 0.0));
  vec4 sU = texture2D(u_state, v_uv + vec2(0.0,  u_texel.y));
  vec4 sD = texture2D(u_state, v_uv + vec2(0.0, -u_texel.y));
  vec4 sTL = texture2D(u_state, v_uv + vec2(-u_texel.x,  u_texel.y));
  vec4 sTR = texture2D(u_state, v_uv + vec2( u_texel.x,  u_texel.y));
  vec4 sBL = texture2D(u_state, v_uv + vec2(-u_texel.x, -u_texel.y));
  vec4 sBR = texture2D(u_state, v_uv + vec2( u_texel.x, -u_texel.y));

  float lapU = (sL.r + sR.r + sU.r + sD.r) * 0.2
             + (sTL.r + sTR.r + sBL.r + sBR.r) * 0.05
             - u;
  float lapV = (sL.g + sR.g + sU.g + sD.g) * 0.2
             + (sTL.g + sTR.g + sBL.g + sBR.g) * 0.05
             - v;

  float uvv = u * v * v;
  float du = u_du * lapU - uvv + u_feed * (1.0 - u);
  float dv = u_dv * lapV + uvv - (u_feed + u_kill) * v;

  u += du * u_dt;
  v += dv * u_dt;

  // Brush interaction
  if (u_brushActive == 1) {
    float d = distance(v_uv, u_brushPos) / u_brushRadius;
    if (d < 1.0) {
      float strength = smoothstep(1.0, 0.0, d);
      if (u_brushType == 0) {
        // Seed: add chemical V
        v = mix(v, 1.0, strength * 0.8);
        u = mix(u, 0.0, strength * 0.3);
      } else {
        // Erase: restore to U=1, V=0
        u = mix(u, 1.0, strength * 0.9);
        v = mix(v, 0.0, strength * 0.9);
      }
    }
  }

  gl_FragColor = vec4(clamp(u, 0.0, 1.0), clamp(v, 0.0, 1.0), 0.0, 1.0);
}`;

// Color mapping / display shader
const FRAG_DISPLAY = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_state;
uniform vec3 u_pal[5];

void main() {
  vec4 s = texture2D(u_state, v_uv);
  float v = s.g; // chemical V concentration

  // 5-stop gradient
  vec3 col;
  if (v < 0.1) {
    col = mix(u_pal[0], u_pal[1], v / 0.1);
  } else if (v < 0.3) {
    col = mix(u_pal[1], u_pal[2], (v - 0.1) / 0.2);
  } else if (v < 0.6) {
    col = mix(u_pal[2], u_pal[3], (v - 0.3) / 0.3);
  } else {
    col = mix(u_pal[3], u_pal[4], min((v - 0.6) / 0.4, 1.0));
  }

  // Subtle vignette
  vec2 vc = v_uv - 0.5;
  float vign = 1.0 - dot(vc, vc) * 0.6;
  col *= vign;

  gl_FragColor = vec4(col, 1.0);
}`;

// ==========================================
// Initialize WebGL
// ==========================================

// Full-screen quad
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

// Compile programs
const vsShader = createShader(gl.VERTEX_SHADER, VERT);
const simProg = createProgram(vsShader, createShader(gl.FRAGMENT_SHADER, FRAG_SIM));
const dispProg = createProgram(vsShader, createShader(gl.FRAGMENT_SHADER, FRAG_DISPLAY));

// Uniform locations — simulation
const simUni = {};
['u_state','u_texel','u_feed','u_kill','u_du','u_dv','u_dt',
 'u_brushActive','u_brushPos','u_brushRadius','u_brushType'].forEach(n => {
  simUni[n] = gl.getUniformLocation(simProg, n);
});
const simAttr = gl.getAttribLocation(simProg, 'a_pos');

// Uniform locations — display
const dispUni = {};
['u_state'].forEach(n => { dispUni[n] = gl.getUniformLocation(dispProg, n); });
for (let i = 0; i < 5; i++) dispUni['u_pal'+i] = gl.getUniformLocation(dispProg, 'u_pal['+i+']');
const dispAttr = gl.getAttribLocation(dispProg, 'a_pos');

// Ping-pong framebuffers
let fboA = createFBO(SIM_W, SIM_H);
let fboB = createFBO(SIM_W, SIM_H);
let current = fboA, next = fboB;

// ==========================================
// Initialize simulation state
// ==========================================

function initState() {
  const data = new Uint8Array(SIM_W * SIM_H * 4);
  for (let i = 0; i < SIM_W * SIM_H; i++) {
    data[i*4]   = 255; // U = 1.0
    data[i*4+1] = 0;   // V = 0.0
    data[i*4+2] = 0;
    data[i*4+3] = 255;
  }
  // Seed a few spots of V in center region
  seedSpots(data, 8);
  gl.bindTexture(gl.TEXTURE_2D, current.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  state.generation = 0;
}

function seedSpots(data, count) {
  for (let n = 0; n < count; n++) {
    const cx = Math.floor(SIM_W * 0.25 + Math.random() * SIM_W * 0.5);
    const cy = Math.floor(SIM_H * 0.25 + Math.random() * SIM_H * 0.5);
    const r = 4 + Math.floor(Math.random() * 8);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx*dx + dy*dy > r*r) continue;
        const x = (cx + dx + SIM_W) % SIM_W;
        const y = (cy + dy + SIM_H) % SIM_H;
        const idx = (y * SIM_W + x) * 4;
        const falloff = 1 - Math.sqrt(dx*dx + dy*dy) / r;
        data[idx]   = Math.floor(255 * (1 - falloff * 0.5)); // reduce U
        data[idx+1] = Math.floor(255 * falloff * (0.5 + Math.random() * 0.5)); // add V
      }
    }
  }
}

function clearState() {
  const data = new Uint8Array(SIM_W * SIM_H * 4);
  for (let i = 0; i < SIM_W * SIM_H; i++) {
    data[i*4] = 255;
    data[i*4+1] = 0;
    data[i*4+2] = 0;
    data[i*4+3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, current.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  state.generation = 0;
}

function scatterSeeds() {
  // Read current state, add random seeds
  gl.bindFramebuffer(gl.FRAMEBUFFER, current.fb);
  const data = new Uint8Array(SIM_W * SIM_H * 4);
  gl.readPixels(0, 0, SIM_W, SIM_H, gl.RGBA, gl.UNSIGNED_BYTE, data);
  seedSpots(data, 12 + Math.floor(Math.random() * 8));
  gl.bindTexture(gl.TEXTURE_2D, current.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ==========================================
// Simulation step
// ==========================================

function simStep() {
  gl.useProgram(simProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, next.fb);
  gl.viewport(0, 0, SIM_W, SIM_H);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, current.tex);
  gl.uniform1i(simUni.u_state, 0);

  gl.uniform2f(simUni.u_texel, 1/SIM_W, 1/SIM_H);

  // Apply audio modulation to feed/kill
  let feed = state.feed;
  let kill = state.kill;
  if (state.audioActive) {
    const mix = state.audioMix;
    feed += (state.audioBass - 0.5) * 0.008 * mix;
    kill += (state.audioTreble - 0.5) * 0.005 * mix;
    feed = Math.max(0, Math.min(0.1, feed));
    kill = Math.max(0, Math.min(0.1, kill));
  }

  gl.uniform1f(simUni.u_feed, feed);
  gl.uniform1f(simUni.u_kill, kill);
  gl.uniform1f(simUni.u_du, state.du);
  gl.uniform1f(simUni.u_dv, state.dv);
  gl.uniform1f(simUni.u_dt, 1.0);

  // Brush
  if (state.mouseDown) {
    gl.uniform1i(simUni.u_brushActive, 1);
    gl.uniform2f(simUni.u_brushPos, state.mouseX, state.mouseY);
    gl.uniform1f(simUni.u_brushRadius, state.radius / SIM_W);
    gl.uniform1i(simUni.u_brushType, state.brush === 'seed' ? 0 : 1);
  } else {
    gl.uniform1i(simUni.u_brushActive, 0);
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(simAttr);
  gl.vertexAttribPointer(simAttr, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Swap
  const tmp = current;
  current = next;
  next = tmp;

  state.generation++;
}

// ==========================================
// Display
// ==========================================

function display() {
  gl.useProgram(dispProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, current.tex);
  gl.uniform1i(dispUni.u_state, 0);

  // Upload palette colors
  const pal = PALETTES[state.palette].colors;
  for (let i = 0; i < 5; i++) {
    gl.uniform3f(dispUni['u_pal'+i], pal[i][0]/255, pal[i][1]/255, pal[i][2]/255);
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(dispAttr);
  gl.vertexAttribPointer(dispAttr, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ==========================================
// Audio
// ==========================================

let audioCtx, analyser, audioData, micStream;
const spectrumCanvas = document.getElementById('spectrum');
const specCtx = spectrumCanvas.getContext('2d');

async function toggleAudio() {
  if (state.audioActive) {
    state.audioActive = false;
    spectrumCanvas.classList.remove('active');
    document.querySelector('#stat-audio .val').textContent = 'off';
    document.getElementById('stat-audio').style.display = 'none';
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    return;
  }

  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    state.audioActive = true;
    spectrumCanvas.classList.add('active');
    document.getElementById('stat-audio').style.display = '';
    document.querySelector('#stat-audio .val').textContent = 'on';
  } catch(e) {
    console.warn('Mic not available:', e);
  }
}

function updateAudio() {
  if (!state.audioActive || !analyser) return;
  analyser.getByteFrequencyData(audioData);
  const bins = audioData.length;
  const third = Math.floor(bins / 3);
  let bass = 0, mid = 0, treble = 0;
  for (let i = 0; i < third; i++) bass += audioData[i];
  for (let i = third; i < third*2; i++) mid += audioData[i];
  for (let i = third*2; i < bins; i++) treble += audioData[i];
  state.audioBass = bass / (third * 255);
  state.audioMid = mid / (third * 255);
  state.audioTreble = treble / ((bins - third*2) * 255);

  // Draw spectrum
  spectrumCanvas.width = window.innerWidth;
  spectrumCanvas.height = 40;
  specCtx.clearRect(0, 0, spectrumCanvas.width, 40);
  const barW = spectrumCanvas.width / bins;
  for (let i = 0; i < bins; i++) {
    const h = (audioData[i] / 255) * 36;
    const hue = 260 - (i / bins) * 100;
    specCtx.fillStyle = `hsla(${hue}, 70%, 60%, 0.7)`;
    specCtx.fillRect(i * barW, 40 - h, barW - 1, h);
  }
}

// ==========================================
// Resize
// ==========================================

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// Mouse / Touch
// ==========================================

function canvasToSim(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width,
    y: 1.0 - (clientY - rect.top) / rect.height
  };
}

const brushCursor = document.getElementById('brush-cursor');

function updateBrushCursor(clientX, clientY) {
  const r = state.radius * (canvas.width / SIM_W);
  const d = r * 2;
  brushCursor.style.width = d + 'px';
  brushCursor.style.height = d + 'px';
  brushCursor.style.left = (clientX - r) + 'px';
  brushCursor.style.top = (clientY - r) + 'px';
  brushCursor.style.borderColor = state.brush === 'seed'
    ? 'rgba(124,111,224,0.5)' : 'rgba(74,222,128,0.5)';
}

canvas.addEventListener('mousedown', e => {
  state.mouseDown = true;
  const p = canvasToSim(e.clientX, e.clientY);
  state.mouseX = p.x;
  state.mouseY = p.y;
});
canvas.addEventListener('mousemove', e => {
  const p = canvasToSim(e.clientX, e.clientY);
  state.mouseX = p.x;
  state.mouseY = p.y;
  updateBrushCursor(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => { state.mouseDown = false; });
canvas.addEventListener('mouseleave', () => { state.mouseDown = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.radius = Math.max(2, Math.min(60, state.radius - Math.sign(e.deltaY) * 2));
  document.getElementById('radius').value = state.radius;
  document.getElementById('radius-val').textContent = state.radius;
  updateBrushCursor(e.clientX, e.clientY);
}, { passive: false });

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  state.mouseDown = true;
  const t = e.touches[0];
  const p = canvasToSim(t.clientX, t.clientY);
  state.mouseX = p.x;
  state.mouseY = p.y;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const p = canvasToSim(t.clientX, t.clientY);
  state.mouseX = p.x;
  state.mouseY = p.y;
}, { passive: false });
canvas.addEventListener('touchend', () => { state.mouseDown = false; });

// ==========================================
// Keyboard
// ==========================================

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch(e.key.toLowerCase()) {
    case ' ':
      e.preventDefault();
      state.paused = !state.paused;
      break;
    case 'h':
      state.panelVisible = !state.panelVisible;
      document.getElementById('panel').classList.toggle('hidden', !state.panelVisible);
      break;
    case 'c':
      clearState();
      break;
    case 'r':
      scatterSeeds();
      break;
    case 's':
      exportPNG();
      break;
    case 'm':
      toggleAudio();
      break;
    case 'b':
      state.brush = state.brush === 'seed' ? 'clear' : 'seed';
      updateBrushButtons();
      break;
    case '1': case '2': case '3': case '4':
    case '5': case '6': case '7': case '8':
      applyPreset(parseInt(e.key) - 1);
      break;
  }
});

// ==========================================
// UI Setup
// ==========================================

// Presets
const presetGrid = document.getElementById('presets');
PRESETS.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'preset-btn';
  btn.textContent = p.name;
  btn.dataset.index = i;
  btn.addEventListener('click', () => applyPreset(i));
  presetGrid.appendChild(btn);
});

function applyPreset(idx) {
  if (idx < 0 || idx >= PRESETS.length) return;
  const p = PRESETS[idx];
  state.feed = p.f;
  state.kill = p.k;
  document.getElementById('feed').value = p.f;
  document.getElementById('kill').value = p.k;
  document.getElementById('feed-val').textContent = p.f.toFixed(4);
  document.getElementById('kill-val').textContent = p.k.toFixed(4);
  // Highlight active preset
  presetGrid.querySelectorAll('.preset-btn').forEach((b, j) => {
    b.classList.toggle('active', j === idx);
  });
}

// Palettes
const paletteRow = document.getElementById('palettes');
PALETTES.forEach((p, i) => {
  const sw = document.createElement('div');
  sw.className = 'palette-swatch' + (i === 0 ? ' active' : '');
  // Gradient from 3 main colors
  sw.style.background = `linear-gradient(90deg, rgb(${p.colors[1]}), rgb(${p.colors[2]}), rgb(${p.colors[3]}))`;
  sw.title = p.name;
  sw.addEventListener('click', () => {
    state.palette = i;
    paletteRow.querySelectorAll('.palette-swatch').forEach((s, j) => {
      s.classList.toggle('active', j === i);
    });
  });
  paletteRow.appendChild(sw);
});

// Brush buttons
function updateBrushButtons() {
  document.querySelectorAll('.brush-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.brush === state.brush);
  });
}
document.querySelectorAll('.brush-btn').forEach(b => {
  b.addEventListener('click', () => {
    state.brush = b.dataset.brush;
    updateBrushButtons();
  });
});

// Sliders
function bindSlider(id, prop, fmt) {
  const slider = document.getElementById(id);
  const valEl = document.getElementById(id + '-val');
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    state[prop] = v;
    valEl.textContent = fmt ? fmt(v) : v;
    // Clear preset highlight when manually adjusting feed/kill
    if (prop === 'feed' || prop === 'kill') {
      presetGrid.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }
  });
}
bindSlider('feed', 'feed', v => v.toFixed(4));
bindSlider('kill', 'kill', v => v.toFixed(4));
bindSlider('du', 'du', v => v.toFixed(3));
bindSlider('dv', 'dv', v => v.toFixed(3));
bindSlider('speed', 'speed', v => v.toString());
bindSlider('radius', 'radius', v => v.toString());
bindSlider('audio-mix', 'audioMix', v => v.toFixed(2));

// Action buttons
document.getElementById('btn-clear').addEventListener('click', clearState);
document.getElementById('btn-randomize').addEventListener('click', scatterSeeds);
document.getElementById('btn-export').addEventListener('click', exportPNG);

function exportPNG() {
  display(); // Ensure latest frame
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `petri-${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

// ==========================================
// Main loop
// ==========================================

let lastTime = 0;
let frameCount = 0;
let fpsTimer = 0;

function loop(now) {
  requestAnimationFrame(loop);

  const dt = now - lastTime;
  lastTime = now;
  frameCount++;
  fpsTimer += dt;
  if (fpsTimer > 500) {
    document.querySelector('#stat-fps .val').textContent = Math.round(frameCount / (fpsTimer / 1000));
    frameCount = 0;
    fpsTimer = 0;
  }

  updateAudio();

  if (!state.paused) {
    for (let i = 0; i < state.speed; i++) {
      simStep();
    }
  }

  display();

  // Update gen counter
  document.querySelector('#stat-gen .val').textContent = state.generation.toLocaleString();
}

// ==========================================
// Start
// ==========================================

initState();
requestAnimationFrame(loop);

</script>
</body>
</html>
