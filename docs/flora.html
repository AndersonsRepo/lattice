<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Flora</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
      --amber-glow: #fbbf2430;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* --- Canvas area --- */
    .canvas-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      background: var(--bg);
      border-radius: 4px;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar h1 {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--amber);
      text-shadow: 0 0 20px var(--amber-glow);
      margin-bottom: 0.25rem;
    }

    .sidebar .back-link {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .sidebar .back-link:hover { color: var(--accent); }

    .section-label {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    /* --- Presets --- */
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .preset-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.55rem;
      padding: 0.4rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }
    .preset-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 8px var(--amber-glow);
    }
    .preset-btn.active {
      border-color: var(--amber);
      color: var(--amber);
      background: #fbbf2410;
    }
    .preset-btn .preset-label { display: block; font-weight: 500; }
    .preset-btn .preset-sub { display: block; color: var(--text-dim); margin-top: 2px; font-size: 0.5rem; }

    /* --- Sliders / inputs --- */
    .param-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .param-row label {
      font-size: 0.55rem;
      color: var(--text-dim);
      min-width: 80px;
      flex-shrink: 0;
    }
    .param-row input[type="range"] {
      flex: 1;
      accent-color: var(--amber);
      height: 3px;
    }
    .param-row .val {
      font-size: 0.55rem;
      color: var(--amber);
      min-width: 32px;
      text-align: right;
    }

    .param-row input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.55rem;
      padding: 0.3rem 0.4rem;
      border-radius: 3px;
      outline: none;
    }
    .param-row input[type="text"]:focus {
      border-color: var(--amber);
    }

    /* --- Actions --- */
    .actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.55rem;
      padding: 0.35rem 0.6rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .action-btn.primary {
      border-color: var(--amber);
      color: var(--amber);
    }
    .action-btn.primary:hover {
      background: #fbbf2415;
      box-shadow: 0 0 10px var(--amber-glow);
    }

    /* --- Grammar display --- */
    .grammar-display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.4rem 0.5rem;
      font-size: 0.5rem;
      color: var(--text-dim);
      max-height: 60px;
      overflow-y: auto;
      word-break: break-all;
      line-height: 1.6;
    }
    .grammar-display .sym { color: var(--amber); }
    .grammar-display .arrow { color: var(--text-dim); }
    .grammar-display .prod { color: var(--green); }

    /* --- Stats bar --- */
    .stats-bar {
      font-size: 0.5rem;
      color: var(--text-dim);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .stats-bar .val { color: var(--green); }

    /* --- Color scheme picker --- */
    .color-schemes {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 28px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .color-swatch:hover, .color-swatch.active {
      border-color: var(--amber);
      transform: scale(1.15);
    }

    /* --- Keyboard hints --- */
    .hints {
      font-size: 0.45rem;
      color: var(--text-dim);
      line-height: 1.8;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .hints kbd {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 1px 4px;
      border-radius: 2px;
      color: var(--text);
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        min-width: 0;
        max-height: 45vh;
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>

<script>

// --- RNG (mulberry32, matches engine) ---
function mulberry32(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  { name: 'Bone',     stops: ['#0a0a0f', '#1e1e2e', '#4a4a5e', '#8e8ea0', '#c8c8d4', '#f0f0f4'] },

  { name: 'Forest',   stops: ['#050f05', '#0a2e0a', '#166534', '#15803d', '#4ade80', '#86efac'] },
  { name: 'Twilight', stops: ['#0f0520', '#2e1065', '#7c3aed', '#c084fc', '#f0abfc', '#fdf4ff'] },
  { name: 'Ocean',    stops: ['#001520', '#003050', '#0369a1', '#0ea5e9', '#7dd3fc', '#e0f2fe'] },

let currentScheme = 0;

function hexToRGB(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function buildLUT(scheme) {
  const stops = scheme.stops.map(hexToRGB);
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    const seg = t * (stops.length - 1);
    const idx = Math.min(Math.floor(seg), stops.length - 2);
    const frac = seg - idx;
    const a = stops[idx], b = stops[idx + 1];
    lut[i * 3]     = Math.round(a[0] + (b[0] - a[0]) * frac);
    lut[i * 3 + 1] = Math.round(a[1] + (b[1] - a[1]) * frac);
    lut[i * 3 + 2] = Math.round(a[2] + (b[2] - a[2]) * frac);
  }
  return lut;
}

// --- Presets ---
const PRESETS = [

    angle: 36, iterations: 5, jitter: 0, lengthScale: 1, tropism: 0, widthDecay: 1,

  },
  {

    axiom: 'X', rules: { X: 'F^[+X]^[-X]^[+X]F', F: 'F!F' },
    angle: 45, iterations: 5, jitter: 10, lengthScale: 0.78, tropism: 0.02, widthDecay: 0.85,
    leafSize: 0.2, petals: 0, pruning: 0.12, season: 0, stepWave: 0.15, scheme: 7

// --- State ---
let currentPreset = 0;
let animating = false;
let animFrame = null;
let animSeed = 1;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- L-System Engine (client-side, mirrors automata.ts) ---
function generateString(axiom, rules, iterations, seed) {
  const rng = mulberry32(seed);
  let current = axiom;
  for (let i = 0; i < iterations; i++) {
    let next = '';
    for (let ci = 0; ci < current.length; ci++) {
      const ch = current[ci];
      next += rules[ch] !== undefined ? rules[ch] : ch;
    }
    current = next;
    if (current.length > 50000) break;
  }
  return current;
}

function traceTurtle(str, params) {
  const {
    angle, seed, jitter, lengthScale, tropism, widthDecay,
    leafSize, petals, pruning, season, stepWave
  } = params;
  const rng = mulberry32(seed + 7777);
  const points = [];
  let tx = 0, ty = 0, tAngle = -90, tDepth = 0, tWidth = 1.0;
  const stack = [];
  let stepCount = 0;

  for (let ci = 0; ci < str.length; ci++) {
    const ch = str[ci];
    switch (ch) {
      case 'F': case 'G': {
        const waveM = stepWave > 0 ? 1 + stepWave * Math.sin(stepCount * 0.5) * 0.3 : 1;
        const df = Math.pow(lengthScale, tDepth) * waveM;
        const j = jitter > 0 ? (rng() - 0.5) * 2 * jitter : 0;
        const tb = tropism * tDepth * 2;
        const fa = tAngle + j + tb;
        const rad = fa * Math.PI / 180;
        const nx = tx + df * Math.cos(rad);
        const ny = ty + df * Math.sin(rad);
        points.push({ x: nx, y: ny, depth: tDepth, width: tWidth, type: 'line' });
        tx = nx; ty = ny;
        stepCount++;
        break;
      }
      case '~': {
        const df = Math.pow(lengthScale, tDepth);
        const wave = Math.sin(stepCount * 0.8) * 0.3;
        const j = jitter > 0 ? (rng() - 0.5) * 2 * jitter : 0;
        const tb = tropism * tDepth * 2;
        const fa = tAngle + j + wave * angle + tb;
        const rad = fa * Math.PI / 180;
        const nx = tx + df * Math.cos(rad);
        const ny = ty + df * Math.sin(rad);
        points.push({ x: nx, y: ny, depth: tDepth, width: tWidth, type: 'line' });
        tx = nx; ty = ny;
        stepCount++;
        break;
      }
      case '+': tAngle += angle; break;
      case '-': tAngle -= angle; break;
      case '|': tAngle += 180; break;
      case '!': tWidth *= widthDecay; break;
      case '@': {
        if (season > 0.8 && rng() < season) break;
        const bp = petals || 5;
        const np = season > 0.3 ? Math.max(2, Math.round(bp * (1 - season * 0.6))) : bp;
        const df = Math.pow(lengthScale, tDepth) * leafSize;
        for (let pi = 0; pi < np; pi++) {
          const pa = tAngle + (pi * 360) / np;
          const prad = pa * Math.PI / 180;
          const pl = df * (0.8 + rng() * 0.4);
          points.push({ x: tx + pl * Math.cos(prad), y: ty + pl * Math.sin(prad), depth: Math.max(0, tDepth - 1), width: tWidth * 1.3, type: 'flower' });
        }
        points.push({ x: tx, y: ty, depth: Math.max(0, tDepth - 1), width: tWidth * 1.5, type: 'flower' });
        break;
      }
      case '{': case '}': break;
      case '&': {
        const gs = Math.abs(tropism) > 0 ? tropism * 15 : 5;
        tAngle += gs;
        break;
      }
      case '[': {
        if (pruning > 0 && rng() < pruning) {
          let bd = 1;
          while (++ci < str.length && bd > 0) {
            if (str[ci] === '[') bd++;
            else if (str[ci] === ']') bd--;
          }
          ci--;
          break;
        }
        stack.push({ x: tx, y: ty, angle: tAngle, depth: tDepth, width: tWidth });
        tDepth++;
        tWidth *= widthDecay;
        break;
      }
      case ']': {
        const state = stack.pop();
        if (state) ({ x: tx, y: ty, angle: tAngle, depth: tDepth, width: tWidth } = state);
        break;
      }
      case '%': {
        let bd = 0;
        while (++ci < str.length) {
          if (str[ci] === '[') bd++;
          else if (str[ci] === ']') {
            if (bd === 0) { ci--; break; }
            bd--;
          }
        }
        break;
      }
      case '^': {
        tAngle += (rng() - 0.5) * 10 * Math.pow(0.9, tDepth);
        break;
      }
    }
  }
  return points;
}

function render(points, lut) {
  const dpr = window.devicePixelRatio || 1;
  const area = document.querySelector('.canvas-area');
  const cw = area.clientWidth;
  const ch = area.clientHeight;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Clear
  ctx.fillStyle = COLOR_SCHEMES[currentScheme].stops[0];
  ctx.fillRect(0, 0, cw, ch);

  if (points.length === 0) return;

  // Bounding box
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }

  const margin = 40;
  const drawW = cw - margin * 2;
  const drawH = ch - margin * 2;
  const bboxW = maxX - minX || 1;
  const bboxH = maxY - minY || 1;
  const scale = Math.min(drawW / bboxW, drawH / bboxH);
  const offsetX = margin + (drawW - bboxW * scale) / 2 - minX * scale;
  const offsetY = margin + (drawH - bboxH * scale) / 2 - minY * scale;

  // Find max depth
  let maxDepth = 0;
  for (const p of points) if (p.depth > maxDepth) maxDepth = p.depth;
  maxDepth = Math.max(maxDepth, 1);

  // Glow pass
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.12;
  ctx.shadowBlur = 15;
  for (const p of points) {
    const gx = p.x * scale + offsetX;
    const gy = p.y * scale + offsetY;
    const t = 1 - (p.depth / maxDepth);
    const ci = Math.min(255, Math.round(t * 220 + 35));
    const r = lut[ci * 3], g = lut[ci * 3 + 1], b = lut[ci * 3 + 2];
    const color = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    const radius = Math.max(0.5, (2.5 - p.depth * 0.3) * p.width) * Math.min(1.2, scale * 0.5);
    ctx.beginPath();
    ctx.arc(gx, gy, radius * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Main pass
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  for (const p of points) {
    const gx = p.x * scale + offsetX;
    const gy = p.y * scale + offsetY;
    const t = 1 - (p.depth / maxDepth);
    const ci = Math.min(255, Math.round(t * 220 + 35));
    const r = lut[ci * 3], g = lut[ci * 3 + 1], b = lut[ci * 3 + 2];
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    const radius = Math.max(0.3, (1.8 - p.depth * 0.2) * p.width) * Math.min(1, scale * 0.35);

    if (p.type === 'flower') {
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(gx, gy, radius * 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.beginPath();
      ctx.arc(gx, gy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Vignette
  const vg = ctx.createRadialGradient(cw / 2, ch / 2, cw * 0.3, cw / 2, ch / 2, cw * 0.75);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, COLOR_SCHEMES[currentScheme].stops[0] + 'cc');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, cw, ch);
}

// --- UI helpers ---
function $(id) { return document.getElementById(id); }

function getParams() {
  return {
    angle: +$('angle').value,
    seed: +$('seed').value,
    jitter: +$('jitter').value / 10,
    lengthScale: +$('lengthScale').value / 100,
    tropism: +$('tropism').value / 100,
    widthDecay: +$('widthDecay').value / 100,
    leafSize: +$('leafSize').value / 100,
    petals: +$('petals').value,
    pruning: +$('pruning').value / 100,
    season: +$('season').value / 100,
    stepWave: +$('stepWave').value / 100,
  };
}

function getRules() {
  const rules = {};
  document.querySelectorAll('.rule-input').forEach(row => {
    const sym = row.querySelector('.rule-sym').value.trim();
    const prod = row.querySelector('.rule-prod').value.trim();
    if (sym && prod) rules[sym] = prod;
  });
  return rules;
}

function esc(s) {
  const d = document.createElement('span');
  d.textContent = s;
  return d.innerHTML;
}

function updateDisplay() {
  $('angle-val').textContent = $('angle').value + '\u00B0';
  $('iterations-val').textContent = $('iterations').value;
  $('seed-val').textContent = $('seed').value;
  $('jitter-val').textContent = (+$('jitter').value / 10).toFixed(1) + '\u00B0';
  $('lengthScale-val').textContent = (+$('lengthScale').value / 100).toFixed(2);
  $('tropism-val').textContent = (+$('tropism').value / 100).toFixed(2);
  $('widthDecay-val').textContent = (+$('widthDecay').value / 100).toFixed(2);
  $('stepWave-val').textContent = (+$('stepWave').value / 100).toFixed(2);
  $('leafSize-val').textContent = (+$('leafSize').value / 100).toFixed(2);
  $('petals-val').textContent = $('petals').value;
  $('pruning-val').textContent = $('pruning').value + '%';
  const s = +$('season').value / 100;
  $('season-val').textContent = s < 0.2 ? 'spring' : s < 0.4 ? 'summer' : s < 0.7 ? 'autumn' : 'winter';
}

function updateGrammarDisplay() {
  const rules = getRules();
  const axiom = $('axiom').value;
  let html = '<span class="sym">axiom</span> <span class="arrow">\u2192</span> <span class="prod">' + esc(axiom) + '</span>';
  for (const [sym, prod] of Object.entries(rules)) {
    html += '<br><span class="sym">' + esc(sym) + '</span> <span class="arrow">\u2192</span> <span class="prod">' + esc(prod) + '</span>';
  }
  $('grammar-display').innerHTML = html;
}

let renderTimeout = null;
function scheduleRender() {
  if (renderTimeout) clearTimeout(renderTimeout);
  renderTimeout = setTimeout(doRender, 80);
}

function doRender() {
  const axiom = $('axiom').value;
  const rules = getRules();
  const params = getParams();
  const iterations = +$('iterations').value;

  const t0 = performance.now();
  const str = generateString(axiom, rules, iterations, params.seed);
  const points = traceTurtle(str, params);
  const lut = buildLUT(COLOR_SCHEMES[currentScheme]);
  render(points, lut);
  const elapsed = (performance.now() - t0).toFixed(1);

  $('stats').innerHTML =
    'String: <span class="val">' + str.length.toLocaleString() + '</span> chars &nbsp; ' +
    'Points: <span class="val">' + points.length.toLocaleString() + '</span> &nbsp; ' +
    'Render: <span class="val">' + elapsed + 'ms</span>';

  updateDisplay();
  updateGrammarDisplay();
}

// --- Rule inputs ---
function buildRuleInputs(rules) {
  $('rule-inputs').innerHTML = '';
  for (const [sym, prod] of Object.entries(rules)) {
    addRuleRow(sym, prod);
  }
}

function addRuleRow(sym, prod) {
  sym = sym || '';
  prod = prod || '';
  const row = document.createElement('div');
  row.className = 'param-row rule-input';
  const symIn = document.createElement('input');
  symIn.type = 'text';
  symIn.className = 'rule-sym';
  symIn.value = sym;
  symIn.style.cssText = 'max-width:30px;text-align:center';
  symIn.placeholder = 'F';
  const arrow = document.createElement('span');
  arrow.style.cssText = 'color:var(--text-dim);font-size:0.55rem';
  arrow.textContent = '\u2192';
  const prodIn = document.createElement('input');
  prodIn.type = 'text';
  prodIn.className = 'rule-prod';
  prodIn.value = prod;
  prodIn.placeholder = 'FF+[+F]-F';
  row.appendChild(symIn);
  row.appendChild(arrow);
  row.appendChild(prodIn);
  symIn.addEventListener('input', scheduleRender);
  prodIn.addEventListener('input', scheduleRender);
  $('rule-inputs').appendChild(row);
}

function addRule() { addRuleRow(); }
function removeRule() {
  const rows = document.querySelectorAll('.rule-input');
  if (rows.length > 1) rows[rows.length - 1].remove();
  scheduleRender();
}

// --- Preset loading ---
function loadPreset(idx) {
  currentPreset = idx;
  const p = PRESETS[idx];
  $('axiom').value = p.axiom;
  $('angle').value = p.angle;
  $('iterations').value = p.iterations;
  $('seed').value = 42;
  $('jitter').value = Math.round(p.jitter * 10);
  $('lengthScale').value = Math.round(p.lengthScale * 100);
  $('tropism').value = Math.round(p.tropism * 100);
  $('widthDecay').value = Math.round(p.widthDecay * 100);
  $('stepWave').value = Math.round(p.stepWave * 100);
  $('leafSize').value = Math.round(p.leafSize * 100);
  $('petals').value = p.petals;
  $('pruning').value = Math.round(p.pruning * 100);
  $('season').value = Math.round(p.season * 100);
  currentScheme = p.scheme;
  buildRuleInputs(p.rules);
  updateColorSwatches();
  updatePresetButtons();
  doRender();
}

function updatePresetButtons() {
  document.querySelectorAll('.preset-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', i === currentPreset);
  });
}

// --- Color swatches ---
function buildColorSwatches() {
  var container = $('color-schemes');
  container.innerHTML = '';
  COLOR_SCHEMES.forEach(function(scheme, i) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === currentScheme ? ' active' : '');
    sw.title = scheme.name;
    sw.style.background = 'linear-gradient(90deg, ' + scheme.stops.slice(1).join(', ') + ')';
    sw.onclick = function() {
      currentScheme = i;
      updateColorSwatches();
      doRender();
    };
    container.appendChild(sw);
  });
}

function updateColorSwatches() {
  document.querySelectorAll('.color-swatch').forEach(function(sw, i) {
    sw.classList.toggle('active', i === currentScheme);
  });
}

// --- Build preset buttons ---
function buildPresets() {
  var container = $('presets');
  PRESETS.forEach(function(p, i) {
    var btn = document.createElement('button');
    btn.className = 'preset-btn';
    var label = document.createElement('span');
    label.className = 'preset-label';
    label.textContent = p.name;
    var sub = document.createElement('span');
    sub.className = 'preset-sub';
    sub.textContent = p.sub;
    btn.appendChild(label);
    btn.appendChild(sub);
    btn.onclick = function() { loadPreset(i); };
    container.appendChild(btn);
  });
}

// --- Actions ---
function randomize() {
  var rng = mulberry32(Date.now());
  var presetIdx = Math.floor(rng() * PRESETS.length);
  loadPreset(presetIdx);
  $('seed').value = Math.floor(rng() * 9999) + 1;
  $('jitter').value = Math.min(150, Math.max(0, +$('jitter').value + Math.floor((rng() - 0.5) * 40)));
  $('tropism').value = Math.min(30, Math.max(-30, +$('tropism').value + Math.floor((rng() - 0.5) * 20)));
  currentScheme = Math.floor(rng() * COLOR_SCHEMES.length);
  updateColorSwatches();
  doRender();
}

function exportPNG() {
  var link = document.createElement('a');
  link.download = 'flora-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function toggleAnimate() {
  animating = !animating;
  if (animating) {
    animSeed = +$('seed').value;
    animateLoop();
  } else if (animFrame) {
    cancelAnimationFrame(animFrame);
    animFrame = null;
  }
}

function animateLoop() {
  if (!animating) return;
  animSeed++;
  $('seed').value = animSeed;
  doRender();
  animFrame = requestAnimationFrame(animateLoop);
}

// --- Keyboard ---
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ': e.preventDefault(); randomize(); break;
    case 'ArrowLeft': loadPreset((currentPreset - 1 + PRESETS.length) % PRESETS.length); break;
    case 'ArrowRight': loadPreset((currentPreset + 1) % PRESETS.length); break;
    case 's': case 'S': exportPNG(); break;
    case 'a': case 'A': toggleAnimate(); break;
    case 'r': case 'R': doRender(); break;
  }
});

// --- Slider events ---
document.querySelectorAll('.sidebar input[type="range"]').forEach(function(slider) {
  slider.addEventListener('input', scheduleRender);
});
$('axiom').addEventListener('input', scheduleRender);

// --- Resize ---
window.addEventListener('resize', doRender);

// --- Init ---
buildPresets();
buildColorSwatches();
loadPreset(0);
</script>
</body>
</html>
