<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Genome Lab</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-bar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .top-bar a:hover { color: var(--accent); }

    .top-bar h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .mode-toggle {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
    }
    .mode-btn {
      padding: 0.35rem 0.8rem;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* === Catalog View === */
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .specimen {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .specimen:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .specimen.selected {
      border-color: var(--green);
      box-shadow: 0 0 20px #4ade8030;
    }

    .specimen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .type-badge {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      border: 1px solid;
    }

    .score-display {
      font-size: 0.8rem;
      color: var(--green);
      font-weight: 600;
    }

    /* DNA Barcode */
    .barcode-row {
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .barcode-label {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      width: 50px;
      flex-shrink: 0;
    }
    .barcode {
      flex: 1;
      height: 20px;
      display: flex;
      gap: 1px;
      border-radius: 2px;
      overflow: hidden;
    }
    .barcode-segment {
      flex: 1;
      min-width: 2px;
      transition: opacity 0.3s;
    }

    /* Metrics Radar */
    .radar-section {
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .radar-canvas {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }
    .metric-list {
      flex: 1;
      font-size: 0.65rem;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.15rem 0;
    }
    .metric-name {
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-bar-bg {
      width: 60px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 0.5rem;
      flex-shrink: 0;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .metric-val {
      color: var(--text);
      min-width: 30px;
      text-align: right;
    }

    /* Palette Strip */
    .palette-strip {
      display: flex;
      gap: 2px;
      padding: 0.5rem 1rem 0.75rem;
    }
    .palette-char {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.75rem;
    }

    /* Lineage chain */
    .lineage-row {
      padding: 0.4rem 1rem 0.75rem;
      font-size: 0.6rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .lineage-id {
      font-family: inherit;
      color: var(--accent);
      background: var(--bg);
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
      border: 1px solid var(--border);
    }
    .lineage-arrow { color: var(--text-dim); }

    /* === Compare View === */
    .compare-view { display: none; }
    .compare-prompt {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    .compare-prompt kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.7rem;
    }

    .compare-panels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      min-height: calc(100vh - 120px);
    }

    .compare-panel {
      padding: 1.5rem;
    }
    .compare-panel.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.75rem;
      border: 2px dashed var(--border);
      border-radius: 8px;
      margin: 1rem;
    }

    .compare-divider {
      width: 1px;
      background: var(--border);
      position: relative;
    }
    .compare-divider::after {
      content: '⟷';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--surface);
      color: var(--text-dim);
      padding: 0.5rem 0.25rem;
      font-size: 0.7rem;
    }

    .compare-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .compare-header h3 {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    .compare-slot-label {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .compare-barcode {
      margin: 1rem 0;
    }
    .compare-barcode .barcode { height: 32px; }

    .compare-radar-wrap {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .compare-radar {
      width: 180px;
      height: 180px;
    }

    .compare-metrics {
      margin: 1rem 0;
    }
    .compare-metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
    }
    .compare-metric-name {
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 1;
    }
    .compare-metric-bar {
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 0.75rem;
      overflow: hidden;
    }
    .compare-metric-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .compare-metric-val {
      min-width: 35px;
      text-align: right;
    }

    .compare-genome-detail {
      margin: 1rem 0;
      font-size: 0.65rem;
    }
    .genome-param {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
      border-bottom: 1px solid #1e1e2e20;
    }
    .genome-param-name { color: var(--text-dim); }
    .genome-param-val { color: var(--text); }

    .diff-highlight {
      background: #7c6fe015;
      border-left: 2px solid var(--accent);
      padding-left: 0.5rem;
      margin-left: -0.5rem;
    }

    /* Art preview */
    .art-preview {
      background: var(--bg);
      border-radius: 4px;
      padding: 0.5rem;
      margin: 0.75rem 0;
      font-size: 0.45rem;
      line-height: 1.1;
      white-space: pre;
      overflow: hidden;
      max-height: 120px;
      position: relative;
    }
    .art-preview::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: linear-gradient(transparent, var(--bg));
    }

    .compare-art-preview {
      background: var(--bg);
      border-radius: 4px;
      padding: 0.75rem;
      margin: 1rem 0;
      font-size: 0.5rem;
      line-height: 1.15;
      white-space: pre;
      overflow: hidden;
      max-height: 200px;
      position: relative;
    }
    .compare-art-preview::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--bg));
    }

    /* Selection pills in compare mode */
    .compare-select-bar {
      display: none;
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      z-index: 200;
      font-size: 0.75rem;
      color: var(--text-dim);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .compare-select-bar .slot {
      padding: 0.3rem 0.6rem;
      border: 1px dashed var(--border);
      border-radius: 4px;
      min-width: 100px;
      text-align: center;
    }
    .compare-select-bar .slot.filled {
      border-style: solid;
      border-color: var(--accent);
      color: var(--accent);
    }
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover {
      border-color: #f87171;
      color: #f87171;
    }

    /* Type colors */
    .type-1d { color: #c8abff; border-color: #c8abff40; }
    .type-2d { color: #4ade80; border-color: #4ade8040; }
    .type-lsystem { color: #f5b84a; border-color: #f5b84a40; }
    .type-reaction-diffusion { color: #d44af5; border-color: #d44af540; }
    .type-voronoi { color: #4ad4f5; border-color: #4ad4f540; }
    .type-wfc { color: #f54a9d; border-color: #f54a9d40; }
    .type-spirograph { color: #ff6b35; border-color: #ff6b3540; }
    .type-strange-attractor { color: #fbbf24; border-color: #fbbf2440; }
    .type-julia { color: #818cf8; border-color: #818cf840; }
    .type-fractal-noise { color: #94a3b8; border-color: #94a3b840; }
    .type-flow-field { color: #2dd4bf; border-color: #2dd4bf40; }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-dim);
      font-size: 0.7rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
    footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--accent); }

    @media (max-width: 768px) {
      .catalog {
        grid-template-columns: 1fr;
      }
      .compare-panels {
        grid-template-columns: 1fr;
      }
      .compare-divider {
        width: auto;
        height: 1px;
      }
      .compare-divider::after {
        content: '⟷';
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html">&larr; Gallery</a>
    <h1>Genome Lab</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="catalog">Catalog</button>
      <button class="mode-btn" data-mode="compare">Compare</button>
    </div>
  </div>

  <div class="container catalog-view">
    <div class="catalog" id="catalog"></div>
  </div>

  <div class="container compare-view" id="compare-view">
    <div class="compare-panels" id="compare-panels">
      <div class="compare-panel empty" id="slot-a">Click a piece in Catalog to select slot A</div>
      <div class="compare-divider"></div>
      <div class="compare-panel empty" id="slot-b">Then select slot B</div>
    </div>
  </div>

  <div class="compare-select-bar" id="select-bar" style="display:none;">
    <span>Comparing:</span>
    <div class="slot" id="bar-slot-a">A: —</div>
    <div class="slot" id="bar-slot-b">B: —</div>
    <button class="clear-btn" id="clear-compare">Clear</button>
  </div>

  <footer>
    <a href="index.html">&larr; Gallery</a>
    &nbsp;&bull;&nbsp;
    <a href="about.html">About</a>
    &nbsp;&bull;&nbsp;
    <a href="atlas.html">Atlas</a>
    &nbsp;&bull;&nbsp;
    <a href="pulse.html">Pulse</a>
  </footer>

<script>
const TYPE_COLORS = {
  '1d': '#c8abff',
  '2d': '#4ade80',
  'lsystem': '#f5b84a',
  'reaction-diffusion': '#d44af5',
  'voronoi': '#4ad4f5',
  'wfc': '#f54a9d',
  'spirograph': '#ff6b35',
  'strange-attractor': '#fbbf24',
  'julia': '#818cf8',
  'fractal-noise': '#94a3b8',
  'flow-field': '#2dd4bf'
};

const METRIC_NAMES = ['complexity','symmetry','density','edgeActivity','novelty','fractalDimension','informationDensity','structuralInterest'];
const METRIC_LABELS = {
  complexity: 'Complexity',
  symmetry: 'Symmetry',
  density: 'Density',
  edgeActivity: 'Edge Activity',
  novelty: 'Novelty',
  fractalDimension: 'Fractal Dim',
  informationDensity: 'Info Density',
  structuralInterest: 'Structure'
};

// Normalize metric to 0-1 for display
function normalizeMetric(name, val) {
  if (name === 'complexity') return Math.min(val / 4, 1);
  if (name === 'fractalDimension') return val / 2;
  return Math.min(val, 1);
}

let allPieces = [];
let mode = 'catalog';
let compareSlots = [null, null];

async function init() {
  const resp = await fetch('gallery.json');
  const data = await resp.json();

  // Combine HoF + current population, dedup by ID
  const seen = new Set();
  const combined = [];
  for (const p of [...(data.hallOfFame || []), ...(data.pieces || [])]) {
    if (!seen.has(p.id)) {
      seen.add(p.id);
      combined.push(p);
    }
  }
  // Sort by score descending
  combined.sort((a, b) => b.score - a.score);
  allPieces = combined;

  renderCatalog();
  setupModeToggle();
}

function renderCatalog() {
  const el = document.getElementById('catalog');
  el.innerHTML = '';

  for (const piece of allPieces) {
    const card = document.createElement('div');
    card.className = 'specimen';
    card.dataset.id = piece.id;
    card.innerHTML = buildSpecimenCard(piece);
    card.addEventListener('click', () => onSpecimenClick(piece));

    // Animate radar on intersection
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        const canvas = card.querySelector('.radar-canvas');
        if (canvas) drawRadar(canvas, piece.metrics);
        observer.disconnect();
      }
    }, { threshold: 0.3 });
    observer.observe(card);

    el.appendChild(card);
  }
}

function buildSpecimenCard(piece) {
  const g = piece.genome;
  const t = g.type;
  const typeClass = 'type-' + t.replace(/\s+/g, '-');
  const color = TYPE_COLORS[t] || '#7c6fe0';

  return `
    <div class="specimen-header">
      <span class="type-badge ${typeClass}">${t}</span>
      <span class="score-display">${(piece.score * 100).toFixed(1)}%</span>
    </div>
    ${piece.rendered ? `<div class="art-preview">${escapeHtml(piece.rendered)}</div>` : ''}
    <div class="barcode-row">
      <span class="barcode-label">Gene</span>
      <div class="barcode">${buildBarcode(piece, color)}</div>
    </div>
    <div class="radar-section">
      <canvas class="radar-canvas" width="100" height="100"></canvas>
      <div class="metric-list">
        ${METRIC_NAMES.slice(0, 5).map(m => {
          const val = piece.metrics[m] || 0;
          const norm = normalizeMetric(m, val);
          return `<div class="metric-row">
            <span class="metric-name">${METRIC_LABELS[m]}</span>
            <div class="metric-bar-bg"><div class="metric-bar-fill" style="width:${norm*100}%;background:${color}"></div></div>
            <span class="metric-val">${(norm*100).toFixed(0)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="palette-strip">
      ${(g.palette || []).map(ch => `<div class="palette-char">${escapeHtml(ch === ' ' ? '␣' : ch)}</div>`).join('')}
    </div>
    <div class="lineage-row">
      <span>Lineage:</span>
      ${(g.lineage || []).slice(0, 5).map(id =>
        id === '×' ? '<span class="lineage-arrow">×</span>' :
        `<span class="lineage-id">${id.slice(0,6)}</span><span class="lineage-arrow">→</span>`
      ).join('')}
      <span style="color:var(--accent)">self</span>
      &nbsp;·&nbsp; ${g.mutations || 0} mutations
    </div>
  `;
}

function buildBarcode(piece, color) {
  // Encode genome parameters as barcode segments
  const g = piece.genome;
  const segments = [];

  // Seed → several segments
  const seedHex = (g.seed >>> 0).toString(16).padStart(8, '0');
  for (let i = 0; i < 8; i++) {
    const v = parseInt(seedHex[i], 16) / 15;
    segments.push(v);
  }

  // Rule parameters → segments
  const rule = g.rule || {};
  if (rule.weights) {
    for (const w of rule.weights) segments.push(Math.min(w / 1.5, 1));
  }
  if (rule.Du !== undefined) {
    segments.push(rule.Du, rule.Dv * 5, rule.feed * 20, rule.kill * 15);
  }
  if (rule.birth) {
    for (let i = 0; i < 9; i++) segments.push(rule.birth.includes(i) ? 1 : 0);
  }
  if (rule.survive) {
    for (let i = 0; i < 9; i++) segments.push(rule.survive.includes(i) ? 1 : 0);
  }
  if (rule.seeds !== undefined) segments.push(rule.seeds / 20);
  if (rule.jitter !== undefined) segments.push(rule.jitter);
  if (rule.tileCount !== undefined) segments.push(rule.tileCount / 10);

  // Width/height
  segments.push(g.width / 60, g.height / 40);

  // Metrics as segments
  for (const m of METRIC_NAMES) {
    segments.push(normalizeMetric(m, piece.metrics[m] || 0));
  }

  // Parse color from base
  const r = parseInt(color.slice(1,3), 16);
  const gc = parseInt(color.slice(3,5), 16);
  const b = parseInt(color.slice(5,7), 16);

  return segments.map(v => {
    const clamped = Math.max(0, Math.min(1, v));
    const alpha = 0.15 + clamped * 0.85;
    return `<div class="barcode-segment" style="background:rgba(${r},${gc},${b},${alpha.toFixed(2)})"></div>`;
  }).join('');
}

function drawRadar(canvas, metrics, color) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) / 2 - 8;

  ctx.clearRect(0, 0, w, h);

  const names = METRIC_NAMES;
  const n = names.length;
  const angleStep = (Math.PI * 2) / n;

  // Grid rings
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    const rr = (ring / 4) * r;
    for (let i = 0; i <= n; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#1e1e2e';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Axis lines
  for (let i = 0; i < n; i++) {
    const angle = i * angleStep - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = '#1e1e2e';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Data polygon
  const typeColor = color || '#7c6fe0';
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const val = normalizeMetric(names[idx], metrics[names[idx]] || 0);
    const angle = idx * angleStep - Math.PI / 2;
    const x = cx + val * r * Math.cos(angle);
    const y = cy + val * r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.fillStyle = typeColor + '25';
  ctx.fill();
  ctx.strokeStyle = typeColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Data points
  for (let i = 0; i < n; i++) {
    const val = normalizeMetric(names[i], metrics[names[i]] || 0);
    const angle = i * angleStep - Math.PI / 2;
    const x = cx + val * r * Math.cos(angle);
    const y = cy + val * r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fillStyle = typeColor;
    ctx.fill();
  }
}

function onSpecimenClick(piece) {
  if (mode === 'compare') {
    if (!compareSlots[0]) {
      compareSlots[0] = piece;
    } else if (!compareSlots[1] && piece.id !== compareSlots[0].id) {
      compareSlots[1] = piece;
    } else {
      // Replace slot A, shift B out
      compareSlots[0] = compareSlots[1];
      compareSlots[1] = piece;
    }
    updateCompare();
    updateSelectBar();
  }
}

function setupModeToggle() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;

      document.querySelector('.catalog-view').style.display = mode === 'catalog' ? '' : 'none';
      document.getElementById('compare-view').style.display = mode === 'compare' ? '' : 'none';
      document.getElementById('select-bar').style.display = mode === 'compare' ? 'flex' : 'none';

      if (mode === 'compare') {
        // Show catalog alongside for selection
        document.querySelector('.catalog-view').style.display = '';
      }
    });
  });

  document.getElementById('clear-compare').addEventListener('click', () => {
    compareSlots = [null, null];
    updateCompare();
    updateSelectBar();
  });
}

function updateSelectBar() {
  const barA = document.getElementById('bar-slot-a');
  const barB = document.getElementById('bar-slot-b');

  if (compareSlots[0]) {
    barA.textContent = `A: ${compareSlots[0].genome.type}`;
    barA.classList.add('filled');
  } else {
    barA.textContent = 'A: —';
    barA.classList.remove('filled');
  }

  if (compareSlots[1]) {
    barB.textContent = `B: ${compareSlots[1].genome.type}`;
    barB.classList.add('filled');
  } else {
    barB.textContent = 'B: —';
    barB.classList.remove('filled');
  }

  // Highlight selected specimens
  document.querySelectorAll('.specimen').forEach(el => {
    el.classList.remove('selected');
    if (compareSlots[0] && el.dataset.id === compareSlots[0].id) el.classList.add('selected');
    if (compareSlots[1] && el.dataset.id === compareSlots[1].id) el.classList.add('selected');
  });
}

function updateCompare() {
  const panels = document.getElementById('compare-panels');

  const buildPanel = (piece, label) => {
    if (!piece) return `<div class="compare-panel empty">Select a piece from the catalog</div>`;

    const g = piece.genome;
    const t = g.type;
    const color = TYPE_COLORS[t] || '#7c6fe0';
    const typeClass = 'type-' + t.replace(/\s+/g, '-');

    return `<div class="compare-panel" data-slot="${label}">
      <div class="compare-header">
        <div>
          <div class="compare-slot-label">Slot ${label}</div>
          <h3><span class="type-badge ${typeClass}">${t}</span> &nbsp;${piece.id}</h3>
        </div>
        <span class="score-display" style="font-size:1.2rem">${(piece.score * 100).toFixed(1)}%</span>
      </div>

      ${piece.rendered ? `<div class="compare-art-preview">${escapeHtml(piece.rendered)}</div>` : ''}

      <div class="compare-barcode">
        <div class="barcode" style="height:32px">${buildBarcode(piece, color)}</div>
      </div>

      <div class="compare-radar-wrap">
        <canvas class="compare-radar" width="180" height="180" data-piece-id="${piece.id}"></canvas>
      </div>

      <div class="compare-metrics">
        ${METRIC_NAMES.map(m => {
          const val = piece.metrics[m] || 0;
          const norm = normalizeMetric(m, val);
          const otherPiece = label === 'A' ? compareSlots[1] : compareSlots[0];
          const otherVal = otherPiece ? normalizeMetric(m, otherPiece.metrics[m] || 0) : null;
          const diff = otherVal !== null ? norm - otherVal : 0;
          const diffStr = otherVal !== null ? (diff > 0 ? `<span style="color:var(--green)">+${(diff*100).toFixed(0)}</span>` : diff < 0 ? `<span style="color:#f87171">${(diff*100).toFixed(0)}</span>` : '<span style="color:var(--text-dim)">0</span>') : '';

          return `<div class="compare-metric-row${Math.abs(diff) > 0.1 ? ' diff-highlight' : ''}">
            <span class="compare-metric-name">${METRIC_LABELS[m]}</span>
            <div class="compare-metric-bar"><div class="compare-metric-fill" style="width:${norm*100}%;background:${color}"></div></div>
            <span class="compare-metric-val">${(norm*100).toFixed(0)}%</span>
            <span style="min-width:35px;text-align:right;font-size:0.6rem">${diffStr}</span>
          </div>`;
        }).join('')}
      </div>

      <div class="compare-genome-detail">
        <div style="color:var(--text-dim);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.08em;font-size:0.6rem">Genome Parameters</div>
        ${buildGenomeParams(piece)}
      </div>

      <div class="palette-strip" style="margin-top:0.75rem">
        ${(g.palette || []).map(ch => `<div class="palette-char">${escapeHtml(ch === ' ' ? '␣' : ch)}</div>`).join('')}
      </div>

      <div class="lineage-row" style="margin-top:0.5rem">
        Gen ${piece.generation} · ${g.mutations || 0} mutations · Seed ${(g.seed >>> 0).toString(16)}
      </div>
    </div>`;
  };

  panels.innerHTML = buildPanel(compareSlots[0], 'A') +
    '<div class="compare-divider"></div>' +
    buildPanel(compareSlots[1], 'B');

  // Draw radars after DOM update
  requestAnimationFrame(() => {
    panels.querySelectorAll('.compare-radar').forEach(canvas => {
      const id = canvas.dataset.pieceId;
      const piece = allPieces.find(p => p.id === id);
      if (piece) {
        const color = TYPE_COLORS[piece.genome.type] || '#7c6fe0';
        drawRadar(canvas, piece.metrics, color);
      }
    });
  });
}

function buildGenomeParams(piece) {
  const g = piece.genome;
  const rule = g.rule || {};
  const params = [];

  params.push(['Dimensions', `${g.width} × ${g.height}`]);
  params.push(['Seed', (g.seed >>> 0).toString(16)]);

  if (g.type === 'wfc') {
    params.push(['Tile Count', rule.tileCount]);
    params.push(['Symmetry', rule.symmetry || 'none']);
    if (rule.weights) params.push(['Weights', rule.weights.map(w => w.toFixed(2)).join(', ')]);
  } else if (g.type === 'reaction-diffusion') {
    params.push(['Du', rule.Du?.toFixed(4)]);
    params.push(['Dv', rule.Dv?.toFixed(4)]);
    params.push(['Feed', rule.feed?.toFixed(4)]);
    params.push(['Kill', rule.kill?.toFixed(4)]);
    params.push(['Steps', rule.steps]);
    params.push(['Quantize', rule.quantize]);
  } else if (g.type === '2d') {
    params.push(['Birth', (rule.birth || []).join(', ')]);
    params.push(['Survive', (rule.survive || []).join(', ')]);
    params.push(['States', rule.states]);
  } else if (g.type === 'voronoi') {
    params.push(['Mode', rule.mode]);
    params.push(['Seeds', rule.seeds]);
    params.push(['Jitter', rule.jitter?.toFixed(3)]);
    params.push(['Metric', rule.metric]);
  } else if (g.type === '1d') {
    if (rule.rule !== undefined) params.push(['Rule', rule.rule]);
    if (rule.states !== undefined) params.push(['States', rule.states]);
  } else {
    // Generic: dump all rule keys
    for (const [k, v] of Object.entries(rule)) {
      params.push([k, typeof v === 'number' ? v.toFixed(4) : String(v)]);
    }
  }

  return params.map(([name, val]) => {
    const otherPiece = compareSlots[0]?.id === piece.id ? compareSlots[1] : compareSlots[0];
    let isDiff = false;
    if (otherPiece && otherPiece.genome.type === piece.genome.type) {
      const otherRule = otherPiece.genome.rule || {};
      const otherG = otherPiece.genome;
      const nameLC = name.toLowerCase();
      if (nameLC === 'dimensions') isDiff = otherG.width !== g.width || otherG.height !== g.height;
      else if (nameLC === 'seed') isDiff = true; // Seeds always differ
      else {
        const otherVal = otherRule[name.toLowerCase()] ?? otherRule[name];
        if (otherVal !== undefined) isDiff = String(otherVal) !== String(g.rule?.[name.toLowerCase()] ?? g.rule?.[name]);
      }
    }
    return `<div class="genome-param${isDiff ? ' diff-highlight' : ''}">
      <span class="genome-param-name">${name}</span>
      <span class="genome-param-val">${val ?? '—'}</span>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
