<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Resonance</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #6e6e82;
      --accent: #7c6fe0;
      --accent-glow: #7c6fe040;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      top: 50%; left: 50%;
      width: 700px; height: 700px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.25;
      pointer-events: none;
      transition: opacity 2s ease, background 3s ease;
      z-index: 0;
    }

    /* Start overlay */
    .start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    .start-overlay.hidden { opacity: 0; pointer-events: none; }
    .start-icon {
      font-size: 3rem;
      color: var(--accent);
      margin-bottom: 1.2rem;
      text-shadow: 0 0 40px var(--accent-glow);
      animation: breathe 3s ease-in-out infinite;
    }
    .start-text {
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      animation: breathe 3s ease-in-out infinite;
    }
    .start-sub {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 0.8rem;
      opacity: 0.5;
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .back-link {
      position: fixed;
      top: 1.2rem;
      left: 1.2rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      z-index: 10;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      padding: 1rem 1.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 0.6rem;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent-glow);
    }
    .header .sub {
      color: var(--text-dim);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }

    .algo-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .algo-tab {
      padding: 0.3rem 0.8rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .algo-tab:hover { border-color: var(--text-dim); color: var(--text); }
    .algo-tab.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .canvas-area {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 0.8rem;
      min-height: 0;
    }

    .sim-canvas {
      flex: 2;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      image-rendering: pixelated;
    }

    .wave-canvas {
      flex: 1;
      max-width: 200px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .info-strip {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .info-item {
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .info-item span { color: var(--text); font-variant-numeric: tabular-nums; }
    .info-item .highlight { color: var(--green); }
    .info-item .accent-val { color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 1rem;
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      margin-top: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.2rem;
      font-size: 0.9rem;
      transition: color 0.2s, transform 0.15s;
      font-family: inherit;
      line-height: 1;
    }
    .ctrl-btn:hover { color: var(--text); transform: scale(1.1); }
    .ctrl-btn.play-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--accent);
    }
    .ctrl-btn.play-btn:hover { background: var(--accent); color: #fff; }

    .volume-slider, .speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb, .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .ctrl-label {
      font-size: 0.5rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      user-select: none;
    }

    .speed-display {
      font-size: 0.55rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      min-width: 2.5ch;
      text-align: center;
    }

    .param-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.3rem;
    }
    .param-chip {
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      background: none;
      font-family: inherit;
    }
    .param-chip:hover { border-color: var(--text-dim); color: var(--text); }
    .param-chip.active { border-color: var(--green); color: var(--green); }
    .param-chip.scale-chip.active { border-color: var(--amber); color: var(--amber); }

    .scale-indicator {
      position: fixed;
      bottom: 1rem;
      right: 1.2rem;
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      opacity: 0.5;
      z-index: 10;
    }

    .key-hint {
      position: fixed;
      bottom: 1rem;
      left: 1.2rem;
      font-size: 0.45rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      opacity: 0.35;
      z-index: 10;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="bg-glow" id="bgGlow"></div>
  <a href="index.html" class="back-link">&larr; lattice</a>

  <div class="start-overlay" id="startOverlay">
    <div class="start-icon">&#8767;</div>
    <div class="start-text">click to begin</div>
    <div class="start-sub">hear algorithms think &mdash; cellular automata as rhythm, life as ambient swells, l-systems as melody</div>
  </div>

  <div class="main">
    <div class="header">
      <h1>Resonance</h1>
      <div class="sub">the sound of computation</div>
    </div>

    <div class="algo-tabs" id="algoTabs">
      <button class="algo-tab active" data-algo="automaton">1D Automaton</button>
      <button class="algo-tab" data-algo="life">Game of Life</button>
      <button class="algo-tab" data-algo="lsystem">L-System</button>
      <button class="algo-tab" data-algo="gallery">Gallery</button>
      <button class="algo-tab" data-algo="evolution">Evolution</button>
    </div>

    <div class="param-row" id="paramRow"></div>

    <div class="canvas-area">
      <canvas class="sim-canvas" id="simCanvas"></canvas>
      <canvas class="wave-canvas" id="waveCanvas"></canvas>
    </div>

    <div class="info-strip" id="infoStrip">
      <div class="info-item">step <span class="highlight" id="stepNum">0</span></div>
      <div class="info-item">cells <span id="cellCount">0</span></div>
      <div class="info-item">density <span id="density">0%</span></div>
      <div class="info-item">notes <span class="accent-val" id="noteCount">0</span></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause (Space)">&#9654;</button>
      <button class="ctrl-btn" id="resetBtn" title="Reset (R)">&#8635;</button>
      <span class="ctrl-label">vol</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
      <span class="ctrl-label">bpm</span>
      <input type="range" class="speed-slider" id="speedSlider" min="40" max="300" step="10" value="120">
      <span class="speed-display" id="speedDisplay">120</span>
    </div>
  </div>

  <div class="scale-indicator" id="scaleIndicator">C pentatonic</div>
  <div class="key-hint">space play &middot; r reset &middot; 1-3 algo &middot; &uarr;&darr; bpm</div>

  <script>
    // ── Audio Engine ──
    let audioCtx = null;
    let masterGain = null;
    let compressor = null;
    let convolver = null;
    let reverbGain = null;
    let analyser = null;
    let analyserData = null;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -20;
      compressor.knee.value = 10;
      compressor.ratio.value = 6;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(document.getElementById('volumeSlider').value) * 0.25;

      reverbGain = audioCtx.createGain();
      reverbGain.gain.value = 0.3;
      convolver = audioCtx.createConvolver();
      convolver.buffer = createReverbIR(2.5);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyserData = new Uint8Array(analyser.frequencyBinCount);

      compressor.connect(masterGain);
      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);
      compressor.connect(reverbGain);
      reverbGain.connect(convolver);
      convolver.connect(masterGain);
    }

    function createReverbIR(duration) {
      const len = audioCtx.sampleRate * duration;
      const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-4 * i / len);
        }
      }
      return buf;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // ── Musical Scales ──
    const SCALES = {
      pentatonic:   { name: 'C pentatonic',   intervals: [0, 2, 4, 7, 9],          root: 48 },
      minor:        { name: 'A minor',         intervals: [0, 2, 3, 5, 7, 8, 10],   root: 45 },
      dorian:       { name: 'D dorian',        intervals: [0, 2, 3, 5, 7, 9, 10],   root: 50 },
      phrygian:     { name: 'E phrygian',      intervals: [0, 1, 3, 5, 7, 8, 10],   root: 52 },
      wholeTone:    { name: 'whole tone',      intervals: [0, 2, 4, 6, 8, 10],      root: 48 },
    };

    let currentScale = SCALES.pentatonic;

    function scaleNote(index) {
      const s = currentScale;
      const len = s.intervals.length;
      const octave = Math.floor(index / len);
      const degree = ((index % len) + len) % len;
      return midiToFreq(s.root + octave * 12 + s.intervals[degree]);
    }

    function playNote(freq, duration, volume, wave, pan) {
      if (!audioCtx) return;
      volume = volume || 0.1;
      wave = wave || 'triangle';
      pan = pan || 0;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      osc.type = wave;
      osc.frequency.value = freq;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(volume, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

      const panner = audioCtx.createStereoPanner();
      panner.pan.value = Math.max(-1, Math.min(1, pan));

      osc.connect(gain);
      gain.connect(panner);
      panner.connect(compressor);
      osc.start(t);
      osc.stop(t + duration + 0.01);
    }

    // ── State ──
    let currentAlgo = 'automaton';
    let playing = false;
    let stepCount = 0;
    let bpm = 120;
    let tickTimer = null;

    // ── 1D Cellular Automaton ──
    const automaton = {
      rule: 110,
      width: 80,
      rows: [],
      maxRows: 60,

      PRESETS: [
        { rule: 110, name: 'Rule 110' },
        { rule: 30,  name: 'Rule 30' },
        { rule: 90,  name: 'Rule 90' },
        { rule: 184, name: 'Rule 184' },
        { rule: 54,  name: 'Rule 54' },
        { rule: 150, name: 'Rule 150' },
      ],

      init(ruleNum) {
        this.rule = ruleNum !== undefined ? ruleNum : this.rule;
        this.rows = [];
        const first = new Uint8Array(this.width);
        first[Math.floor(this.width / 2)] = 1;
        this.rows.push(first);
      },

      step() {
        const prev = this.rows[this.rows.length - 1];
        const next = new Uint8Array(this.width);
        for (let i = 0; i < this.width; i++) {
          const l = prev[(i - 1 + this.width) % this.width];
          const c = prev[i];
          const r = prev[(i + 1) % this.width];
          const idx = (l << 2) | (c << 1) | r;
          next[i] = (this.rule >> idx) & 1;
        }
        this.rows.push(next);
        if (this.rows.length > this.maxRows) this.rows.shift();
        return next;
      },

      sonify(row) {
        const alive = [];
        for (let i = 0; i < row.length; i++) {
          if (row[i]) alive.push(i);
        }
        const beatDur = 60 / bpm;
        const noteCount = Math.min(alive.length, 12);
        const step = alive.length > 12 ? Math.floor(alive.length / 12) : 1;
        for (let i = 0; i < noteCount; i++) {
          const cellIdx = alive[i * step];
          const noteIdx = Math.floor(cellIdx / this.width * 15);
          const pan = (cellIdx / this.width) * 2 - 1;
          const vol = 0.05 + (alive.length / this.width) * 0.06;
          playNote(scaleNote(noteIdx), beatDur * 0.8, Math.min(vol, 0.13), 'triangle', pan);
        }
        if (alive.length > this.width * 0.4) {
          playNote(scaleNote(-2), beatDur * 0.5, 0.04, 'sine', 0);
        }
        return alive.length;
      },

      render(ctx, w, h) {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, w, h);
        const cellW = w / this.width;
        const cellH = h / this.maxRows;
        const startRow = Math.max(0, this.rows.length - this.maxRows);
        for (let r = startRow; r < this.rows.length; r++) {
          const row = this.rows[r];
          const y = (r - startRow) * cellH;
          const isLatest = r === this.rows.length - 1;
          for (let c = 0; c < this.width; c++) {
            if (row[c]) {
              const brightness = isLatest ? 1.0 : 0.4 + 0.6 * ((r - startRow) / this.maxRows);
              const hue = (c / this.width) * 60 + 240;
              ctx.fillStyle = 'hsla(' + hue + ', 70%, ' + (40 + brightness * 30) + '%, ' + brightness + ')';
              ctx.fillRect(c * cellW, y, cellW - 0.5, cellH - 0.5);
            }
          }
          if (isLatest) {
            ctx.fillStyle = 'rgba(124, 111, 224, 0.08)';
            ctx.fillRect(0, y, w, cellH);
          }
        }
      }
    };

    // ── Game of Life ──
    const life = {
      width: 64,
      height: 48,
      grid: null,
      prevPop: 0,
      REGION_COLS: 8,
      REGION_ROWS: 6,

      PRESETS: [
        { name: 'Random 30%', density: 0.30 },
        { name: 'Random 15%', density: 0.15 },
        { name: 'Random 50%', density: 0.50 },
        { name: 'Sparse 5%',  density: 0.05 },
      ],

      init(density) {
        density = density || 0.30;
        this.grid = new Uint8Array(this.width * this.height);
        for (let i = 0; i < this.grid.length; i++) {
          this.grid[i] = Math.random() < density ? 1 : 0;
        }
        this.prevPop = 0;
      },

      step() {
        const w = this.width, h = this.height;
        const next = new Uint8Array(w * h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            let n = 0;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = (x + dx + w) % w, ny = (y + dy + h) % h;
                n += this.grid[ny * w + nx];
              }
            }
            const alive = this.grid[y * w + x];
            if (alive && (n === 2 || n === 3)) next[y * w + x] = 1;
            else if (!alive && n === 3) next[y * w + x] = 1;
          }
        }
        this.grid = next;
      },

      sonify() {
        if (!audioCtx) return 0;
        const w = this.width, h = this.height;
        const regionW = w / this.REGION_COLS;
        const regionH = h / this.REGION_ROWS;
        const beatDur = 60 / bpm;

        const regions = [];
        let totalAlive = 0;
        for (let ry = 0; ry < this.REGION_ROWS; ry++) {
          for (let rx = 0; rx < this.REGION_COLS; rx++) {
            let count = 0;
            const x0 = Math.floor(rx * regionW), y0 = Math.floor(ry * regionH);
            const x1 = Math.floor((rx + 1) * regionW), y1 = Math.floor((ry + 1) * regionH);
            for (let y = y0; y < y1; y++) {
              for (let x = x0; x < x1; x++) {
                count += this.grid[y * w + x];
              }
            }
            const area = (x1 - x0) * (y1 - y0);
            totalAlive += count;
            regions.push({ rx, ry, density: count / area });
          }
        }

        const activeRegions = regions.filter(function(r) { return r.density > 0.05; });
        activeRegions.sort(function(a, b) { return b.density - a.density; });
        const top = activeRegions.slice(0, 6);

        top.forEach(function(r) {
          const noteIdx = Math.floor(r.ry * currentScale.intervals.length / 6) + Math.floor(r.rx * 3 / 8);
          const pan = (r.rx / 8) * 2 - 1;
          const vol = 0.03 + r.density * 0.09;
          const wave = r.density > 0.3 ? 'triangle' : 'sine';
          playNote(scaleNote(noteIdx + 2), beatDur * 1.5, Math.min(vol, 0.11), wave, pan * 0.6);
        });

        const popDelta = totalAlive - life.prevPop;
        if (Math.abs(popDelta) > w * h * 0.03) {
          const accent = popDelta > 0 ? scaleNote(12) : scaleNote(0);
          playNote(accent, beatDur * 0.3, 0.04, 'sine', 0);
        }
        life.prevPop = totalAlive;
        return totalAlive;
      },

      render(ctx, canvasW, canvasH) {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvasW, canvasH);
        const cellW = canvasW / this.width;
        const cellH = canvasH / this.height;
        const regionW = this.width / this.REGION_COLS;
        const regionH = this.height / this.REGION_ROWS;

        for (let y = 0; y < this.height; y++) {
          for (let x = 0; x < this.width; x++) {
            if (this.grid[y * this.width + x]) {
              const rx = Math.floor(x / regionW);
              const ry = Math.floor(y / regionH);
              const hue = ((rx + ry * this.REGION_COLS) / (this.REGION_COLS * this.REGION_ROWS)) * 120 + 100;
              ctx.fillStyle = 'hsl(' + hue + ', 65%, 55%)';
              ctx.fillRect(x * cellW, y * cellH, cellW - 0.3, cellH - 0.3);
            }
          }
        }

        ctx.strokeStyle = 'rgba(124, 111, 224, 0.1)';
        ctx.lineWidth = 0.5;
        for (let rx = 1; rx < this.REGION_COLS; rx++) {
          const x = rx * regionW * cellW;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasH); ctx.stroke();
        }
        for (let ry = 1; ry < this.REGION_ROWS; ry++) {
          const y = ry * regionH * cellH;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasW, y); ctx.stroke();
        }
      }
    };

    // ── L-System ──
    const lsystem = {
      axiom: '',
      rules: {},
      current: '',
      drawSegments: [],
      segIdx: 0,
      segmentsPerTick: 4,
      angle: 25,
      generation: 0,

      PRESETS: [
        { name: 'Tree',       axiom: 'F', rules: { F: 'F[+F]F[-F]F' },         angle: 25, iters: 4 },
        { name: 'Dragon',     axiom: 'FX', rules: { X: 'X+YF+', Y: '-FX-Y' },  angle: 90, iters: 10 },
        { name: 'Sierpinski', axiom: 'F-G-G', rules: { F: 'F-G+F+G-F', G: 'GG' }, angle: 120, iters: 5 },
        { name: 'Koch',       axiom: 'F', rules: { F: 'F+F-F-F+F' },            angle: 90, iters: 4 },
        { name: 'Plant',      axiom: 'X', rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' }, angle: 25, iters: 5 },
        { name: 'Fern',       axiom: 'X', rules: { X: 'F-[[X]+X]+F[+FX]-X', F: 'FF' }, angle: 22.5, iters: 5 },
      ],

      init(preset) {
        preset = preset || this.PRESETS[0];
        this.axiom = preset.axiom;
        this.rules = preset.rules;
        this.angle = preset.angle;
        this.generation = 0;
        this.current = this.axiom;
        for (let i = 0; i < (preset.iters || 4); i++) {
          let next = '';
          for (let j = 0; j < this.current.length; j++) {
            const ch = this.current[j];
            next += this.rules[ch] || ch;
          }
          this.current = next;
          this.generation++;
        }
        this.computeSegments();
        this.segIdx = 0;
        this._boundsCache = null;
      },

      computeSegments() {
        this.drawSegments = [];
        let x = 0, y = 0, a = -90;
        const stack = [];
        const step = 5;
        for (let i = 0; i < this.current.length; i++) {
          const ch = this.current[i];
          if (ch === 'F' || ch === 'G') {
            const nx = x + Math.cos(a * Math.PI / 180) * step;
            const ny = y + Math.sin(a * Math.PI / 180) * step;
            this.drawSegments.push({ x1: x, y1: y, x2: nx, y2: ny, depth: stack.length, char: ch });
            x = nx; y = ny;
          } else if (ch === '+') {
            a += this.angle;
          } else if (ch === '-') {
            a -= this.angle;
          } else if (ch === '[') {
            stack.push({ x: x, y: y, a: a });
          } else if (ch === ']') {
            const s = stack.pop();
            if (s) { x = s.x; y = s.y; a = s.a; }
          }
        }
      },

      step() {
        const batch = [];
        for (let i = 0; i < this.segmentsPerTick && this.segIdx < this.drawSegments.length; i++) {
          batch.push(this.drawSegments[this.segIdx]);
          this.segIdx++;
        }
        return batch;
      },

      sonify(batch) {
        if (!audioCtx || batch.length === 0) return 0;
        const beatDur = 60 / bpm;
        var self = this;

        batch.forEach(function(seg, i) {
          var dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
          var angle = Math.atan2(dy, dx);
          var noteIdx = Math.floor(((angle + Math.PI) / (2 * Math.PI)) * 12) + seg.depth * 2;

          var bounds = self.getBounds();
          var pan = bounds.w > 0 ? ((seg.x2 - bounds.minX) / bounds.w) * 2 - 1 : 0;
          var vol = Math.max(0.03, 0.1 - seg.depth * 0.015);
          var wave = seg.depth < 2 ? 'triangle' : 'sine';

          var delay = (i / batch.length) * beatDur * 0.6;
          setTimeout(function() {
            playNote(scaleNote(noteIdx), beatDur * 0.5, vol, wave, pan * 0.5);
          }, delay * 1000);
        });

        if (this.segIdx % 20 === 0) {
          var progress = this.segIdx / this.drawSegments.length;
          playNote(scaleNote(Math.floor(progress * 15)), beatDur, 0.02, 'sine', 0);
        }

        return batch.length;
      },

      getBounds() {
        if (this._boundsCache) return this._boundsCache;
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < this.drawSegments.length; i++) {
          var s = this.drawSegments[i];
          minX = Math.min(minX, s.x1, s.x2);
          minY = Math.min(minY, s.y1, s.y2);
          maxX = Math.max(maxX, s.x1, s.x2);
          maxY = Math.max(maxY, s.y1, s.y2);
        }
        this._boundsCache = { minX: minX, minY: minY, maxX: maxX, maxY: maxY, w: maxX - minX || 1, h: maxY - minY || 1 };
        return this._boundsCache;
      },

      render(ctx, canvasW, canvasH) {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvasW, canvasH);
        if (this.drawSegments.length === 0) return;

        var bounds = this.getBounds();
        var pad = 20;
        var scaleX = (canvasW - pad * 2) / bounds.w;
        var scaleY = (canvasH - pad * 2) / bounds.h;
        var sc = Math.min(scaleX, scaleY);
        var offX = pad + (canvasW - pad * 2 - bounds.w * sc) / 2 - bounds.minX * sc;
        var offY = pad + (canvasH - pad * 2 - bounds.h * sc) / 2 - bounds.minY * sc;

        var drawn = Math.min(this.segIdx, this.drawSegments.length);
        for (var i = 0; i < drawn; i++) {
          var s = this.drawSegments[i];
          var isRecent = i >= drawn - this.segmentsPerTick * 3;
          var alpha = isRecent ? 1.0 : 0.3 + 0.5 * (i / drawn);
          var hue = 260 - s.depth * 20;
          var lightness = isRecent ? 65 : 40 + (i / drawn) * 15;

          ctx.strokeStyle = 'hsla(' + hue + ', 60%, ' + lightness + '%, ' + alpha + ')';
          ctx.lineWidth = isRecent ? 2 : Math.max(0.5, 1.5 - s.depth * 0.2);
          ctx.beginPath();
          ctx.moveTo(s.x1 * sc + offX, s.y1 * sc + offY);
          ctx.lineTo(s.x2 * sc + offX, s.y2 * sc + offY);
          ctx.stroke();

          if (isRecent && i >= drawn - this.segmentsPerTick) {
            ctx.strokeStyle = 'hsla(' + hue + ', 80%, 70%, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();
          }
        }
      },

      isDone() {
        return this.segIdx >= this.drawSegments.length;
      }
    };

    // ── Simulation Manager ──
    function resetSim() {
      stepCount = 0;
      switch (currentAlgo) {
        case 'automaton': automaton.init(); break;
        case 'life': life.init(); break;
        case 'lsystem': lsystem.init(); break;
      }
      renderSim();
      updateInfo(0);
    }

    function tick() {
      stepCount++;
      var noteInfo = 0;

      switch (currentAlgo) {
        case 'automaton':
          var row = automaton.step();
          noteInfo = automaton.sonify(row);
          break;
        case 'life':
          life.step();
          noteInfo = life.sonify();
          break;
        case 'lsystem':
          if (lsystem.isDone()) {
            lsystem.init();
            stepCount = 0;
          }
          var batch = lsystem.step();
          noteInfo = lsystem.sonify(batch);
          break;
      }

      renderSim();
      updateInfo(noteInfo);
    }

    function renderSim() {
      var simCanvas = document.getElementById('simCanvas');
      var ctx = simCanvas.getContext('2d');
      switch (currentAlgo) {
        case 'automaton': automaton.render(ctx, simCanvas.width, simCanvas.height); break;
        case 'life': life.render(ctx, simCanvas.width, simCanvas.height); break;
        case 'lsystem': lsystem.render(ctx, simCanvas.width, simCanvas.height); break;
      }
    }

    function updateInfo(noteInfo) {
      document.getElementById('stepNum').textContent = stepCount;
      switch (currentAlgo) {
        case 'automaton': {
          var aRow = automaton.rows[automaton.rows.length - 1];
          var aAlive = aRow ? Array.from(aRow).filter(function(c){return c;}).length : 0;
          document.getElementById('cellCount').textContent = aAlive;
          document.getElementById('density').textContent = aRow ? Math.round(aAlive / automaton.width * 100) + '%' : '0%';
          break;
        }
        case 'life': {
          var lAlive = life.grid ? Array.from(life.grid).filter(function(c){return c;}).length : 0;
          document.getElementById('cellCount').textContent = lAlive;
          document.getElementById('density').textContent = Math.round(lAlive / (life.width * life.height) * 100) + '%';
          break;
        }
        case 'lsystem': {
          document.getElementById('cellCount').textContent = lsystem.segIdx + '/' + lsystem.drawSegments.length;
          document.getElementById('density').textContent = Math.round(lsystem.segIdx / Math.max(1, lsystem.drawSegments.length) * 100) + '%';
          break;
        }
      }
      document.getElementById('noteCount').textContent = noteInfo;
    }

    // ── Waveform Visualizer ──
    function drawWaveform() {
      var canvas = document.getElementById('waveCanvas');
      var ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, w, h);

      if (analyser) {
        analyser.getByteFrequencyData(analyserData);
        var barCount = analyserData.length;
        var barH = h / barCount;

        for (var i = 0; i < barCount; i++) {
          var val = analyserData[i] / 255;
          if (val < 0.01) continue;
          var barW = val * w * 0.9;
          var hue = 260 - val * 60;
          ctx.fillStyle = 'hsla(' + hue + ', 70%, ' + (45 + val * 25) + '%, ' + (0.3 + val * 0.7) + ')';
          ctx.fillRect(w - barW, i * barH, barW, barH - 0.5);
        }
      }

      ctx.strokeStyle = 'rgba(124, 111, 224, 0.15)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.5, 0);
      ctx.lineTo(w * 0.5, h);
      ctx.stroke();

      requestAnimationFrame(drawWaveform);
    }

    // ── Param chips ──
    function buildParams() {
      var row = document.getElementById('paramRow');
      row.innerHTML = '';

      function addPresetChips(presets, initFn) {
        presets.forEach(function(p, i) {
          var chip = document.createElement('button');
          chip.className = 'param-chip' + (i === 0 ? ' active' : '');
          chip.textContent = p.name;
          chip.onclick = function() {
            initFn(p);
            stepCount = 0;
            row.querySelectorAll('.param-chip:not(.scale-chip)').forEach(function(c) { c.classList.remove('active'); });
            chip.classList.add('active');
            renderSim();
          };
          row.appendChild(chip);
        });
      }

      switch (currentAlgo) {
        case 'automaton':
          automaton.PRESETS.forEach(function(p) {
            var chip = document.createElement('button');
            chip.className = 'param-chip' + (p.rule === automaton.rule ? ' active' : '');
            chip.textContent = p.name;
            chip.onclick = function() {
              automaton.init(p.rule); stepCount = 0;
              row.querySelectorAll('.param-chip:not(.scale-chip)').forEach(function(c) { c.classList.remove('active'); });
              chip.classList.add('active');
              renderSim();
            };
            row.appendChild(chip);
          });
          break;

        case 'life':
          addPresetChips(life.PRESETS, function(p) { life.init(p.density); });
          break;

        case 'lsystem':
          addPresetChips(lsystem.PRESETS, function(p) { lsystem.init(p); });
          break;
      }

      // Scale separator
      var sep = document.createElement('span');
      sep.style.cssText = 'width:1px;height:14px;background:var(--border);margin:0 0.2rem;display:inline-block';
      row.appendChild(sep);

      Object.keys(SCALES).forEach(function(key) {
        var scale = SCALES[key];
        var chip = document.createElement('button');
        chip.className = 'param-chip scale-chip' + (currentScale === scale ? ' active' : '');
        chip.textContent = scale.name;
        chip.onclick = function() {
          currentScale = scale;
          document.getElementById('scaleIndicator').textContent = scale.name;
          buildParams();
        };
        row.appendChild(chip);
      });
    }

    // ── Playback ──
    function startPlaying() {
      if (playing) return;
      playing = true;
      document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
      scheduleTick();
    }

    function stopPlaying() {
      playing = false;
      document.getElementById('playBtn').innerHTML = '&#9654;';
      if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
    }

    function togglePlay() {
      if (playing) stopPlaying(); else startPlaying();
    }

    function scheduleTick() {
      if (!playing) return;
      tick();
      tickTimer = setTimeout(scheduleTick, 60000 / bpm);
    }

    // ── Canvas sizing ──
    function resizeCanvases() {
      var simCanvas = document.getElementById('simCanvas');
      var waveCanvas = document.getElementById('waveCanvas');
      simCanvas.width = simCanvas.clientWidth;
      simCanvas.height = simCanvas.clientHeight;
      waveCanvas.width = waveCanvas.clientWidth;
      waveCanvas.height = waveCanvas.clientHeight;
      renderSim();
    }

    // ── Switch algorithm ──
    function switchAlgo(algo) {
      var wasPlaying = playing;
      if (playing) stopPlaying();
      currentAlgo = algo;
      document.querySelectorAll('.algo-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.algo === algo);
      });
      var colors = { automaton: '#7c6fe040', life: '#4ade8030', lsystem: '#22d3ee30' };
      document.getElementById('bgGlow').style.background =
        'radial-gradient(circle, ' + (colors[algo] || '#7c6fe040') + ' 0%, transparent 70%)';
      resetSim();
      buildParams();
      if (wasPlaying) startPlaying();
    }

    // ── Init ──
    function initPage() {
      automaton.init(110);
      life.init(0.30);
      lsystem.init(lsystem.PRESETS[0]);
      resizeCanvases();
      buildParams();
      renderSim();
      updateInfo(0);
      drawWaveform();
      window.addEventListener('resize', resizeCanvases);
    }

    // ── Event Bindings ──
    document.getElementById('startOverlay').addEventListener('click', function() {
      document.getElementById('startOverlay').classList.add('hidden');
      initAudio();
      initPage();
      startPlaying();
    });

    document.getElementById('playBtn').addEventListener('click', togglePlay);
    document.getElementById('resetBtn').addEventListener('click', resetSim);

    document.getElementById('volumeSlider').addEventListener('input', function(e) {
      if (masterGain) masterGain.gain.value = parseFloat(e.target.value) * 0.25;
    });

    document.getElementById('speedSlider').addEventListener('input', function(e) {
      bpm = parseInt(e.target.value);
      document.getElementById('speedDisplay').textContent = bpm;
      if (playing) { clearTimeout(tickTimer); scheduleTick(); }
    });

    document.querySelectorAll('.algo-tab').forEach(function(tab) {
      tab.addEventListener('click', function() { switchAlgo(tab.dataset.algo); });
    });

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key) {
        case ' ': e.preventDefault(); togglePlay(); break;
        case 'r': case 'R': resetSim(); break;
        case '1': switchAlgo('automaton'); break;
        case '2': switchAlgo('life'); break;
        case '3': switchAlgo('lsystem'); break;
        case 'ArrowUp':
          e.preventDefault();
          bpm = Math.min(300, bpm + 10);
          document.getElementById('speedSlider').value = bpm;
          document.getElementById('speedDisplay').textContent = bpm;
          if (playing) { clearTimeout(tickTimer); scheduleTick(); }
          break;
        case 'ArrowDown':
          e.preventDefault();
          bpm = Math.max(40, bpm - 10);
          document.getElementById('speedSlider').value = bpm;
          document.getElementById('speedDisplay').textContent = bpm;
          if (playing) { clearTimeout(tickTimer); scheduleTick(); }
          break;
      }
    });

    // Pre-render before audio
    initPage();
  </script>
</body>
</html>
