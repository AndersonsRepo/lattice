<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lattice — Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      overflow: hidden;
      cursor: none;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    body.show-cursor { cursor: default; }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
    }

    #overlay {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      color: #c8c8d4;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      line-height: 1.6;
    }
    #overlay.visible { opacity: 1; }
    #overlay .type { color: #7c6fe0; text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.65rem; }
    #overlay .score { color: #4ade80; }
    #overlay .rule { color: #6e6e82; }

    #progress {
      position: fixed;
      bottom: 0; left: 0;
      height: 2px;
      background: #7c6fe040;
      transition: width 0.3s linear;
      z-index: 10;
    }

    #hint {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #6e6e82;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 20;
      text-align: center;
      line-height: 2;
    }
    #hint.visible { opacity: 1; }

    #pause-icon {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #c8c8d4;
      font-size: 3rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #pause-icon.visible { opacity: 0.6; }

    /* --- Top-left menu pill --- */
    .menu-pill {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 30;
      pointer-events: auto;
    }

    .menu-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      background: rgba(18, 18, 26, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(124, 111, 224, 0.15);
      color: #6e6e82;
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.5s ease, background 0.3s ease, border-color 0.3s ease;
      opacity: 0;
      text-decoration: none;
    }
    body.show-cursor .menu-toggle { opacity: 0.7; }
    .menu-toggle:hover {
      opacity: 1;
      background: rgba(18, 18, 26, 0.85);
      border-color: rgba(124, 111, 224, 0.3);
      color: #c8c8d4;
    }
    .menu-toggle .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #7c6fe0;
      animation: pulse 2s ease-in-out infinite;
    }

    .menu-dropdown {
      position: absolute;
      top: calc(100% + 0.5rem);
      left: 0;
      min-width: 180px;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(124, 111, 224, 0.15);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .menu-pill.open .menu-dropdown {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .menu-dropdown a {
      display: block;
      color: #c8c8d4;
      text-decoration: none;
      font-size: 0.7rem;
      padding: 0.35rem 0;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .menu-dropdown a:hover { color: #7c6fe0; }

    .menu-dropdown .divider {
      height: 1px;
      background: rgba(124, 111, 224, 0.12);
      margin: 0.5rem 0;
    }

    .menu-dropdown .controls {
      font-size: 0.6rem;
      color: #6e6e82;
      line-height: 1.8;
    }
    .menu-dropdown .controls kbd {
      display: inline-block;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      background: rgba(124, 111, 224, 0.1);
      border: 1px solid rgba(124, 111, 224, 0.2);
      font-family: inherit;
      font-size: 0.55rem;
      color: #c8c8d4;
      margin-right: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="menu-pill" id="menu-pill">
    <div class="menu-toggle" id="menu-toggle"><span class="dot"></span>LATTICE LIVE</div>
    <div class="menu-dropdown" id="menu-dropdown">
      <a href="index.html">&larr; Back to Gallery</a>
      <div class="divider"></div>
      <div class="controls">
        <kbd>Space</kbd> Pause / Resume<br>
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> Navigate pieces<br>
        <kbd>F</kbd> Fullscreen<br>
        <kbd>Click</kbd> Next piece
      </div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="lattice-perf.js"></script>
  <div id="overlay">
    <div class="type" id="info-type"></div>
    <div class="score" id="info-score"></div>
    <div class="rule" id="info-rule"></div>
  </div>
  <div id="progress"></div>
  <div id="hint">
    click anywhere to begin
  </div>
  <div id="pause-icon">&#10073;&#10073;</div>

<script>
// ============================================================
//  Lattice Live — Meditative generative art experience
//  Ports core simulation engines to browser Canvas
// ============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
const pauseIcon = document.getElementById('pause-icon');

// --- Color palettes per type (smooth gradient, 256 stops) ---
const TYPE_GRADIENTS = {
  '1d':                 ['#0a0a0f', '#1a1a3e', '#3b2d8b', '#6b4edb', '#9d7af5', '#c8abff', '#e8d8ff', '#ffffff'],
  '2d':                 ['#0a0a0f', '#0d2818', '#166b3a', '#22a95c', '#4ade80', '#7af5a8', '#b8ffd4', '#e8fff0'],
  'lsystem':            ['#0a0a0f', '#2d1a0a', '#6b3a0d', '#a85c16', '#db8b22', '#f5b84a', '#ffe088', '#fff4cc'],
  'reaction-diffusion': ['#0a0a0f', '#1a0a2d', '#3b0d6b', '#6b16a8', '#a822db', '#d44af5', '#f088ff', '#ffccff'],
  'voronoi':            ['#0a0a0f', '#0a1a2d', '#0d3b6b', '#166ba8', '#22a8db', '#4ad4f5', '#88eeff', '#ccf8ff'],
  'wfc':                ['#0a0a0f', '#2d0a0a', '#6b0d1a', '#a8163b', '#db226b', '#f54a9d', '#ff88c8', '#ffccee'],
  'spirograph':         ['#0a0a0f', '#1a2d0a', '#3b6b0d', '#6ba816', '#a8db22', '#d4f54a', '#eeff88', '#ffffcc'],
  'attractor':          ['#0a0a0f', '#2d1a1a', '#6b2d2d', '#a84a3b', '#db6b4a', '#f59d6b', '#ffc8a0', '#ffe8d8'],
  'julia':              ['#0a0a0f', '#0a2d2d', '#0d6b5b', '#16a88a', '#22dbb5', '#4af5d4', '#88ffe8', '#ccfff4'],
  'noise':              ['#0a0a0f', '#1a1a0a', '#3b3b0d', '#6b6b16', '#a8a822', '#d4d44a', '#eeff88', '#ffffcc'],
  'flowfield':          ['#0a0a0f', '#0a1a1a', '#0d3b3b', '#166b6b', '#22a8a8', '#4ad4d4', '#88eeff', '#ccffff'],
};

// Parse hex color to [r,g,b]
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Build a 256-stop lookup table from gradient stops
function buildLUT(type) {
  const stops = (TYPE_GRADIENTS[type] || TYPE_GRADIENTS['2d']).map(hexToRgb);
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (stops.length - 1);
    const idx = Math.floor(t);
    const frac = t - idx;
    const a = stops[Math.min(idx, stops.length - 1)];
    const b = stops[Math.min(idx + 1, stops.length - 1)];
    lut[i * 3]     = Math.round(a[0] + (b[0] - a[0]) * frac);
    lut[i * 3 + 1] = Math.round(a[1] + (b[1] - a[1]) * frac);
    lut[i * 3 + 2] = Math.round(a[2] + (b[2] - a[2]) * frac);
  }
  return lut;
}

// --- Deterministic PRNG (Mulberry32) ---

// ============================================================
//  Rendering
// ============================================================
let dpr, W, H;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Performance: ImageData renderer + monitor + adaptive frame budget
const renderer = new LatticePerf.FastRenderer();
const perfMon = new LatticePerf.PerfMonitor();
const frameBudget = new LatticePerf.FrameBudget(30);

// ALL engines run in WebWorkers with double-buffering (autoStep: true).
// The worker computes the next frame while the main thread renders the current one.
// This keeps the main thread free for 60fps rendering regardless of engine complexity.
const workerBridge = new LatticePerf.WorkerBridge('lattice-worker.js');
const nextWorkerBridge = new LatticePerf.WorkerBridge('lattice-worker.js');

function renderToCanvas(values, simW, simH, lut, alpha) {
  renderer.renderCentered(ctx, values, simW, simH, lut, alpha, W, H);
}

// ============================================================
//  Piece Manager
// ============================================================
let pieces = [];
let currentIdx = 0;
let currentLut = null;
let nextLut = null;
let transitioning = false;
let transitionAlpha = 0;
let paused = false;
let started = false;
let pieceTimer = 0;
const PIECE_DURATION = 45000; // 45 seconds per piece
const TRANSITION_DURATION = 2000;

function typeLabel(type) {
  return {
    '1d': '1D Automaton', '2d': '2D Life-like', 'lsystem': 'L-System',
    'reaction-diffusion': 'Reaction-Diffusion', 'voronoi': 'Voronoi',
    'wfc': 'Wave Function Collapse', 'spirograph': 'Spirograph',
    'attractor': 'Strange Attractor', 'julia': 'Julia Set',
    'noise': 'Fractal Noise', 'flowfield': 'Flow Field',
  }[type] || type;
}

function ruleStr(genome) {
  const r = genome.rule;
  switch (genome.type) {
    case '1d': return `Rule ${r.number}`;
    case '2d': return `B${r.birth.join('')}/S${r.survive.join('')}`;
    case 'lsystem': return `angle=${r.angle}\u00B0, iter=${r.iterations}`;
    case 'reaction-diffusion': return `f=${r.feed.toFixed(3)} k=${r.kill.toFixed(3)}`;
    case 'voronoi': return `${r.seeds}pts ${r.mode}`;
    case 'wfc': return `${r.tileCount}tiles ${r.symmetry}`;
    case 'spirograph': return `${r.layers.length} layers`;
    case 'attractor': return `${r.variant}`;
    case 'julia': return `c=${r.cReal.toFixed(3)}+${r.cImag.toFixed(3)}i`;
    case 'noise': return `scale=${r.scale.toFixed(2)} warp=${r.warp.toFixed(1)}`;
    case 'flowfield': return `${r.particles}p curl=${r.curl.toFixed(1)}`;
    default: return '';
  }
}

function makeSimGenome(piece) {
  return {
    ...piece.genome,
    width: Math.min(piece.genome.width * 2, 120),
    height: Math.min(piece.genome.height * 2, 80),
  };
}

function showPiece(idx) {
  const piece = pieces[idx];
  if (!piece) return;
  const simGenome = makeSimGenome(piece);
  const lt = buildLUT(piece.genome.type);

  if (currentLut) {
    // Crossfade: init next worker, keep current rendering
    nextLut = lt;
    transitioning = true;
    transitionAlpha = 0;
    nextWorkerBridge.init(simGenome, { autoStep: true });
  } else {
    // First piece: init directly
    currentLut = lt;
    workerBridge.init(simGenome, { autoStep: true });
  }

  // Update overlay
  document.getElementById('info-type').textContent = typeLabel(piece.genome.type);
  document.getElementById('info-score').textContent = `Score ${(piece.score * 100).toFixed(1)}%`;
  document.getElementById('info-rule').textContent = `Gen ${piece.generation} \u2014 ${ruleStr(piece.genome)}`;
  overlay.classList.add('visible');

  pieceTimer = 0;
}

function nextPiece() {
  currentIdx = (currentIdx + 1) % pieces.length;
  showPiece(currentIdx);
}

function prevPiece() {
  currentIdx = (currentIdx - 1 + pieces.length) % pieces.length;
  showPiece(currentIdx);
}

// ============================================================
//  Main Loop
// ============================================================
let lastTime = 0;
let frameCount = 0;

function loop(time) {
  requestAnimationFrame(loop);
  if (!started) return;

  const dt = lastTime ? time - lastTime : 16;
  lastTime = time;
  perfMon.start('frame');

  if (paused) { perfMon.end('frame'); return; }

  // Adaptive frame rate: skip render when behind budget (keeps UI responsive)
  if (!frameBudget.shouldStep()) { perfMon.end('frame'); return; }

  // Clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  perfMon.start('render');

  // All engines run in WebWorkers with double-buffering.
  // Main thread only reads the latest values and renders — zero sim cost.
  const currentValues = workerBridge.getValues();
  if (currentValues && currentLut) {
    const simW = workerBridge.w, simH = workerBridge.h;
    perfMon.record('workerSim', workerBridge.simMs);

    if (transitioning) {
      renderToCanvas(currentValues, simW, simH, currentLut, 1 - transitionAlpha);
    } else {
      renderToCanvas(currentValues, simW, simH, currentLut, 1);
    }
  }

  // Transition: crossfade from current to next
  if (transitioning && nextLut) {
    transitionAlpha = Math.min(1, transitionAlpha + dt / TRANSITION_DURATION);

    const nextValues = nextWorkerBridge.getValues();
    if (nextValues) {
      renderToCanvas(nextValues, nextWorkerBridge.w, nextWorkerBridge.h, nextLut, transitionAlpha);
    }

    if (transitionAlpha >= 1) {
      // Swap: promote next worker to current, destroy old
      workerBridge.destroy();
      currentLut = nextLut;
      nextLut = null;
      transitioning = false;
      // Swap worker internals: current gets the next worker's active state
      _swapWorkerBridges(workerBridge, nextWorkerBridge);
    }
  }

  // Auto-advance timer
  pieceTimer += dt;
  progress.style.width = `${(pieceTimer / PIECE_DURATION) * 100}%`;
  if (pieceTimer >= PIECE_DURATION) {
    nextPiece();
  }

  // Cached vignette overlay (gradient created once, reused every frame)
  renderer.drawVignette(ctx, W, H, 0.3, 0.7, 0.5);
  perfMon.end('render');
  perfMon.end('frame');

  // Log perf stats periodically (visible in DevTools console)
  if (frameCount % 300 === 0 && frameCount > 0) {
    console.log('[lattice perf]', perfMon.formatReport());
  }

  frameCount++;
}

// Swap internal state between two WorkerBridge instances (avoids destroy/recreate)
function _swapWorkerBridges(a, b) {
  const keys = ['_worker', '_buffer', '_values', '_pending', '_ready',
                '_simW', '_simH', '_simMs', '_getValMs', '_destroyed',
                '_onReady', '_autoStep', '_frameCount'];
  for (const k of keys) {
    const tmp = a[k];
    a[k] = b[k];
    b[k] = tmp;
  }
  // Re-bind message handlers to their new owners
  if (a._worker) a._worker.onmessage = (e) => a._onMessage(e);
  if (b._worker) b._worker.onmessage = (e) => b._onMessage(e);
}

// ============================================================
//  Controls
// ============================================================
let cursorTimeout;

function showCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => document.body.classList.remove('show-cursor'), 2000);
}

document.addEventListener('mousemove', showCursor);

// Menu pill toggle
const menuPill = document.getElementById('menu-pill');
const menuToggle = document.getElementById('menu-toggle');
menuToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  menuPill.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!menuPill.contains(e.target)) menuPill.classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if (!started) { start(); return; }
  switch (e.key) {
    case ' ':
      e.preventDefault();
      paused = !paused;
      pauseIcon.classList.toggle('visible', paused);
      break;
    case 'ArrowRight': nextPiece(); break;
    case 'ArrowLeft': prevPiece(); break;
    case 'f':
      if (!document.fullscreenElement) canvas.requestFullscreen?.();
      else document.exitFullscreen?.();
      break;
  }
});

canvas.addEventListener('click', (e) => {
  // Don't trigger if clicking the menu area
  if (menuPill.contains(e.target)) return;
  if (!started) start();
  else nextPiece();
});

function start() {
  if (started) return;
  started = true;
  hint.classList.remove('visible');
  if (pieces.length > 0) {
    // Shuffle pieces for variety
    for (let i = pieces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }
    showPiece(0);
  }
}

// ============================================================
//  Supabase live data (anon key — safe for browser)
// ============================================================
const SUPABASE_URL = 'https://fwwjtlafcrzeqfuqmexs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3d2p0bGFmY3J6ZXFmdXFtZXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNjAzNTAsImV4cCI6MjA4MzczNjM1MH0.caaW2yQl0o9WGfwvNRrcdPZXmYIZKgBaCpqzc-gXt5M';

async function fetchLiveData() {
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Accept-Profile': 'lattice',
    'Accept': 'application/json',
  };
  const base = SUPABASE_URL + '/rest/v1';
  const [hofRes, popRes, archiveRes] = await Promise.all([
    fetch(base + '/hall_of_fame?order=score.desc&limit=20', { headers }),
    fetch(base + '/population?order=score.desc&limit=14', { headers }),
    fetch(base + '/archive?order=score.desc&limit=20', { headers }),
  ]);
  if (!hofRes.ok || !popRes.ok || !archiveRes.ok) throw new Error('Supabase fetch failed');
  const [hofData, popData, archiveData] = await Promise.all([hofRes.json(), popRes.json(), archiveRes.json()]);
  const mapPiece = (p) => ({
    id: p.id, genome: p.genome, score: p.score, metrics: p.metrics,
    rendered: p.rendered, generation: p.generation, createdAt: p.created_at || p.inducted_at,
  });
  return {
    hallOfFame: hofData.map(mapPiece),
    pieces: popData.map(mapPiece),
    archive: archiveData.map(mapPiece),
  };
}

// ============================================================
//  Load Gallery Data
// ============================================================
async function init() {
  try {
    let data;
    try {
      data = await fetchLiveData();
      console.log('[lattice] Loaded live data from Supabase');
    } catch (e) {
      const res = await fetch('./gallery.json');
      data = await res.json();
      console.log('[lattice] Loaded static gallery.json (Supabase unavailable)');
    }

    // Collect all pieces with genomes (hall of fame first, then current, then archive)
    const seen = new Set();
    const addPiece = (p) => {
      if (!p.genome || seen.has(p.id)) return;
      seen.add(p.id);
      pieces.push(p);
    };
    (data.hallOfFame || []).sort((a, b) => b.score - a.score).forEach(addPiece);
    (data.pieces || []).sort((a, b) => b.score - a.score).forEach(addPiece);
    (data.archive || []).sort((a, b) => b.score - a.score).slice(0, 20).forEach(addPiece);

    if (pieces.length === 0) {
      hint.textContent = 'No pieces yet. Run an evolution cycle first.';
      hint.classList.add('visible');
      return;
    }

    hint.classList.add('visible');
  } catch (e) {
    hint.textContent = 'Could not load gallery data.';
    hint.classList.add('visible');
  }

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
